name: Department Access Port Verification
on:
  push:
    branches: [refactor/settings-department-access-port]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/department-port-verify.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full verification and record result
        shell: bash
        run: |
          set +e
          mkdir -p verification
          RESULT=verification/department-port-result.txt
          : > "$RESULT"
          STATUS=0
          run_check() {
            echo "===== $* =====" >> "$RESULT"
            "$@" >> "$RESULT" 2>&1
            CODE=$?
            echo "exit=$CODE" >> "$RESULT"
            echo >> "$RESULT"
            if [ $CODE -ne 0 ]; then STATUS=1; fi
          }

          run_check node --check scripts/test-department-iam.js
          run_check node --check scripts/test-settings-departments.js
          run_check node --check scripts/test-settings-department-chart.js
          run_check node --check scripts/test-route-access.js
          run_check node --check scripts/test-sidebar-access.js
          run_check node --check scripts/verify-department-access-architecture.js

          for f in \
            src/000_server/020_schema/user_db_schema.gs \
            src/000_server/020_schema/user_db_integrity.gs \
            src/000_server/030_auth/auth_api.gs \
            src/000_server/030_auth/auth_page_access.gs \
            src/000_server/040_iam/041_users/users_query_service.gs \
            src/000_server/040_iam/044_departments/departments_sheet_dao.gs \
            src/000_server/040_iam/044_departments/departments_query_service.gs \
            src/000_server/070_settings/070_common/settings_access.gs \
            src/000_server/070_settings/070_common/settings_shell_query_service.gs \
            src/000_server/070_settings/071_users/settings_users_api.gs \
            src/000_server/070_settings/071_users/settings_users_query_service.gs \
            src/000_server/070_settings/071_users/settings_users_department_service.gs \
            src/000_server/070_settings/074_departments/settings_departments_api.gs \
            src/000_server/070_settings/074_departments/settings_departments_query_service.gs \
            src/000_server/Code.js; do
            cp "$f" /tmp/check.js
            run_check node --check /tmp/check.js
          done

          python3 - <<'PY' > /tmp/inline-check.txt 2>&1
          from pathlib import Path
          import re, subprocess, sys
          files = [
              'src/100_common/app_shell_js.html',
              'src/300_settings/common/settings_common_js.html',
              'src/300_settings/310_users/settings_users_js.html',
              'src/300_settings/340_departments/settings_departments_js.html',
          ]
          for file in files:
              text = Path(file).read_text(encoding='utf-8')
              match = re.search(r'<script>(.*)</script>', text, re.S)
              if not match:
                  raise SystemExit('missing script block: ' + file)
              out = Path('/tmp/' + Path(file).stem + '.js')
              out.write_text(match.group(1), encoding='utf-8')
              subprocess.run(['node', '--check', str(out)], check=True)
          print('inline js syntax passed')
          PY
          CODE=$?
          echo '===== inline js syntax =====' >> "$RESULT"
          cat /tmp/inline-check.txt >> "$RESULT"
          echo "exit=$CODE" >> "$RESULT"
          echo >> "$RESULT"
          if [ $CODE -ne 0 ]; then STATUS=1; fi

          for script in \
            scripts/test-department-iam.js \
            scripts/test-settings-departments.js \
            scripts/test-settings-department-chart.js \
            scripts/test-route-access.js \
            scripts/test-sidebar-access.js \
            scripts/verify-department-access-architecture.js \
            scripts/test-core.js \
            scripts/test-auth-iam.js \
            scripts/test-settings.js \
            scripts/test-accounting.js \
            scripts/test-event.js \
            scripts/test-student-fee.js \
            scripts/test-student-fee-frontend.js \
            scripts/test-mypage-auth.js \
            scripts/test-mypage-routing.js \
            scripts/test-mypage-frontend.js \
            scripts/verify-server-architecture.js \
            scripts/verify-auth-iam-architecture.js \
            scripts/verify-settings-architecture.js \
            scripts/verify-accounting-architecture.js \
            scripts/verify-event-architecture.js \
            scripts/verify-student-fee-architecture.js \
            scripts/verify-student-fee-frontend.js \
            scripts/verify-ui-system-migration.js \
            scripts/verify-mypage-architecture.js; do
            run_check node "$script"
          done

          if [ $STATUS -eq 0 ]; then
            printf 'FINAL=PASS\nverified_sha=%s\n' "$GITHUB_SHA" >> "$RESULT"
          else
            printf 'FINAL=FAIL\nverified_sha=%s\n' "$GITHUB_SHA" >> "$RESULT"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT"
          git commit -m 'ci: record department port verification'
          git push
          exit $STATUS
