name: Auth MyPage port

on:
  push:
    branches:
      - refactor/auth-mypage-port

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auth MyPage contract
        run: node scripts/test-mypage-auth.js
      - name: Existing Auth IAM regression
        run: node scripts/test-auth-iam.js
