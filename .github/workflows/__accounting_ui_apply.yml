name: Accounting UI apply

on:
  push:
    branches:
      - refactor/accounting-standalone-port
    paths:
      - scripts/__apply_accounting_ui.py
      - .github/workflows/__accounting_ui_apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/accounting-standalone-port
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply UI patch
        run: python3 scripts/__apply_accounting_ui.py
      - name: Static syntax checks
        run: |
          node --check scripts/test-accounting.js
          node --check scripts/verify-accounting-architecture.js
          node --check scripts/verify-ui-system-migration.js
          find src/000_server/060_accounting -name '*.gs' -print0 | while IFS= read -r -d '' file; do cp "$file" /tmp/__gas_check.js; node --check /tmp/__gas_check.js; done
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for p in Path('src/400_accounting').rglob('*_js.html'):
              text=p.read_text(encoding='utf-8')
              m=re.search(r'<script>(.*)</script>', text, re.S)
              if not m: continue
              f=Path('/tmp/accounting_ui_check.js'); f.write_text(m.group(1), encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          PY
      - name: Accounting server regressions
        run: |
          node scripts/test-accounting.js
          node scripts/verify-accounting-architecture.js
      - name: Shared UI verifier
        run: node scripts/verify-ui-system-migration.js
      - name: Commit verified UI wiring
        run: |
          rm -f scripts/__apply_accounting_ui.py .github/workflows/__accounting_ui_apply.yml
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "feat: wire accounting management ui"
          git push origin HEAD:refactor/accounting-standalone-port
