name: Accounting DB v2

on:
  push:
    branches:
      - design/accounting-db-v2
  pull_request:
    branches:
      - main

jobs:
  schema-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-accounting-db-v2-schema.js
