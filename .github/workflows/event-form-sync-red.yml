name: Event Form Sync RED
on:
  push:
    branches: [refactor/event-form-sync-port]
    paths:
      - scripts/test-event-form-sync-mapper.js
      - .github/workflows/event-form-sync-red.yml
permissions:
  contents: write
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify expected mapper failure
        run: |
          if node scripts/test-event-form-sync-mapper.js; then
            echo 'Expected RED failure but test passed'
            exit 1
          fi
          mkdir -p verification
          printf 'red_verified_sha=%s\n' "$GITHUB_SHA" > verification/event-form-sync-red.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/event-form-sync-red.txt
          git commit -m 'ci: record event form sync red verification'
          git push
