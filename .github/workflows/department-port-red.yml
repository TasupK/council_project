name: Department port RED
on:
  push:
    branches: [refactor/settings-department-access-port]
    paths:
      - scripts/test-department-iam.js
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-department-iam.js
