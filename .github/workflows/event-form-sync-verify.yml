name: Event Form Sync Full Verification
on:
  push:
    branches: [refactor/event-form-sync-port]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/event-form-sync-verify.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full verification and record result
        shell: bash
        run: |
          set +e
          mkdir -p verification
          RESULT=verification/event-form-sync-result.txt
          : > "$RESULT"
          STATUS=0
          run_check() {
            echo "===== $* =====" >> "$RESULT"
            "$@" >> "$RESULT" 2>&1
            CODE=$?
            echo "exit=$CODE" >> "$RESULT"
            echo >> "$RESULT"
            if [ $CODE -ne 0 ]; then STATUS=1; fi
          }

          for script in \
            scripts/test-event-form-sync-mapper.js \
            scripts/test-event-form-sync-service.js \
            scripts/test-event-form-sync-api.js \
            scripts/test-event-form-sync-frontend.js \
            scripts/verify-event-form-sync-architecture.js; do
            run_check node --check "$script"
          done

          for file in \
            src/000_server/050_event/050_common/event_access.gs \
            src/000_server/050_event/051_events/events_query_service.gs \
            src/000_server/050_event/052_applicants/applicants_api.gs \
            src/000_server/050_event/052_applicants/applicants_sheet_dao.gs \
            src/000_server/050_event/052_applicants/applicants_form_reader.gs \
            src/000_server/050_event/052_applicants/applicants_form_mapper.gs \
            src/000_server/050_event/052_applicants/applicants_form_sync_service.gs; do
            cp "$file" /tmp/check.js
            run_check node --check /tmp/check.js
          done

          python3 - <<'PY' > /tmp/event-form-inline.txt 2>&1
          from pathlib import Path
          import re, subprocess
          text = Path('src/600_event/620_detail/event_form_sync_js.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*)</script>', text, re.S)
          if not match:
              raise SystemExit('missing script block')
          Path('/tmp/event_form_sync.js').write_text(match.group(1), encoding='utf-8')
          subprocess.run(['node', '--check', '/tmp/event_form_sync.js'], check=True)
          print('event form inline syntax passed')
          PY
          CODE=$?
          echo '===== event form inline syntax =====' >> "$RESULT"
          cat /tmp/event-form-inline.txt >> "$RESULT"
          echo "exit=$CODE" >> "$RESULT"
          echo >> "$RESULT"
          if [ $CODE -ne 0 ]; then STATUS=1; fi

          for script in \
            scripts/test-event-form-sync-mapper.js \
            scripts/test-event-form-sync-service.js \
            scripts/test-event-form-sync-api.js \
            scripts/test-event-form-sync-frontend.js \
            scripts/verify-event-form-sync-architecture.js \
            scripts/test-core.js \
            scripts/test-auth-iam.js \
            scripts/test-settings.js \
            scripts/test-accounting.js \
            scripts/test-event.js \
            scripts/test-student-fee.js \
            scripts/test-student-fee-frontend.js \
            scripts/test-mypage-auth.js \
            scripts/test-mypage-routing.js \
            scripts/test-mypage-frontend.js \
            scripts/test-department-iam.js \
            scripts/test-settings-departments.js \
            scripts/test-settings-department-chart.js \
            scripts/test-route-access.js \
            scripts/test-sidebar-access.js \
            scripts/verify-server-architecture.js \
            scripts/verify-auth-iam-architecture.js \
            scripts/verify-settings-architecture.js \
            scripts/verify-accounting-architecture.js \
            scripts/verify-event-architecture.js \
            scripts/verify-student-fee-architecture.js \
            scripts/verify-student-fee-frontend.js \
            scripts/verify-ui-system-migration.js \
            scripts/verify-mypage-architecture.js \
            scripts/verify-department-access-architecture.js; do
            if [ -f "$script" ]; then run_check node "$script"; fi
          done

          if [ $STATUS -eq 0 ]; then
            printf 'FINAL=PASS\nverified_sha=%s\n' "$GITHUB_SHA" >> "$RESULT"
          else
            printf 'FINAL=FAIL\nverified_sha=%s\n' "$GITHUB_SHA" >> "$RESULT"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT"
          git commit -m 'ci: record event form sync verification'
          git push
          exit $STATUS
