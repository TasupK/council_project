name: Internal Function Naming Verify

on:
  push:
    branches:
      - refactor/system-consistency-hardening

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run full verification
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p verification
          LOG=verification/internal-function-naming-result.txt
          : > "$LOG"
          echo "verified_sha=${GITHUB_SHA}" >> "$LOG"
          status=0

          echo '=== syntax ===' >> "$LOG"
          node - <<'NODE' >> "$LOG" 2>&1
          const fs=require('fs'),path=require('path'),vm=require('vm');
          function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);}
          const files=walk('src/000_server').filter(f=>f.endsWith('.gs'));
          for(const f of files){new vm.Script(fs.readFileSync(f,'utf8'),{filename:f});}
          console.log(`syntax passed: ${files.length} files`);
          NODE
          [ $? -eq 0 ] || status=1

          echo '=== naming verifier ===' >> "$LOG"
          node scripts/verify-internal-function-naming.js >> "$LOG" 2>&1
          [ $? -eq 0 ] || status=1

          echo '=== tests ===' >> "$LOG"
          for f in scripts/test-*.js; do
            echo "--- $f" >> "$LOG"
            node "$f" >> "$LOG" 2>&1
            [ $? -eq 0 ] || status=1
          done

          echo '=== architecture ===' >> "$LOG"
          for f in scripts/verify-*.js; do
            echo "--- $f" >> "$LOG"
            node "$f" >> "$LOG" 2>&1
            [ $? -eq 0 ] || status=1
          done

          if [ "$status" -eq 0 ]; then echo 'FINAL=PASS' >> "$LOG"; else echo 'FINAL=FAIL' >> "$LOG"; fi
          exit 0
      - name: Commit verification result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verification/internal-function-naming-result.txt
          git commit -m 'test: record internal naming verification result' || exit 0
          git push
