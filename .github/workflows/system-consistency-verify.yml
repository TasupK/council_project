name: System Consistency Verify

on:
  push:
    branches:
      - refactor/system-consistency-hardening
    paths-ignore:
      - 'verification/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused API access contract
        id: focused
        continue-on-error: true
        run: node scripts/test-api-access-contract.js
      - name: Record result
        if: always()
        run: |
          mkdir -p verification
          {
            echo "verified_sha=${GITHUB_SHA}"
            echo "focused=${{ steps.focused.outcome }}"
          } > verification/system-consistency-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/system-consistency-result.txt
          git commit -m "chore: record system consistency verification [skip ci]" || true
          git push
      - name: Fail if focused test failed
        if: steps.focused.outcome != 'success'
        run: exit 1
