name: System Consistency Verify

on:
  push:
    branches:
      - refactor/system-consistency-hardening
    paths-ignore:
      - 'verification/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Common API access contract
        id: api_access
        continue-on-error: true
        run: node scripts/test-api-access-contract.js
      - name: Domain access resolvers
        id: domain_access
        continue-on-error: true
        run: node scripts/test-domain-access-resolvers.js
      - name: Student Fee mutation consistency
        id: student_fee_mutation
        continue-on-error: true
        run: node scripts/test-student-fee-mutation-consistency.js
      - name: Event consistency hardening
        id: event_consistency
        continue-on-error: true
        run: node scripts/test-event-consistency-hardening.js
      - name: Accounting money validation
        id: accounting_money
        continue-on-error: true
        run: node scripts/test-accounting-money-validation.js
      - name: IAM menu semantics
        id: iam_menu
        continue-on-error: true
        run: node scripts/test-iam-menu-semantics.js
      - name: OperationDB business-key integrity
        id: business_keys
        continue-on-error: true
        run: node scripts/test-operation-business-key-integrity.js
      - name: System consistency architecture
        id: architecture
        continue-on-error: true
        run: node scripts/verify-system-consistency-architecture.js
      - name: Full regression
        id: regression
        continue-on-error: true
        run: |
          mkdir -p verification
          set -o pipefail
          {
            for file in scripts/test-*.js; do
              echo "== $file =="
              node "$file"
            done
            for file in scripts/verify-*.js; do
              echo "== $file =="
              node "$file"
            done
          } > verification/full-regression.log 2>&1
      - name: Record result
        if: always()
        run: |
          mkdir -p verification
          {
            echo "verified_sha=${GITHUB_SHA}"
            echo "api_access=${{ steps.api_access.outcome }}"
            echo "domain_access=${{ steps.domain_access.outcome }}"
            echo "student_fee_mutation=${{ steps.student_fee_mutation.outcome }}"
            echo "event_consistency=${{ steps.event_consistency.outcome }}"
            echo "accounting_money=${{ steps.accounting_money.outcome }}"
            echo "iam_menu=${{ steps.iam_menu.outcome }}"
            echo "business_keys=${{ steps.business_keys.outcome }}"
            echo "architecture=${{ steps.architecture.outcome }}"
            echo "regression=${{ steps.regression.outcome }}"
          } > verification/system-consistency-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/system-consistency-result.txt verification/full-regression.log
          git commit -m "chore: record system consistency verification [skip ci]" || true
          git push
      - name: Fail on verification failure
        if: steps.api_access.outcome != 'success' || steps.domain_access.outcome != 'success' || steps.student_fee_mutation.outcome != 'success' || steps.event_consistency.outcome != 'success' || steps.accounting_money.outcome != 'success' || steps.iam_menu.outcome != 'success' || steps.business_keys.outcome != 'success' || steps.architecture.outcome != 'success' || steps.regression.outcome != 'success'
        run: exit 1
