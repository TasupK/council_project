name: Public API Naming Migration

on:
  push:
    branches:
      - refactor/system-consistency-hardening
    paths:
      - '.github/workflows/public-api-naming-migration.yml'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-consistency-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify RED guardrail
        shell: bash
        run: |
          mkdir -p verification
          set +e
          node scripts/verify-public-api-naming.js > verification/public-api-naming-red.log 2>&1
          status=$?
          set -e
          cat verification/public-api-naming-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected public API naming verifier to fail before migration.'
            exit 1
          fi

      - name: Migrate Event API symbols
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const rename = {
            api_getEventList: 'api_getEvents',
            api_getEventForEdit: 'api_getEvent',
            api_getEventDetail: 'api_getEventOverview',
            api_getApplicantList: 'api_getEventApplicants',
            api_getApplicantDetail: 'api_getEventApplicant',
            api_processApplicant: 'api_processEventApplicant',
            api_syncApplicantsFromForms: 'api_syncEventApplicantsFromForms',
            api_getAttendanceList: 'api_getEventAttendances',
            api_applyAttendanceChanges: 'api_applyEventAttendanceChanges',
            api_getEventRefundList: 'api_getEventRefunds'
          };
          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e => {
              const p=path.join(dir,e.name); return e.isDirectory()?walk(p):[p];
            });
          }
          const files=['src','scripts'].flatMap(walk)
            .filter(f => /\.(gs|js|html)$/.test(f))
            .filter(f => f.replace(/\\/g,'/') !== 'scripts/verify-public-api-naming.js');
          for (const file of files) {
            let s=fs.readFileSync(file,'utf8'), n=s;
            for (const [a,b] of Object.entries(rename)) n=n.replace(new RegExp('\\b'+a+'\\b','g'),b);
            if(n!==s) fs.writeFileSync(file,n);
          }
          NODE

      - name: Run Event tests
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/test-event*.js; do echo "== $file =="; node "$file"; done
          node scripts/verify-event-architecture.js
          node scripts/verify-event-form-sync-architecture.js

      - name: Migrate Accounting API symbols
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const rename = {
            api_getLedgerList: 'api_getLedgerEntries',
            api_getLedgerDetail: 'api_getLedgerEntry',
            api_saveLedgerDraft: 'api_createLedgerDraft',
            api_getEvidenceFileContent: 'api_getLedgerEvidenceFileContent',
            api_getEvidenceAuditList: 'api_getLedgerEvidenceAudits',
            api_uploadBankTransactions: 'api_processBankTransactionUpload',
            api_runReconciliation: 'api_processReconciliation',
            api_getReconciliationList: 'api_getReconciliations',
            api_getReconciliationDetail: 'api_getReconciliation',
            api_linkReconciliation: 'api_applyReconciliationLink',
            api_createLedgerFromReconciliation: 'api_createLedgerEntryFromReconciliation',
            api_generateSettlementReport: 'api_createSettlementReport',
            api_getSettlementReportList: 'api_getSettlementReports'
          };
          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e => {
              const p=path.join(dir,e.name); return e.isDirectory()?walk(p):[p];
            });
          }
          const files=['src','scripts'].flatMap(walk)
            .filter(f => /\.(gs|js|html)$/.test(f))
            .filter(f => f.replace(/\\/g,'/') !== 'scripts/verify-public-api-naming.js');
          for (const file of files) {
            let s=fs.readFileSync(file,'utf8'), n=s;
            for (const [a,b] of Object.entries(rename)) n=n.replace(new RegExp('\\b'+a+'\\b','g'),b);
            if(n!==s) fs.writeFileSync(file,n);
          }
          NODE

      - name: Run Accounting tests
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/test-accounting*.js; do echo "== $file =="; node "$file"; done
          node scripts/verify-accounting-architecture.js

      - name: Migrate Student Fee API symbols
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const rename = {
            api_getStudentFeeReferenceData: 'api_getStudentFeeReference',
            api_getFeePayerList: 'api_getStudentFeePayers',
            api_getFeePayerDetail: 'api_getStudentFeePayer',
            api_createFeePayer: 'api_createStudentFeePayer',
            api_updateFeePayer: 'api_updateStudentFeePayer',
            api_getFeeApplicationList: 'api_getStudentFeeApplications',
            api_getFeeApplicationDetail: 'api_getStudentFeeApplication',
            api_processFeeApplications: 'api_processStudentFeeApplications',
            api_calculateFeeAmount: 'api_calculateStudentFeeAmount',
            api_confirmFeePayment: 'api_confirmStudentFeePayment',
            api_getFeeRefundRequestList: 'api_getStudentFeeRefundRequests',
            api_getFeeRefundRequestDetail: 'api_getStudentFeeRefundRequest',
            api_processFeeRefundRequests: 'api_processStudentFeeRefundRequests',
            api_calculateFeeRefund: 'api_calculateStudentFeeRefund',
            api_confirmFeeRefund: 'api_confirmStudentFeeRefund'
          };
          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e => {
              const p=path.join(dir,e.name); return e.isDirectory()?walk(p):[p];
            });
          }
          const files=['src','scripts'].flatMap(walk)
            .filter(f => /\.(gs|js|html)$/.test(f))
            .filter(f => f.replace(/\\/g,'/') !== 'scripts/verify-public-api-naming.js');
          for (const file of files) {
            let s=fs.readFileSync(file,'utf8'), n=s;
            for (const [a,b] of Object.entries(rename)) n=n.replace(new RegExp('\\b'+a+'\\b','g'),b);
            if(n!==s) fs.writeFileSync(file,n);
          }
          NODE

      - name: Run Student Fee tests
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/test-student-fee*.js; do echo "== $file =="; node "$file"; done
          node scripts/verify-student-fee-architecture.js

      - name: Migrate Settings bridge symbols
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const rename = {
            loadSettingsHomeData: 'api_getSettingsHome',
            loadSettingsUsersData: 'api_getSettingsUsers',
            saveSettingsUserDepartment: 'api_updateSettingsUserDepartment',
            loadSettingsRolesData: 'api_getSettingsRoles',
            loadSettingsPermissionsData: 'api_getSettingsPermissions',
            loadSettingsDepartmentsData: 'api_getSettingsDepartments'
          };
          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e => {
              const p=path.join(dir,e.name); return e.isDirectory()?walk(p):[p];
            });
          }
          const files=['src','scripts'].flatMap(walk)
            .filter(f => /\.(gs|js|html)$/.test(f))
            .filter(f => f.replace(/\\/g,'/') !== 'scripts/verify-public-api-naming.js');
          for (const file of files) {
            let s=fs.readFileSync(file,'utf8'), n=s;
            for (const [a,b] of Object.entries(rename)) n=n.replace(new RegExp('\\b'+a+'\\b','g'),b);
            if(n!==s) fs.writeFileSync(file,n);
          }

          const verifier='scripts/verify-internal-function-naming.js';
          let s=fs.readFileSync(verifier,'utf8');
          s=s.replace(/^\s*api_getSettingsHome:\s*true,?\s*$/m,'')
             .replace(/^\s*api_getSettingsUsers:\s*true,?\s*$/m,'')
             .replace(/^\s*api_updateSettingsUserDepartment:\s*true,?\s*$/m,'')
             .replace(/^\s*api_getSettingsRoles:\s*true,?\s*$/m,'')
             .replace(/^\s*api_getSettingsPermissions:\s*true,?\s*$/m,'')
             .replace(/^\s*api_getSettingsDepartments:\s*true,?\s*$/m,'');
          fs.writeFileSync(verifier,s);
          NODE

      - name: Run Settings tests
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/test-settings*.js; do echo "== $file =="; node "$file"; done
          node scripts/test-department-iam.js
          node scripts/verify-settings-architecture.js
          node scripts/verify-department-access-architecture.js

      - name: Verify GREEN public naming
        run: node scripts/verify-public-api-naming.js

      - name: Compile all server gs files
        run: |
          node <<'NODE'
          const fs=require('fs'), path=require('path'), vm=require('vm');
          function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const p=path.join(d,e.name);return e.isDirectory()?walk(p):[p];});}
          for(const file of walk('src/000_server').filter(f=>/\.gs$/.test(f))) new vm.Script(fs.readFileSync(file,'utf8'),{filename:file});
          console.log('All server .gs files compile.');
          NODE

      - name: Run all behavior tests
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/test-*.js; do echo "== $file =="; node "$file"; done

      - name: Run all architecture verifiers
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/verify-*.js; do echo "== $file =="; node "$file"; done

      - name: Commit migration and evidence
        shell: bash
        run: |
          printf 'PUBLIC_API_NAMING=PASS\nVERIFIED_SHA=%s\n' "$(git rev-parse HEAD)" > verification/public-api-naming-green.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts verification/public-api-naming-red.log verification/public-api-naming-green.txt
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: adopt resource-oriented public API names'
          git push
