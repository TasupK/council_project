name: Internal Function Naming Verify

on:
  push:
    branches:
      - refactor/system-consistency-hardening
    paths-ignore:
      - 'verification/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Naming guardrail
        id: naming
        continue-on-error: true
        run: node scripts/verify-internal-function-naming.js > verification/internal-function-naming.log 2>&1
      - name: Record result
        if: always()
        run: |
          mkdir -p verification
          echo "verified_sha=${GITHUB_SHA}" > verification/internal-function-naming-result.txt
          echo "naming=${{ steps.naming.outcome }}" >> verification/internal-function-naming-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/internal-function-naming.log verification/internal-function-naming-result.txt
          git commit -m "test: record internal naming verification [skip ci]" || true
          git push
      - name: Fail if naming failed
        if: steps.naming.outcome != 'success'
        run: exit 1
