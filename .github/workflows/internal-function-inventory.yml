name: Internal Function Inventory

on:
  push:
    branches:
      - refactor/system-consistency-hardening
    paths-ignore:
      - 'verification/**'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan internal functions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('src/000_server')
          pattern = re.compile(r'function\s+([A-Za-z_$][\w$]*)\s*\(')
          rows = []
          for p in sorted(root.rglob('*.gs')):
              text = p.read_text(encoding='utf-8')
              for m in pattern.finditer(text):
                  name = m.group(1)
                  if name.startswith('api_'):
                      continue
                  if not name.endswith('_'):
                      continue
                  line = text.count('\n', 0, m.start()) + 1
                  rows.append((str(p), line, name))
          Path('verification').mkdir(exist_ok=True)
          with Path('verification/internal-function-inventory.txt').open('w', encoding='utf-8') as f:
              for path, line, name in rows:
                  f.write(f'{path}:{line}\t{name}\n')
              f.write(f'\nTOTAL={len(rows)}\n')
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/internal-function-inventory.txt
          git commit -m "chore: record internal function inventory [skip ci]" || true
          git push
