name: Internal Function Naming Verify

on:
  push:
    branches:
      - refactor/system-consistency-hardening
    paths-ignore:
      - 'verification/**'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename internal symbols
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          mapping = {
            'toUserDto_':'mapUserDto_',
            'getRolesById_':'buildRolesById_',
            'toRoleDto_':'mapRoleDto_',
            'toPermissionDto_':'mapPermissionDto_',
            'getPermissionsById_':'buildPermissionsById_',
            'toDepartmentDto_':'mapDepartmentDto_',
            'getDepartmentsById_':'buildDepartmentsById_',
            'updateEventStatusData_':'processEventStatusData_',
            'closeEventData_':'processEventClosureData_',
            'findAllEventRows_':'listEventRows_',
            'findAllEventClientRows_':'listEventClientRows_',
            'getEventFormHeaderAliases_':'buildEventFormHeaderAliases_',
            'eventFormCell_':'readEventFormCell_',
            'stableEventFormResponseId_':'buildStableEventFormResponseId_',
            'eventFormQuestionId_':'buildEventFormQuestionId_',
            'extractGoogleResourceId_':'parseGoogleResourceId_',
            'selectEventFormResponseSheet_':'resolveEventFormResponseSheet_',
            'syncApplicantsFromFormsData_':'applyApplicantFormSyncData_',
            'findAllEventApplicationClientRows_':'listEventApplicationClientRows_',
            'findAllEventApplicationSourceResponseIds_':'listEventApplicationSourceResponseIds_',
            'findAllEventPaymentClientRows_':'listEventPaymentClientRows_',
            'findAllEventAttendanceClientRows_':'listEventAttendanceClientRows_',
            'findAllEventRefundClientRows_':'listEventRefundClientRows_',
            'findAllLedgerRows_':'listLedgerRows_',
            'findAllLedgerEvidenceRows_':'listLedgerEvidenceRows_',
            'findAllBankOcrLogRows_':'listBankOcrLogRows_',
            'findAllBankTransactionRows_':'listBankTransactionRows_',
            'findAllReconciliationRows_':'listReconciliationRows_',
            'findAllReconciliationItemRows_':'listReconciliationItemRows_',
            'findAllSettlementReportRows_':'listSettlementReportRows_',
            'findAllFeePayerRows_':'listFeePayerRows_',
            'findAllFeeApplicationRows_':'listFeeApplicationRows_',
            'findAllFeePaymentRows_':'listFeePaymentRows_',
            'findAllFeeRefundRequestRows_':'listFeeRefundRequestRows_',
            'findAllFeeRefundRows_':'listFeeRefundRows_',
          }

          targets = []
          targets += list(Path('src').rglob('*.gs'))
          targets += list(Path('src').rglob('*.html'))
          targets += [p for p in Path('scripts').rglob('*.js') if p.name != 'verify-internal-function-naming.js']

          for p in targets:
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in mapping.items():
                  text = re.sub(r'\b' + re.escape(old) + r'\b', new, text)
              if text != original:
                  p.write_text(text, encoding='utf-8')
          PY
      - name: Naming guardrail
        id: naming
        continue-on-error: true
        run: node scripts/verify-internal-function-naming.js
      - name: Full regression
        id: regression
        continue-on-error: true
        run: |
          mkdir -p verification
          set -o pipefail
          {
            for file in scripts/test-*.js; do
              echo "== $file =="
              node "$file"
            done
            for file in scripts/verify-*.js; do
              echo "== $file =="
              node "$file"
            done
          } > verification/internal-function-naming-regression.log 2>&1
      - name: Verify public API inventory unchanged
        id: public_api
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys

          before_sha = 'c7446eb202b7aec99bba9a09b472da842b01529e'
          pat = re.compile(r'function\s+(api_[A-Za-z_$][\w$]*)\s*\(')

          def current_names():
              names = set()
              for p in Path('src/000_server').rglob('*.gs'):
                  names.update(pat.findall(p.read_text(encoding='utf-8')))
              return names

          before = set()
          files = subprocess.check_output(['git','ls-tree','-r','--name-only',before_sha,'src/000_server'], text=True).splitlines()
          for f in files:
              if not f.endswith('.gs'):
                  continue
              text = subprocess.check_output(['git','show',before_sha + ':' + f], text=True)
              before.update(pat.findall(text))

          after = current_names()
          if before != after:
              print('Public API inventory changed')
              print('removed:', sorted(before-after))
              print('added:', sorted(after-before))
              sys.exit(1)
          print('Public API inventory unchanged:', len(after))
          PY
      - name: Record and commit result
        if: always()
        run: |
          mkdir -p verification
          {
            echo "verified_sha=${GITHUB_SHA}"
            echo "naming=${{ steps.naming.outcome }}"
            echo "regression=${{ steps.regression.outcome }}"
            echo "public_api=${{ steps.public_api.outcome }}"
          } > verification/internal-function-naming-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts verification/internal-function-naming-regression.log verification/internal-function-naming-result.txt
          git commit -m "refactor: normalize internal function names [skip ci]" || true
          git push
      - name: Fail on verification failure
        if: steps.naming.outcome != 'success' || steps.regression.outcome != 'success' || steps.public_api.outcome != 'success'
        run: exit 1
