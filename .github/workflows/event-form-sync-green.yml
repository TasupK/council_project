name: Event Form Sync GREEN
on:
  push:
    branches: [refactor/event-form-sync-port]
    paths:
      - 'src/000_server/050_event/050_common/event_access.gs'
      - 'src/000_server/050_event/051_events/events_query_service.gs'
      - 'src/000_server/050_event/052_applicants/applicants_*.gs'
      - 'src/600_event/620_detail/Event_Detail.html'
      - 'src/600_event/620_detail/event_form_sync_js.html'
      - scripts/test-event-form-sync-*.js
      - .github/workflows/event-form-sync-green.yml
permissions:
  contents: write
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify event form sync green
        run: |
          node scripts/test-event-form-sync-mapper.js
          node scripts/test-event-form-sync-service.js
          node scripts/test-event-form-sync-api.js
          node scripts/test-event-form-sync-frontend.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          text = Path('src/600_event/620_detail/event_form_sync_js.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*)</script>', text, re.S)
          if not match:
              raise SystemExit('missing script block')
          Path('/tmp/event_form_sync.js').write_text(match.group(1), encoding='utf-8')
          subprocess.run(['node', '--check', '/tmp/event_form_sync.js'], check=True)
          PY
          mkdir -p verification
          printf 'green_verified_sha=%s\n' "$GITHUB_SHA" > verification/event-form-sync-green.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/event-form-sync-green.txt
          git commit -m 'ci: record event form sync green verification'
          git push
