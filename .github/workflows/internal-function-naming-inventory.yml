name: Internal Function Naming Inventory

on:
  push:
    branches:
      - refactor/system-consistency-hardening
    paths:
      - '.github/workflows/internal-function-naming-inventory.yml'
      - 'scripts/audit-function-naming.js'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-consistency-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build naming inventory
        run: |
          mkdir -p verification
          node scripts/audit-function-naming.js > verification/function-naming-inventory.tsv
          node scripts/audit-function-naming.js --candidates > verification/function-naming-candidates.tsv
          echo "=== CANDIDATES ==="
          cat verification/function-naming-candidates.tsv
      - name: Commit inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/function-naming-inventory.tsv verification/function-naming-candidates.tsv
          git diff --cached --quiet && exit 0
          git commit -m 'test: capture internal function naming inventory'
          git push
