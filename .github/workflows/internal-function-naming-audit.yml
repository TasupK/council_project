name: Internal Function Naming Audit

on:
  push:
    branches:
      - refactor/system-consistency-hardening
    paths-ignore:
      - 'verification/**'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build function inventory
        run: |
          mkdir -p verification
          node scripts/audit-function-naming.js > verification/internal-function-inventory.tsv
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/internal-function-inventory.tsv
          git commit -m "chore: record internal function inventory [skip ci]" || true
          git push
