name: Internal Function Naming Audit

on:
  push:
    branches:
      - refactor/system-consistency-hardening
    paths-ignore:
      - 'verification/**'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build function inventory
        run: |
          mkdir -p verification
          node scripts/audit-function-naming.js > verification/internal-function-inventory.tsv
          node scripts/audit-function-naming.js --candidates > verification/internal-function-candidates.tsv
      - name: Naming verifier RED
        id: naming
        continue-on-error: true
        run: node scripts/verify-internal-function-naming.js > verification/internal-function-naming.log 2>&1
      - name: Record result
        if: always()
        run: |
          echo "verified_sha=${GITHUB_SHA}" > verification/internal-function-naming-result.txt
          echo "naming=${{ steps.naming.outcome }}" >> verification/internal-function-naming-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/internal-function-inventory.tsv verification/internal-function-candidates.tsv verification/internal-function-naming.log verification/internal-function-naming-result.txt
          git commit -m "chore: record internal function naming verification [skip ci]" || true
          git push
