name: Internal Function Naming Phase 3

on:
  push:
    branches:
      - refactor/system-consistency-hardening
    paths:
      - '.github/workflows/internal-function-naming-phase3.yml'

permissions:
  contents: write

jobs:
  rename-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-consistency-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify RED before migration
        shell: bash
        run: |
          mkdir -p verification
          set +e
          node scripts/verify-internal-function-naming.js > verification/internal-function-naming-phase3-red.log 2>&1
          status=$?
          set -e
          cat verification/internal-function-naming-phase3-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected naming verifier to fail before phase 3 migration.'
            exit 1
          fi

      - name: Apply symbol-only phase 3 renames
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const roots = ['src/000_server', 'scripts'];
          const excluded = new Set(['scripts/verify-internal-function-naming.js']);
          const rename = {
            sheetFindAll_: 'listSheetCrudItems_',
            sheetFindById_: 'findSheetCrudItemById_',
            sheetInsert_: 'insertSheetCrudItem_',
            sheetUpdateById_: 'updateSheetCrudItemById_',
            sheetCrudRowsToItems_: 'mapSheetCrudRowsToItems_',
            sheetCrudApplyChangesToRow_: 'applySheetCrudChangesToRow_',
            checkOperationDbIntegrity_: 'validateOperationDbIntegrity_',
            getOperationDbReference_: 'resolveOperationDbReference_',
            checkUserDbIntegrity_: 'validateUserDbIntegrity_',
            checkLoginUserDbIntegrity_: 'validateLoginUserDbIntegrity_',
            createIntegrityIssue_: 'buildIntegrityIssue_',
            getCachedLoginContext_: 'readCachedLoginContext_',
            cacheLoginContext_: 'writeLoginContextCache_',
            getActiveUserEmailFromSession_: 'readActiveUserEmailFromSession_',
            summarizeRoleForUser_: 'buildRoleSummaryForUser_',
            actionToPermissionKey_: 'mapActionToPermissionKey_',
            permissionScreenId_: 'resolvePermissionScreenId_',
            getEventData_: 'getEventForEditData_',
            getEventMaterialFolder_: 'resolveEventMaterialFolder_',
            findLedgerEntryDtoById_: 'getLedgerDetailData_',
            getEvidenceFileContent_: 'readEvidenceFileContent_',
            getEvidenceFolder_: 'resolveEvidenceFolder_',
            createEvidenceFiles_: 'createEvidenceFilesData_',
            bankAmountNumber_: 'parseBankAmount_',
            reconciliationTokens_: 'buildReconciliationTokens_',
            reconciliationDateDifference_: 'calculateReconciliationDateDifference_',
            getReconciliationLedgerCandidates_: 'buildReconciliationLedgerCandidates_',
            getCandidateScoresForBank_: 'calculateReconciliationCandidateScores_',
            getSettlementEligibleItems_: 'buildSettlementEligibleItems_'
          };
          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir, {withFileTypes:true}).flatMap(e => {
              const p = path.join(dir, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
          }
          const files = roots.flatMap(walk).filter(f => /\.(?:gs|js)$/.test(f)).filter(f => !excluded.has(f.replace(/\\/g,'/')));
          for (const file of files) {
            let source = fs.readFileSync(file, 'utf8');
            let next = source;
            for (const [oldName, newName] of Object.entries(rename)) {
              const escaped = oldName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              next = next.replace(new RegExp('\\b' + escaped + '\\b', 'g'), newName);
            }
            if (next !== source) fs.writeFileSync(file, next);
          }
          NODE

      - name: Verify GREEN naming contract
        run: node scripts/verify-internal-function-naming.js

      - name: Compile every server gs file
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const vm = require('vm');
          function walk(dir) {
            return fs.readdirSync(dir, {withFileTypes:true}).flatMap(e => {
              const p = path.join(dir, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
          }
          for (const file of walk('src/000_server').filter(f => /\.gs$/.test(f))) {
            new vm.Script(fs.readFileSync(file, 'utf8'), {filename:file});
          }
          console.log('All server .gs files compile.');
          NODE

      - name: Run all behavior tests
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/test-*.js; do
            echo "== $file =="
            node "$file"
          done

      - name: Run all architecture verifiers
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/verify-*.js; do
            echo "== $file =="
            node "$file"
          done

      - name: Record GREEN and commit migration
        shell: bash
        run: |
          printf 'PHASE3=PASS\nSHA_BEFORE_COMMIT=%s\n' "$(git rev-parse HEAD)" > verification/internal-function-naming-phase3-green.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/000_server scripts verification/internal-function-naming-phase3-red.log verification/internal-function-naming-phase3-green.txt
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: normalize remaining internal function names'
          git push
