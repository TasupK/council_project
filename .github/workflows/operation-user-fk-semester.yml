name: Operation user FK semester normalization

on:
  push:
    branches:
      - design/operation-user-fk-semester-normalization
  pull_request:
    branches:
      - main

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Operation user FK and semester normalization contract
        run: node scripts/test-operation-user-fk-semester-normalization.js
      - name: Public API naming
        run: node scripts/verify-public-api-naming.js
      - name: Internal function naming
        run: node scripts/verify-internal-function-naming.js
      - name: Full Node regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test_file in scripts/test-*.js; do
            echo "::group::$test_file"
            node "$test_file"
            echo "::endgroup::"
          done
