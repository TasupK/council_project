name: Accounting server port apply

on:
  push:
    branches:
      - refactor/accounting-standalone-port
    paths:
      - scripts/__apply_accounting_server.py
      - .github/workflows/__accounting_server_apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/accounting-standalone-port
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply server patch
        run: python3 scripts/__apply_accounting_server.py
      - name: Static syntax checks
        run: |
          node --check scripts/test-accounting.js
          node --check scripts/verify-accounting-architecture.js
          find src/000_server/060_accounting -name '*.gs' -print0 | while IFS= read -r -d '' file; do cp "$file" /tmp/__gas_check.js; node --check /tmp/__gas_check.js; done
      - name: Accounting behavior tests
        run: node scripts/test-accounting.js
      - name: Accounting architecture verifier
        run: node scripts/verify-accounting-architecture.js
      - name: Commit verified server port
        run: |
          rm -f scripts/__apply_accounting_server.py .github/workflows/__accounting_server_apply.yml
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "feat: port accounting server workflows"
          git push origin HEAD:refactor/accounting-standalone-port
