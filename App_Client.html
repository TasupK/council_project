  <script>
/* eslint-disable */
const cache = {
  loaded: false,
  dbMode: 'preview',
  app: null,
  database: null,
  session: null,
  currentUser: null,
  departments: [],
  users: [],
  roles: [],
  permissionTree: [],
  permissionsByRole: {},
  permissionMeta: {},
  columns: []
};

const ui = {
  route: 'settings',
  filters: { users: { q: '', roleId: '', status: '' }, roles: { q: '', type: '', status: '' } },
  userDrafts: {},
  editingUserId: null,
  newUsers: [],
  roleDrafts: {},
  editingRoleId: null,
  newRoles: [],
  permRoleId: null,
  permValues: {},
  permBaseline: {},
  permChanges: {},
  expandedGroups: { ledger: true }
};

function $(id) { return document.getElementById(id); }

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2400);
}

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function statusLabel(s) { return s === 'active' ? '활성' : '비활성'; }

function parseApiResult(result) {
  if (typeof result === 'string') {
    try { return JSON.parse(result); } catch (e) { return result; }
  }
  return result;
}

function api(fn, ...args) {
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      reject(new Error('Apps Script 웹앱에서만 실행할 수 있습니다.'));
      return;
    }
    google.script.run
      .withSuccessHandler((r) => resolve(parseApiResult(r)))
      .withFailureHandler((err) => reject(new Error(err && err.message ? err.message : String(err))))
      [fn](...args);
  });
}

function setLoginAlert(html) {
  const alert = $('loginAlert');
  alert.innerHTML = html;
  alert.classList.add('show');
}

function showApp() {
  document.body.classList.remove('login-mode');
  document.body.classList.add('app-mode');
}

function goToPage(page) {
  const url = new URL(window.location.href);
  url.searchParams.set('page', page);
  window.top.location.href = url.toString();
}

async function loginAndLoad() {
  const button = $('loginButton');
  button.disabled = true;
  button.textContent = 'Google 계정 확인 중...';
  $('loginAlert').classList.remove('show');
  try {
    const authorization = await api('getAuthorizationStatus');
    if (authorization && authorization.required) {
      setLoginAlert('Google 권한 승인이 필요합니다.<br><a href="' + escapeHtml(authorization.url) + '" target="_top">권한 승인하기</a>를 누른 뒤 이 페이지로 돌아와 다시 로그인해 주세요.');
      return;
    }

    const login = await api('apiV1_checkLogin');
    if (!login || !login.ok) {
      setLoginAlert(escapeHtml((login && login.message) || '접근 권한이 없는 계정입니다.'));
      return;
    }

    goToPage('settings');
  } catch (err) {
    setLoginAlert(escapeHtml(err.message || String(err)));
  } finally {
    button.disabled = false;
    button.textContent = 'Google 계정으로 로그인';
  }
}

function showPanel(id) {
  document.querySelectorAll('.page-panel').forEach((p) => p.classList.remove('active'));
  const panel = $('panel-' + id);
  if (panel) panel.classList.add('active');
}

function setPage(crumb, title, actionsHtml, opts) {
  opts = opts || {};
  $('crumb').textContent = crumb;
  $('pageTitle').textContent = title;
  $('pageActions').innerHTML = actionsHtml || '';
  const back = $('backBtn');
  if (opts.backTo) {
    back.classList.add('show');
    back.onclick = () => navigate(opts.backTo);
  } else {
    back.classList.remove('show');
    back.onclick = null;
  }
}

function setNavActive(route) {
  const activeId = String(route).startsWith('settings') ? 'settings' : route.split(':')[1] || route;
  document.querySelectorAll('.nav-item').forEach((btn) => {
    btn.classList.toggle('active', btn.getAttribute('data-nav') === activeId);
  });
}

function canWriteDb() {
  return cache.dbMode === 'connected' && cache.database && cache.database.connected;
}

function applyCache(data) {
  cache.loaded = true;
  cache.dbMode = data.dbMode || (data.database && data.database.mode) || 'preview';
  cache.app = data.app || {};
  cache.database = data.database || {};
  cache.session = data.session || {};
  cache.currentUser = data.currentUser || {};
  cache.departments = data.departments || [];
  cache.users = data.users || [];
  cache.roles = data.roles || [];
  cache.permissionTree = data.permissionTree || [];
  cache.permissionsByRole = data.permissionsByRole || {};
  cache.permissionMeta = data.permissionMeta || {};
  cache.columns = data.columns || [];

  $('userName').textContent = cache.currentUser.name || '운영자';
  $('userTitle').textContent = cache.currentUser.title || '관리자';
  $('termSelect').innerHTML = '<option>' + escapeHtml(cache.app.term || '2026학년도') + '</option>';

  const db = cache.database;
  const dbLink = db.spreadsheetUrl
    ? '<a href="' + escapeHtml(db.spreadsheetUrl) + '" target="_blank" rel="noopener">Google Sheets DB</a> 연결됨'
    : escapeHtml(cache.app.syncStatus || '시스템 준비 중');
  $('statusBar').innerHTML = '시스템 ' + escapeHtml(cache.app.version || 'v0.5') + ' · ' + dbLink + ' · 기준일 ' + escapeHtml(cache.app.baseDate || '');

  const adminNote = $('adminNote');
  if (cache.dbMode === 'preview') {
    adminNote.classList.add('preview');
    adminNote.textContent = '미리보기 모드 — 운영 DB 미연결. 화면·API는 확인 가능하나 저장은 운영 Drive 연결 후 가능합니다.';
  } else {
    adminNote.classList.remove('preview');
    adminNote.textContent = '운영 DB 연결됨. 로그인 시 데이터를 한 번 불러오며, 설정 홈의 다시 불러오기로만 재동기화합니다.';
  }

  const navSettings = $('navSettings');
  if (cache.session.isAdmin) {
    navSettings.classList.remove('hidden');
  } else {
    navSettings.classList.add('hidden');
  }

  const openLink = $('dbOpenLink');
  if (db.spreadsheetUrl) {
    openLink.href = db.spreadsheetUrl;
    openLink.classList.remove('hidden');
    $('dbCardDesc').textContent = '운영 스프레드시트에 연결되었습니다. 저장 시 시트에 반영됩니다.';
    $('connectCard').style.opacity = '0.55';
  } else {
    openLink.classList.add('hidden');
    $('dbCardDesc').textContent = '운영 DB 미연결 — COM_API v1 기준 시드 데이터로 UI를 확인 중입니다.';
    $('connectCard').style.opacity = '1';
  }
  if (db.folderId) $('folderIdInput').value = db.folderId;

  fillRoleFilterOptions();
}

async function loadDataFromServer() {
  showPanel('loading');
  const data = await api('loadAllData');
  if (!data || !data.ok) throw new Error((data && data.message) || '데이터를 불러오지 못했습니다.');
  applyCache(data);
  return data;
}

async function reloadData() {
  try {
    $('btnReloadData').disabled = true;
    await loadDataFromServer();
    resetAllDrafts();
    toast('데이터를 다시 불러왔습니다.');
    navigate(ui.route);
  } catch (err) {
    toast(err.message || String(err));
  } finally {
    $('btnReloadData').disabled = false;
  }
}

function resetAllDrafts() {
  ui.userDrafts = {};
  ui.editingUserId = null;
  ui.newUsers = [];
  ui.roleDrafts = {};
  ui.editingRoleId = null;
  ui.newRoles = [];
  ui.permChanges = {};
}

function fillRoleFilterOptions() {
  const sel = $('userRole');
  const cur = ui.filters.users.roleId;
  sel.innerHTML = '<option value="">역할 전체</option>' + cache.roles.map((r) =>
    '<option value="' + r.id + '"' + (cur === r.id ? ' selected' : '') + '>' + escapeHtml(r.name) + '</option>'
  ).join('');
  const permSel = $('permRoleSelect');
  if (permSel) {
    const rid = ui.permRoleId || (cache.roles.find((r) => r.id === 'role_finance') || cache.roles[0] || {}).id;
    permSel.innerHTML = cache.roles.map((r) =>
      '<option value="' + r.id + '"' + (r.id === rid ? ' selected' : '') + '>' + escapeHtml(r.name) + '</option>'
    ).join('');
  }
}

function navigate(route) {
  ui.route = route;
  setNavActive(route);

  if (!cache.loaded) return;

  if (!cache.session.isAdmin && String(route).startsWith('settings')) {
    setPage('접근 제한', '설정', '');
    showPanel('denied');
    return;
  }

  if (route === 'settings') {
    setPage('설정 / 설정 홈', '설정', '');
    showPanel('settings');
    return;
  }
  if (route === 'settings-users') {
    setPage('설정 / 사용자·권한 / 사용자 관리', '사용자 관리',
      '<button class="btn btn-primary" type="button" id="btnAddUser">＋ 사용자 추가</button>',
      { backTo: 'settings' });
    showPanel('users');
    $('btnAddUser').onclick = addNewUserRow;
    renderUsers();
    return;
  }
  if (route === 'settings-roles') {
    setPage('설정 / 사용자·권한 / 역할 관리', '역할 관리',
      '<button class="btn btn-primary" type="button" id="btnAddRole">＋ 역할 추가</button>',
      { backTo: 'settings' });
    showPanel('roles');
    $('btnAddRole').onclick = () => { ui.newRoles.unshift({ name: '', description: '', status: 'active', type: 'custom' }); renderRoles(); };
    renderRoles();
    return;
  }
  if (route === 'settings-perms') {
    setPage('설정 / 사용자·권한 / 업무 권한 설정', '업무 권한 설정', '', { backTo: 'settings' });
    showPanel('perms');
    initPermPage();
    return;
  }
  if (String(route).startsWith('placeholder:')) {
    const id = route.split(':')[1];
    const labels = { home: '메인화면', ledger: '장부관리', fee: '학생회비관리', event: '행사복지관리' };
    const label = labels[id] || id;
    setPage(label, label, '');
    $('placeholderText').innerHTML = escapeHtml(label) + ' 화면은 준비 중입니다.';
    showPanel('placeholder');
  }
}

function filterUsersList() {
  const f = ui.filters.users;
  const q = f.q.trim().toLowerCase();
  return cache.users.filter((u) => {
    if (q) {
      const hay = (u.name + ' ' + u.email + ' ' + (u.studentId || '') + ' ' + (u.phone || '')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    if (f.roleId && (u.roleIds || []).indexOf(f.roleId) === -1) return false;
    if (f.status && u.status !== f.status) return false;
    return true;
  });
}

function filterRolesList() {
  const f = ui.filters.roles;
  const q = f.q.trim().toLowerCase();
  return cache.roles.filter((r) => {
    if (q) {
      const hay = (r.name + ' ' + (r.description || '')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    if (f.type && r.type !== f.type) return false;
    if (f.status && r.status !== f.status) return false;
    return true;
  });
}

function userChangeCount() { return Object.keys(ui.userDrafts).length + ui.newUsers.length; }
function roleChangeCount() { return Object.keys(ui.roleDrafts).length + ui.newRoles.length; }
function permChangeCount() {
  return Object.keys(ui.permChanges).reduce((n, sid) => n + Object.keys(ui.permChanges[sid] || {}).length, 0);
}

function sameRoleIds(a, b) {
  return (a || []).slice().sort().join(',') === (b || []).slice().sort().join(',');
}

function snapshotUser(u) {
  return { name: u.name, email: u.email, studentId: u.studentId || '', phone: u.phone || '', department: u.department, roleIds: (u.roleIds || []).slice(), status: u.status };
}

function getUserView(id) {
  if (String(id).startsWith('new:')) return ui.newUsers[Number(String(id).split(':')[1])];
  const u = cache.users.find((x) => x.id === id);
  return Object.assign({}, u, ui.userDrafts[id] || {});
}

function isUserRowEditing(id) {
  return String(id).startsWith('new:') || !!ui.userDrafts[id] || ui.editingUserId === id;
}

function rolePickerHtml(ids, rowKey) {
  const selected = ids || [];
  const tags = selected.length
    ? '<div class="role-tags">' + selected.map((id) => {
        const r = cache.roles.find((x) => x.id === id);
        return '<span class="tag">' + escapeHtml(r ? r.name : id) + '</span>';
      }).join('') + '</div>'
    : '<span class="placeholder">역할 선택</span>';
  const options = cache.roles.map((r) =>
    '<label class="role-option"><input type="checkbox" data-role-id="' + r.id + '"' + (selected.indexOf(r.id) >= 0 ? ' checked' : '') + '><span>' + escapeHtml(r.name) + '</span></label>'
  ).join('');
  return '<div class="role-picker" data-role-picker="' + rowKey + '"><button type="button" class="role-picker-btn" data-role-toggle="' + rowKey + '">' + tags + '<span>▼</span></button><div class="role-picker-menu">' + options + '</div></div>';
}

function roleReadOnlyHtml(view) {
  const roles = view.roles && view.roles.length ? view.roles : (view.roleIds || []).map((id) => {
    const r = cache.roles.find((x) => x.id === id);
    return { id, name: r ? r.name : id };
  });
  if (!roles.length) return '-';
  return '<div class="role-tags">' + roles.map((r) => '<span class="tag">' + escapeHtml(r.name) + '</span>').join('') + '</div>';
}

function deptOptions(selected) {
  return cache.departments.map((x) => '<option value="' + escapeHtml(x) + '"' + (selected === x ? ' selected' : '') + '>' + escapeHtml(x) + '</option>').join('');
}

function userEditableCells(view, key) {
  return '<td><input class="cell" data-field="name" data-id="' + key + '" value="' + escapeHtml(view.name || '') + '"></td>'
    + '<td><input class="cell" data-field="email" data-id="' + key + '" value="' + escapeHtml(view.email || '') + '"></td>'
    + '<td><input class="cell" data-field="studentId" data-id="' + key + '" value="' + escapeHtml(view.studentId || '') + '"></td>'
    + '<td><input class="cell" data-field="phone" data-id="' + key + '" value="' + escapeHtml(view.phone || '') + '"></td>'
    + '<td><select class="cell" data-field="department" data-id="' + key + '">' + deptOptions(view.department) + '</select></td>'
    + '<td>' + rolePickerHtml(view.roleIds, key) + '</td>'
    + '<td><div class="status-cell"><button type="button" class="toggle ' + (view.status === 'active' ? 'on' : '') + '" data-toggle="' + key + '"></button><span data-status-label="' + key + '">' + statusLabel(view.status) + '</span></div></td>';
}

function userReadOnlyCells(view) {
  return '<td>' + escapeHtml(view.name || '') + '</td><td>' + escapeHtml(view.email || '') + '</td><td>' + escapeHtml(view.studentId || '') + '</td><td>' + escapeHtml(view.phone || '') + '</td><td>' + escapeHtml(view.department || '') + '</td><td>' + roleReadOnlyHtml(view) + '</td><td><div class="status-cell"><span class="status-dot ' + (view.status === 'active' ? 'on' : '') + '"></span><span>' + statusLabel(view.status) + '</span></div></td>';
}

function refreshUserChangeBar() {
  const n = userChangeCount();
  $('userChangeBar').classList.toggle('show', n > 0);
  $('userChangeCount').textContent = n + '개 변경됨';
  $('userSave').textContent = '변경사항 저장 (' + n + ')';
}

function updateUserField(id, field, value) {
  if (String(id).startsWith('new:')) {
    ui.newUsers[Number(String(id).split(':')[1])][field] = value;
    refreshUserChangeBar();
    return;
  }
  const original = cache.users.find((x) => x.id === id);
  if (!ui.userDrafts[id]) ui.userDrafts[id] = snapshotUser(original);
  ui.userDrafts[id][field] = value;
  const d = ui.userDrafts[id];
  if (d.name === original.name && d.email === original.email && (d.studentId || '') === (original.studentId || '') && (d.phone || '') === (original.phone || '') && d.department === original.department && d.status === original.status && sameRoleIds(d.roleIds, original.roleIds)) {
    delete ui.userDrafts[id];
  }
  refreshUserChangeBar();
}

function renderUsers() {
  const filtered = filterUsersList();
  const rows = [];
  ui.newUsers.forEach((u, idx) => {
    rows.push('<tr class="is-new" data-row="new:' + idx + '">' + userEditableCells(u, 'new:' + idx) + '<td>신규</td></tr>');
  });
  filtered.forEach((u) => {
    const draft = ui.userDrafts[u.id];
    const view = Object.assign({}, u, draft || {});
    const rowClass = draft ? 'is-changed' : (ui.editingUserId === u.id ? 'is-selected' : 'row-readonly');
    rows.push('<tr class="' + rowClass + '" data-row="' + u.id + '">' + (isUserRowEditing(u.id) ? userEditableCells(view, u.id) : userReadOnlyCells(view)) + '<td>' + escapeHtml(view.updatedAt || '') + '<span class="meta-sub">' + escapeHtml(view.updatedBy || '') + '</span></td></tr>');
  });
  const count = filtered.length + ui.newUsers.length;
  $('userTbody').innerHTML = rows.join('') || '<tr><td colspan="8">사용자가 없습니다.</td></tr>';
  $('userCountLabel').textContent = '사용자 ' + count + '명';
  $('userFooterTotal').textContent = '총 ' + count + '명';
  refreshUserChangeBar();
}

function addNewUserRow() {
  const defaultRole = (cache.roles.find((r) => r.id === 'role_finance') || cache.roles[0] || {}).id;
  const nextNo = cache.users.length + ui.newUsers.length + 1;
  ui.newUsers.unshift({ name: '', email: '', studentId: String(20260000 + nextNo), phone: '010-0000-' + ('000' + nextNo).slice(-4), department: cache.departments[0] || '', roleIds: defaultRole ? [defaultRole] : [], status: 'active' });
  renderUsers();
}

function diffText(before, after) {
  return escapeHtml(before || '-') + ' → <span class="diff-after">' + escapeHtml(after || '-') + '</span>';
}

function roleNamesFromIds(ids) {
  return (ids || []).map((id) => { const r = cache.roles.find((x) => x.id === id); return r ? r.name : id; });
}

function openModal(html) {
  const root = $('modalRoot');
  root.innerHTML = html;
  root.classList.add('show');
  root.onclick = (e) => { if (e.target === root) closeModal(); };
}

function closeModal() {
  $('modalRoot').classList.remove('show');
  $('modalRoot').innerHTML = '';
}

function confirmSaveUsers() {
  const n = userChangeCount();
  if (!n) return;
  if (!canWriteDb()) { toast('운영 DB 연결 후 저장할 수 있습니다.'); return; }
  const cards = [];
  ui.newUsers.forEach((u) => {
    cards.push('<div class="summary-card is-new"><div class="summary-head"><strong>' + escapeHtml(u.name || '(이름 없음)') + '</strong><span class="badge-new">신규 등록</span></div><div class="meta">' + escapeHtml(u.email || '') + '</div><div class="meta meta-new">' + escapeHtml(u.studentId || '-') + ' · ' + escapeHtml(u.phone || '-') + ' · ' + escapeHtml(u.department || '-') + ' · ' + escapeHtml(roleNamesFromIds(u.roleIds).join(', ') || '-') + ' · ' + statusLabel(u.status) + '</div></div>');
  });
  Object.keys(ui.userDrafts).forEach((id) => {
    const before = cache.users.find((u) => u.id === id);
    const after = Object.assign({}, before, ui.userDrafts[id]);
    const rows = [];
    if (before.name !== after.name) rows.push('<div class="summary-row"><span class="label">이름</span><span>' + diffText(before.name, after.name) + '</span></div>');
    if (before.email !== after.email) rows.push('<div class="summary-row"><span class="label">이메일</span><span>' + diffText(before.email, after.email) + '</span></div>');
    if ((before.studentId || '') !== (after.studentId || '')) rows.push('<div class="summary-row"><span class="label">학번</span><span>' + diffText(before.studentId, after.studentId) + '</span></div>');
    if ((before.phone || '') !== (after.phone || '')) rows.push('<div class="summary-row"><span class="label">연락처</span><span>' + diffText(before.phone, after.phone) + '</span></div>');
    if (before.department !== after.department) rows.push('<div class="summary-row"><span class="label">소속</span><span>' + diffText(before.department, after.department) + '</span></div>');
    if (!sameRoleIds(before.roleIds, after.roleIds)) rows.push('<div class="summary-row"><span class="label">역할</span><span>' + diffText((before.roles || []).map((r) => r.name).join(', '), roleNamesFromIds(after.roleIds).join(', ')) + '</span></div>');
    const statusChanged = before.status !== after.status;
    cards.push('<div class="summary-card is-changed"><div class="summary-head"><strong>' + escapeHtml(after.name) + '</strong></div>' + rows.join('') + (statusChanged ? '<div class="status-diff"><span class="status-diff-icon">!</span>상태&nbsp;&nbsp;' + escapeHtml(statusLabel(before.status)) + ' → <span class="diff-after">' + escapeHtml(statusLabel(after.status)) + '</span></div>' : '') + '</div>');
  });
  openModal('<div class="modal"><div class="modal-header"><h2>변경사항 저장</h2><button class="btn btn-ghost" type="button" data-modal-close>✕</button></div><div class="modal-body"><p>사용자 ' + n + '명의 변경사항을 저장하시겠습니까?</p>' + cards.join('') + '</div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-modal-close>취소</button><button class="btn btn-primary" type="button" id="modalConfirmUsers">변경사항 저장</button></div></div>');
  $('modalConfirmUsers').onclick = async () => {
    try {
      const changes = Object.keys(ui.userDrafts).map((id) => Object.assign({ id }, ui.userDrafts[id]));
      const res = await api('saveUserChanges', { changes, newUsers: ui.newUsers });
      closeModal();
      toast(res.message || '저장되었습니다.');
      const fresh = await api('loadAllData');
      applyCache(fresh);
      ui.userDrafts = {};
      ui.editingUserId = null;
      ui.newUsers = [];
      renderUsers();
    } catch (err) { toast(err.message || String(err)); }
  };
}

function getRoleView(id) {
  if (String(id).startsWith('new:')) return ui.newRoles[Number(String(id).split(':')[1])];
  const r = cache.roles.find((x) => x.id === id);
  return Object.assign({}, r, ui.roleDrafts[id] || {});
}

function isRoleRowEditing(id) {
  return String(id).startsWith('new:') || !!ui.roleDrafts[id] || ui.editingRoleId === id;
}

function typeTagHtml(view) {
  const label = view.typeLabel || (view.type === 'custom' ? '사용자 정의' : '기본 역할');
  return '<span class="tag ' + (view.type === 'custom' ? '' : 'muted') + '">' + escapeHtml(label) + '</span>';
}

function roleEditableCells(view, key) {
  return '<td><input class="cell" data-rfield="name" data-rid="' + key + '" value="' + escapeHtml(view.name || '') + '" placeholder="역할명"></td><td>' + typeTagHtml(view) + '</td><td><input class="cell" data-rfield="description" data-rid="' + key + '" value="' + escapeHtml(view.description || '') + '" placeholder="설명"></td><td>' + (String(key).startsWith('new:') ? '0명' : '<a class="link" href="#" data-goto-users-role="' + key + '">' + (view.assignedCount || 0) + '명</a>') + '</td><td><div class="status-cell"><button type="button" class="toggle ' + (view.status === 'active' ? 'on' : '') + '" data-rtoggle="' + key + '"></button><span data-rstatus-label="' + key + '">' + statusLabel(view.status) + '</span></div></td>';
}

function roleReadOnlyCells(view, locked) {
  return '<td><strong>' + escapeHtml(view.name || '') + '</strong>' + (locked ? ' <span class="tag protect">보호됨</span>' : '') + '</td><td>' + typeTagHtml(view) + '</td><td>' + escapeHtml(view.description || '') + '</td><td><a class="link" href="#" data-goto-users-role="' + view.id + '">' + (view.assignedCount || 0) + '명</a></td><td><div class="status-cell"><span class="status-dot ' + (view.status === 'active' ? 'on' : '') + '"></span><span>' + statusLabel(view.status) + '</span></div></td>';
}

function refreshRoleChangeBar() {
  const n = roleChangeCount();
  $('roleChangeBar').classList.toggle('show', n > 0);
  $('roleChangeCount').textContent = n + '개 변경됨';
  $('roleSave').textContent = '변경사항 저장 (' + n + ')';
}

function updateRoleField(id, field, value, rerender) {
  if (String(id).startsWith('new:')) {
    ui.newRoles[Number(String(id).split(':')[1])][field] = value;
    if (rerender) renderRoles(); else refreshRoleChangeBar();
    return;
  }
  const original = cache.roles.find((x) => x.id === id);
  if (!original || original.protected) return;
  ui.editingRoleId = id;
  if (!ui.roleDrafts[id]) ui.roleDrafts[id] = { name: original.name, description: original.description || '', status: original.status };
  ui.roleDrafts[id][field] = value;
  const d = ui.roleDrafts[id];
  if (d.name === original.name && (d.description || '') === (original.description || '') && d.status === original.status) delete ui.roleDrafts[id];
  if (rerender) renderRoles(); else refreshRoleChangeBar();
}

function renderRoles() {
  const filtered = filterRolesList();
  const rows = [];
  ui.newRoles.forEach((r, idx) => {
    rows.push('<tr class="is-new" data-role-row="new:' + idx + '">' + roleEditableCells(r, 'new:' + idx) + '<td>신규</td></tr>');
  });
  filtered.forEach((r) => {
    const draft = ui.roleDrafts[r.id];
    const view = Object.assign({}, r, draft || {});
    const locked = !!r.protected;
    let rowClass = 'row-readonly';
    if (locked) rowClass = 'row-readonly is-locked';
    else if (draft) rowClass = 'is-changed';
    else if (ui.editingRoleId === r.id) rowClass = 'is-selected';
    rows.push('<tr class="' + rowClass + '" data-role-row="' + r.id + '" data-locked="' + (locked ? '1' : '0') + '">' + ((!locked && isRoleRowEditing(r.id)) ? roleEditableCells(view, r.id) : roleReadOnlyCells(view, locked)) + '<td>' + escapeHtml(view.updatedAt || '') + '<span class="meta-sub">' + escapeHtml(view.updatedBy || '') + '</span></td></tr>');
  });
  const count = filtered.length + ui.newRoles.length;
  $('roleTbody').innerHTML = rows.join('');
  $('roleCountLabel').textContent = '역할 ' + count + '개';
  $('roleFooterTotal').textContent = '총 ' + count + '개';
  refreshRoleChangeBar();
}

function confirmSaveRoles() {
  const n = roleChangeCount();
  if (!n) return;
  if (!canWriteDb()) { toast('운영 DB 연결 후 저장할 수 있습니다.'); return; }
  const cards = [];
  ui.newRoles.forEach((r) => {
    cards.push('<div class="summary-card is-new"><div class="summary-head"><strong>' + escapeHtml(r.name || '(역할명 없음)') + '</strong><span class="badge-new">신규 등록</span></div><div class="meta meta-new">사용자 정의 · ' + escapeHtml(r.description || '-') + ' · ' + statusLabel(r.status) + '</div></div>');
  });
  Object.keys(ui.roleDrafts).forEach((id) => {
    const before = cache.roles.find((x) => x.id === id);
    const after = Object.assign({}, before, ui.roleDrafts[id]);
    const rows = [];
    if (before.name !== after.name) rows.push('<div class="summary-row"><span class="label">역할명</span><span>' + diffText(before.name, after.name) + '</span></div>');
    if ((before.description || '') !== (after.description || '')) rows.push('<div class="summary-row"><span class="label">설명</span><span>' + diffText(before.description, after.description) + '</span></div>');
    const statusChanged = before.status !== after.status;
    const cardClass = (before.description || '') !== (after.description || '') && before.name === after.name ? 'summary-card is-role-changed' : 'summary-card is-changed';
    cards.push('<div class="' + cardClass + '"><div class="summary-head"><strong>' + escapeHtml(after.name) + '</strong></div>' + rows.join('') + (statusChanged ? '<div class="status-diff"><span class="status-diff-icon">!</span>상태&nbsp;&nbsp;' + escapeHtml(statusLabel(before.status)) + ' → <span class="diff-after">' + escapeHtml(statusLabel(after.status)) + '</span></div>' : '') + ((before.description || '') !== (after.description || '') ? '<div class="summary-row" style="margin-top:12px;color:#0f62fe;font-weight:600;">설명 변경</div>' : '') + '</div>');
  });
  openModal('<div class="modal"><div class="modal-header"><h2>변경사항 저장</h2><button class="btn btn-ghost" type="button" data-modal-close>✕</button></div><div class="modal-body"><p>역할 ' + n + '개의 변경사항을 저장하시겠습니까?</p>' + cards.join('') + '</div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-modal-close>취소</button><button class="btn btn-primary" type="button" id="modalConfirmRoles">변경사항 저장</button></div></div>');
  $('modalConfirmRoles').onclick = () => { closeModal(); saveRoles(); };
}

async function saveRoles() {
  if (!roleChangeCount()) return;
  try {
    const changes = Object.keys(ui.roleDrafts).map((id) => Object.assign({ id }, ui.roleDrafts[id]));
    const res = await api('saveRoleChanges', { changes, newRoles: ui.newRoles });
    if (!res.ok && res.code === 'ROLE_DEACTIVATE_BLOCKED') {
      const b = res.blocked[0];
      openModal('<div class="modal"><div class="modal-header"><h2>역할을 비활성화할 수 없습니다</h2><button class="btn btn-ghost" type="button" data-modal-close>✕</button></div><div class="modal-body"><p>' + escapeHtml(b.roleName) + ' 역할에 사용자 ' + b.assignedCount + '명이 배정되어 있습니다.</p><div class="summary-card is-changed"><div class="summary-head"><strong>' + escapeHtml(b.roleName) + '</strong></div><div class="meta">배정 사용자 ' + b.assignedCount + '명</div></div></div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-modal-close>닫기</button><button class="btn btn-primary" type="button" id="modalGotoUsers">배정 사용자 확인</button></div></div>');
      $('modalGotoUsers').onclick = () => { closeModal(); ui.filters.users.roleId = b.roleId; navigate('settings-users'); };
      return;
    }
    toast(res.message || '저장되었습니다.');
    const fresh = await api('loadAllData');
    applyCache(fresh);
    ui.roleDrafts = {};
    ui.editingRoleId = null;
    ui.newRoles = [];
    renderRoles();
  } catch (err) { toast(err.message || String(err)); }
}

function getPermRole() {
  return cache.roles.find((r) => r.id === ui.permRoleId) || cache.roles[0];
}

function initPermPage(roleId) {
  ui.permRoleId = roleId || ui.permRoleId || ($('permRoleSelect').value) || (cache.roles.find((r) => r.id === 'role_finance') || cache.roles[0] || {}).id;
  fillRoleFilterOptions();
  $('permRoleSelect').value = ui.permRoleId;
  const role = getPermRole();
  const perms = cache.permissionsByRole[ui.permRoleId] || {};
  ui.permValues = JSON.parse(JSON.stringify(perms));
  ui.permBaseline = JSON.parse(JSON.stringify(perms));
  ui.permChanges = {};
  const meta = cache.permissionMeta[ui.permRoleId] || {};
  $('permTypeValue').textContent = role.typeLabel || '-';
  $('permStatusValue').innerHTML = '<span class="status-dot ' + (role.status === 'active' ? 'on' : '') + '" style="display:inline-block;margin-right:6px;"></span>' + statusLabel(role.status);
  $('permAssigned').textContent = (role.assignedCount || 0) + '명';
  $('permSavedValue').textContent = (meta.savedAt || role.updatedAt || '-') + ' · ' + (meta.savedBy || role.updatedBy || '');
  renderPermissions();
}

function getPerm(screenId, key) {
  const changed = ui.permChanges[screenId];
  if (changed && Object.prototype.hasOwnProperty.call(changed, key)) return changed[key];
  return !!(ui.permValues[screenId] && ui.permValues[screenId][key]);
}

function setPerm(screenId, key, value, silent) {
  const role = getPermRole();
  if (role && role.protected) { showProtectedRoleModal(); return; }
  const base = !!(ui.permBaseline[screenId] && ui.permBaseline[screenId][key]);
  if (!ui.permChanges[screenId]) ui.permChanges[screenId] = {};
  if (base === value) {
    delete ui.permChanges[screenId][key];
    if (!Object.keys(ui.permChanges[screenId]).length) delete ui.permChanges[screenId];
  } else {
    ui.permChanges[screenId][key] = value;
  }
  if (!silent) renderPermissions();
}

function aggregateParent(node, key) {
  if (!node.children || !node.children.length) return getPerm(node.id, key) ? 'on' : 'off';
  let on = 0, off = 0, applicable = 0;
  node.children.forEach((c) => {
    if (!c.applicable[key]) return;
    applicable++;
    if (getPerm(c.id, key)) on++; else off++;
  });
  if (!applicable) return 'na';
  if (on && off) return 'mixed';
  return on ? 'on' : 'off';
}

function renderPermissions() {
  const role = getPermRole();
  const cols = cache.columns;
  const changeN = permChangeCount();
  const bodyRows = [];
  cache.permissionTree.forEach((group) => {
    const expanded = !!ui.expandedGroups[group.id];
    bodyRows.push('<tr class="perm-group" data-expand="' + group.id + '"><td>' + (expanded ? '▼' : '▶') + ' ' + escapeHtml(group.name) + '<span class="meta-sub">' + group.children.length + '개 화면</span></td>' + cols.map((c) => {
      const st = aggregateParent(group, c.key);
      if (st === 'na') return '<td class="na">해당 없음</td>';
      if (st === 'mixed') return '<td>−</td>';
      return '<td><input class="check" type="checkbox"' + (st === 'on' ? ' checked' : '') + ' data-pparent="' + group.id + '" data-pkey="' + c.key + '"></td>';
    }).join('') + '</tr>');
    if (expanded) {
      group.children.forEach((child) => {
        bodyRows.push('<tr class="perm-child"><td>└ ' + escapeHtml(child.name) + '</td>' + cols.map((c) => {
          if (!child.applicable[c.key]) return '<td class="na">해당 없음</td>';
          const val = getPerm(child.id, c.key);
          const changed = ui.permChanges[child.id] && Object.prototype.hasOwnProperty.call(ui.permChanges[child.id], c.key);
          return '<td class="' + (changed ? 'cell-changed' : '') + '"><input class="check" type="checkbox"' + (val ? ' checked' : '') + ' data-pscreen="' + child.id + '" data-pkey="' + c.key + '">' + (changed ? '<span class="change-badge">변경</span>' : '') + '</td>';
        }).join('') + '</tr>');
      });
    }
  });
  let targetCount = 0;
  cache.permissionTree.forEach((g) => { targetCount += 1 + g.children.length; });
  $('permTbody').innerHTML = bodyRows.join('');
  $('permChangeBar').classList.toggle('show', changeN > 0);
  $('permChangeCount').textContent = changeN + '개 변경됨';
  $('permSave').textContent = '변경사항 저장 (' + changeN + ')';
  $('permFooterTotal').textContent = '총 ' + targetCount + '개 권한 대상';
  $('permFooterChange').textContent = (role.name || '') + ' · 변경 ' + changeN + '개';
}

function showProtectedRoleModal() {
  const r = getPermRole();
  openModal('<div class="modal"><div class="modal-header"><h2>보호 역할은 변경할 수 없습니다</h2><button class="btn btn-ghost" type="button" data-modal-close>✕</button></div><div class="modal-body"><p>' + escapeHtml(r.name) + '는 모든 적용 가능한 권한을 가진 읽기 전용 역할입니다.</p><div class="summary-card"><div class="summary-head"><strong>' + escapeHtml(r.name) + '</strong></div><div class="meta">보호된 기본 역할 · 전체 권한</div></div></div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-modal-close>닫기</button><button class="btn btn-primary" type="button" id="modalGotoRoles">역할 관리</button></div></div>');
  $('modalGotoRoles').onclick = () => { closeModal(); navigate('settings-roles'); };
}

function findScreen(id) {
  for (let i = 0; i < cache.permissionTree.length; i++) {
    const g = cache.permissionTree[i];
    if (g.id === id) return g;
    for (let j = 0; j < g.children.length; j++) {
      if (g.children[j].id === id) return g.children[j];
    }
  }
  return null;
}

function confirmSavePermissions() {
  const n = permChangeCount();
  if (!n) return;
  if (!canWriteDb()) { toast('운영 DB 연결 후 저장할 수 있습니다.'); return; }
  const role = getPermRole();
  if (role.protected) return showProtectedRoleModal();
  const grouped = {};
  Object.keys(ui.permChanges).forEach((sid) => {
    const screen = findScreen(sid) || { name: sid, group: '기타' };
    const groupName = screen.group || '기타';
    if (!grouped[groupName]) grouped[groupName] = [];
    Object.keys(ui.permChanges[sid]).forEach((key) => {
      const col = cache.columns.find((c) => c.key === key);
      grouped[groupName].push({ screenName: screen.name, permName: col ? col.label : key, added: !!ui.permChanges[sid][key] });
    });
  });
  const items = Object.keys(grouped).map((groupName) => '<div class="perm-change-group"><div class="perm-change-group-title">' + escapeHtml(groupName) + '</div>' + grouped[groupName].map((item) => '<div class="summary-card is-changed perm-change-item"><div><strong>' + escapeHtml(item.screenName) + '</strong><div class="meta">' + escapeHtml(item.permName) + '</div></div><span class="' + (item.added ? 'badge-add' : 'badge-remove') + '">' + (item.added ? '추가' : '제거') + '</span></div>').join('') + '</div>').join('');
  openModal('<div class="modal"><div class="modal-header"><h2>권한 변경사항 저장</h2><button class="btn btn-ghost" type="button" data-modal-close>✕</button></div><div class="modal-body"><p>' + escapeHtml(role.name) + ' 역할의 권한 변경 ' + n + '개를 저장하시겠습니까?</p>' + items + '</div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-modal-close>취소</button><button class="btn btn-primary" type="button" id="modalConfirmPerms">권한 변경 저장</button></div></div>');
  $('modalConfirmPerms').onclick = async () => {
    try {
      const res = await api('savePermissionChanges', { roleId: ui.permRoleId, changes: ui.permChanges });
      closeModal();
      if (!res.ok && res.code === 'PROTECTED_ROLE') { showProtectedRoleModal(); return; }
      toast(res.message || '저장되었습니다.');
      const fresh = await api('loadAllData');
      applyCache(fresh);
      initPermPage(ui.permRoleId);
    } catch (err) { toast(err.message || String(err)); }
  };
}

document.addEventListener('click', (e) => {
  if (e.target.closest('[data-modal-close]')) { closeModal(); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    const id = nav.getAttribute('data-nav');
    if (id === 'settings') navigate('settings');
    else navigate('placeholder:' + id);
    return;
  }
  const go = e.target.closest('[data-go]');
  if (go) { navigate(go.getAttribute('data-go')); return; }

  const userRow = e.target.closest('#userTbody tr[data-row]');
  if (userRow && !e.target.closest('input, select, button, label, .role-picker')) {
    const id = userRow.getAttribute('data-row');
    if (!String(id).startsWith('new:') && ui.editingUserId !== id) { ui.editingUserId = id; renderUsers(); }
  }
  const roleRow = e.target.closest('#roleTbody tr[data-role-row]');
  if (roleRow && !e.target.closest('input, button, a, label')) {
    const id = roleRow.getAttribute('data-role-row');
    if (String(id).startsWith('new:')) return;
    if (roleRow.getAttribute('data-locked') === '1') { toast('보호된 역할은 수정할 수 없습니다.'); return; }
    if (ui.editingRoleId !== id) { ui.editingRoleId = id; renderRoles(); }
  }
  const expandRow = e.target.closest('[data-expand]');
  if (expandRow && !e.target.closest('input')) {
    const id = expandRow.getAttribute('data-expand');
    ui.expandedGroups[id] = !ui.expandedGroups[id];
    renderPermissions();
  }
  const gotoRole = e.target.closest('[data-goto-users-role]');
  if (gotoRole) {
    e.preventDefault();
    ui.filters.users.roleId = gotoRole.getAttribute('data-goto-users-role');
    navigate('settings-users');
  }
  if (!e.target.closest('.role-picker')) {
    document.querySelectorAll('.role-picker.open').forEach((p) => p.classList.remove('open'));
  }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.matches('[data-field]')) updateUserField(el.getAttribute('data-id'), el.getAttribute('data-field'), el.value);
  if (el.matches('[data-rfield]')) updateRoleField(el.getAttribute('data-rid'), el.getAttribute('data-rfield'), el.value);
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'userQ') { ui.filters.users.q = el.value; renderUsers(); }
  if (el.id === 'userRole') { ui.filters.users.roleId = el.value; renderUsers(); }
  if (el.id === 'userStatus') { ui.filters.users.status = el.value; renderUsers(); }
  if (el.id === 'roleQ') { ui.filters.roles.q = el.value; renderRoles(); }
  if (el.id === 'roleType') { ui.filters.roles.type = el.value; renderRoles(); }
  if (el.id === 'roleStatus') { ui.filters.roles.status = el.value; renderRoles(); }
  if (el.matches('[data-field][data-id]') && el.tagName === 'SELECT') updateUserField(el.getAttribute('data-id'), el.getAttribute('data-field'), el.value);
  if (el.matches('input[data-role-id]')) {
    const picker = el.closest('.role-picker');
    const id = picker.getAttribute('data-role-picker');
    const roleIds = Array.from(picker.querySelectorAll('input[data-role-id]:checked')).map((x) => x.getAttribute('data-role-id'));
    updateUserField(id, 'roleIds', roleIds);
    renderUsers();
  }
  if (el.matches('[data-pscreen]')) setPerm(el.getAttribute('data-pscreen'), el.getAttribute('data-pkey'), el.checked);
  if (el.matches('[data-pparent]')) {
    const gid = el.getAttribute('data-pparent');
    const key = el.getAttribute('data-pkey');
    const group = cache.permissionTree.find((g) => g.id === gid);
    if (group) {
      group.children.forEach((c) => { if (c.applicable[key]) setPerm(c.id, key, el.checked, true); });
      if (group.applicable[key]) setPerm(group.id, key, el.checked, true);
      renderPermissions();
    }
  }
});

document.addEventListener('click', (e) => {
  const toggle = e.target.closest('[data-toggle]');
  if (toggle) {
    e.stopPropagation();
    const id = toggle.getAttribute('data-toggle');
    const view = getUserView(id);
    const next = view.status === 'active' ? 'inactive' : 'active';
    updateUserField(id, 'status', next);
    renderUsers();
  }
  const rtoggle = e.target.closest('[data-rtoggle]');
  if (rtoggle) {
    e.stopPropagation();
    const id = rtoggle.getAttribute('data-rtoggle');
    const view = getRoleView(id);
    updateRoleField(id, 'status', view.status === 'active' ? 'inactive' : 'active', true);
  }
  const roleToggle = e.target.closest('[data-role-toggle]');
  if (roleToggle) {
    e.stopPropagation();
    const picker = roleToggle.closest('.role-picker');
    const open = picker.classList.contains('open');
    document.querySelectorAll('.role-picker.open').forEach((p) => p.classList.remove('open'));
    if (!open) picker.classList.add('open');
  }
});

    toast('Drive 폴더에 연결했습니다.');
    navigate('settings');
  } catch (err) { toast(err.message || String(err)); }
};

async function init() {
  if ($('loginButton')) {
    $('loginButton').onclick = loginAndLoad;
    return;
  }

  try {
    await loadDataFromServer();
    if (!cache.session.isAdmin) {
      navigate('placeholder:home');
      return;
    }
    navigate('settings');
  } catch (err) {
    showPanel('loading');
    $('panel-loading').innerHTML = '<div class="placeholder-page"><strong>초기화 실패</strong><p>' + escapeHtml(err.message || err) + '</p><p style="margin-top:12px;color:var(--text-3);">운영 Drive가 아직 연결되지 않았다면 새로고침해 보세요. 계속되면 관리자에게 Google 계정 등록을 요청하세요.</p></div>';
  }
}

init();

  </script>
