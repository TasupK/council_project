<script>
var sfPaymentState = {
  page: 1,
  pageSize: 20,
  keyword: '',
  status: '',
  rowsById: {},
  selected: {},
  currentDetail: null,
  currentPayment: null
};

function sfPaymentRow_(row) {
  sfPaymentState.rowsById[String(row.id)] = row;
  var selectable = String(row.status || '') === '접수';
  var paymentStatus = row.payment ? studentFeeBadge(row.payment.moneyStatus) : '<span class="sf-muted">미생성</span>';
  return '<tr>' +
    '<td class="sf-checkbox-cell">' + (selectable ? '<input class="sf-checkbox" type="checkbox" data-role="payment-select" data-id="' + studentFeeEscapeHtml(row.id) + '">' : '') + '</td>' +
    '<td><strong>' + studentFeeEscapeHtml(row.name) + '</strong><span class="sf-muted">' + studentFeeEscapeHtml(row.studentId) + '</span></td>' +
    '<td>' + studentFeeEscapeHtml(row.affiliation || '-') + '</td>' +
    '<td>' + studentFeeDate(row.paymentDate) + '</td>' +
    '<td>' + studentFeeBadge(row.status) + '</td>' +
    '<td>' + paymentStatus + '</td>' +
    '<td class="sf-actions-cell"><button type="button" class="ui-btn outline small" data-action="payment-detail" data-id="' + studentFeeEscapeHtml(row.id) + '">상세</button></td>' +
    '</tr>';
}

function renderSfPaymentTable_(data) {
  sfPaymentState.rowsById = {};
  sfPaymentState.selected = {};
  updateSfPaymentBulk_();
  var rows = data.items || [];
  var body = rows.length ? rows.map(sfPaymentRow_).join('') : '<tr><td colspan="7" class="ui-empty">조건에 맞는 납부신청이 없습니다.</td></tr>';
  studentFeeGetElement('sf-payment-table').innerHTML = '<table class="ui-table"><thead><tr><th class="sf-checkbox-cell"></th><th>신청자</th><th>소속</th><th>납입날짜</th><th>신청상태</th><th>금전상태</th><th>관리</th></tr></thead><tbody>' + body + '</tbody></table>';
  studentFeeGetElement('sf-payment-count').textContent = (data.total || 0) + '건';
  studentFeeGetElement('sf-payment-pagination').innerHTML = studentFeePaginationHtml(data, 'payment-page');
}

function updateSfPaymentBulk_() {
  var ids = Object.keys(sfPaymentState.selected).filter(function (id) { return sfPaymentState.selected[id]; });
  studentFeeGetElement('sf-payment-selected-count').textContent = ids.length;
  studentFeeGetElement('sf-payment-bulk').classList.toggle('show', ids.length > 0);
}

function selectedSfPaymentIds_() {
  return Object.keys(sfPaymentState.selected).filter(function (id) { return sfPaymentState.selected[id]; });
}

function loadSfPaymentList_() {
  var loading = studentFeeGetElement('sf-payment-loading');
  var error = studentFeeGetElement('sf-payment-error');
  loading.hidden = false;
  error.hidden = true;
  return studentFeeApi('api_getStudentFeeApplications', {
    keyword: sfPaymentState.keyword,
    status: sfPaymentState.status,
    page: sfPaymentState.page,
    pageSize: sfPaymentState.pageSize
  }).then(function (data) {
    loading.hidden = true;
    renderSfPaymentTable_(data || {});
  }).catch(function (failure) {
    loading.hidden = true;
    error.hidden = false;
    error.textContent = failure && failure.message ? failure.message : '납부신청 목록을 불러오지 못했습니다.';
    studentFeeHandleError(failure);
  });
}

function renderSfPaymentDetail_(detail) {
  sfPaymentState.currentDetail = detail;
  sfPaymentState.currentPayment = detail.payment || null;
  var app = detail.application || {};
  var payment = detail.payment || null;
  studentFeeGetElement('sf-payment-detail-content').innerHTML =
    '<div class="sf-detail-grid">' +
      '<div class="sf-detail-box"><small>신청자</small><strong>' + studentFeeEscapeHtml(app.name || '-') + '</strong></div>' +
      '<div class="sf-detail-box"><small>학번</small><strong>' + studentFeeEscapeHtml(app.studentId || '-') + '</strong></div>' +
      '<div class="sf-detail-box"><small>소속</small><strong>' + studentFeeEscapeHtml(app.affiliation || '-') + '</strong></div>' +
      '<div class="sf-detail-box"><small>납입날짜</small><strong>' + studentFeeDate(app.paymentDate) + '</strong></div>' +
      '<div class="sf-detail-box"><small>신청상태</small><strong>' + studentFeeBadge(app.status) + '</strong></div>' +
      '<div class="sf-detail-box"><small>금전상태</small><strong>' + (payment ? studentFeeBadge(payment.moneyStatus) : '미생성') + '</strong></div>' +
    '</div>' +
    '<div class="sf-evidence-grid">' +
      '<div class="sf-evidence"><small>학생카드 캡처 파일 ID</small>' + studentFeeEscapeHtml(app.studentCardFileId || '-') + '</div>' +
      '<div class="sf-evidence"><small>입금 캡처 파일 ID</small>' + studentFeeEscapeHtml(app.depositFileId || '-') + '</div>' +
    '</div>' +
    (payment ? '<div class="sf-modal-amount"><span>납부금액</span><strong>' + studentFeeMoney(payment.amount) + '</strong></div>' : '');

  var actions = '<button type="button" class="ui-btn outline" data-action="close-payment-detail">닫기</button>';
  if (String(app.status || '') === '접수') {
    actions += '<button type="button" class="ui-btn danger" data-action="reject-payment" data-id="' + studentFeeEscapeHtml(app.id) + '">반려</button>';
    actions += '<button type="button" class="ui-btn" data-action="approve-payment" data-id="' + studentFeeEscapeHtml(app.id) + '">승인</button>';
  }
  if (payment && String(payment.moneyStatus || '') === '대기') {
    actions += '<button type="button" class="ui-btn success" data-action="open-payment-confirm">입금 확인</button>';
  }
  studentFeeGetElement('sf-payment-detail-actions').innerHTML = actions;
}

function openSfPaymentDetail_(applicationId) {
  studentFeeApi('api_getStudentFeeApplication', { applicationId: applicationId })
    .then(function (detail) {
      renderSfPaymentDetail_(detail || {});
      studentFeeOpenModal('sf-payment-detail-modal');
    })
    .catch(function (error) { studentFeeHandleError(error); });
}

function approveSfPaymentApplication_(application, button) {
  if (!application) return Promise.resolve(null);
  return studentFeeRunBusy(button, function () {
    return studentFeeApi('api_calculateStudentFeeAmount', { paymentDate: application.paymentDate })
      .then(function (calculation) {
        var amount = calculation && calculation.amount;
        if (!studentFeeConfirm(studentFeeMoney(amount) + '으로 납부신청을 승인하시겠습니까?')) return null;
        return studentFeeApi('api_processStudentFeeApplications', {
          ids: [application.id],
          action: 'APPROVE',
          reason: ''
        });
      })
      .then(function (result) {
        if (!result) return null;
        studentFeeCloseModal('sf-payment-detail-modal');
        studentFeeShowToast('납부신청을 승인했습니다.');
        return loadSfPaymentList_();
      });
  }).catch(function (error) {
    studentFeeHandleError(error);
  });
}

function rejectSfPaymentApplication_(applicationId, button) {
  if (!studentFeeConfirm('이 납부신청을 반려하시겠습니까?')) return;
  studentFeeRunBusy(button, function () {
    return studentFeeApi('api_processStudentFeeApplications', {
      ids: [applicationId],
      action: 'REJECT',
      reason: ''
    }).then(function () {
      studentFeeCloseModal('sf-payment-detail-modal');
      studentFeeShowToast('납부신청을 반려했습니다.');
      return loadSfPaymentList_();
    });
  }).catch(function (error) { studentFeeHandleError(error); });
}

function bulkApproveSfPayments_(button) {
  var ids = selectedSfPaymentIds_();
  if (!ids.length) return;
  var rows = ids.map(function (id) { return sfPaymentState.rowsById[id]; }).filter(Boolean);
  studentFeeRunBusy(button, function () {
    return Promise.all(rows.map(function (row) {
      return studentFeeApi('api_calculateStudentFeeAmount', { paymentDate: row.paymentDate });
    })).then(function (calculations) {
      var total = calculations.reduce(function (sum, item) { return sum + (Number(item.amount) || 0); }, 0);
      if (!studentFeeConfirm(ids.length + '건, 합계 ' + studentFeeMoney(total) + '을 승인하시겠습니까?')) return null;
      return studentFeeApi('api_processStudentFeeApplications', {
        ids: ids,
        action: 'APPROVE',
        reason: ''
      });
    }).then(function (result) {
      if (!result) return null;
      studentFeeShowToast(ids.length + '건을 승인했습니다.');
      return loadSfPaymentList_();
    });
  }).catch(function (error) { studentFeeHandleError(error); });
}

function bulkRejectSfPayments_(button) {
  var ids = selectedSfPaymentIds_();
  if (!ids.length || !studentFeeConfirm(ids.length + '건을 반려하시겠습니까?')) return;
  studentFeeRunBusy(button, function () {
    return studentFeeApi('api_processStudentFeeApplications', {
      ids: ids,
      action: 'REJECT',
      reason: ''
    }).then(function () {
      studentFeeShowToast(ids.length + '건을 반려했습니다.');
      return loadSfPaymentList_();
    });
  }).catch(function (error) { studentFeeHandleError(error); });
}

function openSfPaymentConfirm_() {
  if (!sfPaymentState.currentPayment) return;
  var form = studentFeeGetElement('sf-payment-confirm-form');
  form.reset();
  form.elements.depositorName.value = sfPaymentState.currentPayment.depositorName || '';
  studentFeeOpenModal('sf-payment-confirm-modal');
}

function confirmSfPayment_(result, button) {
  var payment = sfPaymentState.currentPayment;
  if (!payment || ['DONE', 'MISMATCH'].indexOf(result) < 0) return;
  var form = studentFeeGetElement('sf-payment-confirm-form');
  var message = result === 'DONE' ? '입금 완료로 처리하시겠습니까?' : '입금 불일치로 처리하시겠습니까?';
  if (!studentFeeConfirm(message)) return;
  studentFeeRunBusy(button, function () {
    return studentFeeApi('api_confirmStudentFeePayment', {
      paymentId: payment.id,
      result: result,
      depositorName: form.elements.depositorName.value.trim(),
      reason: form.elements.reason.value.trim()
    }).then(function () {
      studentFeeCloseModal('sf-payment-confirm-modal');
      studentFeeCloseModal('sf-payment-detail-modal');
      studentFeeShowToast('입금 확인 상태를 변경했습니다.');
      return loadSfPaymentList_();
    });
  }).catch(function (error) {
    studentFeeHandleError(error);
  });
}

studentFeeGetElement('sf-payment-search').addEventListener('submit', function (event) {
  event.preventDefault();
  sfPaymentState.keyword = event.target.elements.keyword.value.trim();
  sfPaymentState.status = event.target.elements.status.value;
  sfPaymentState.page = 1;
  loadSfPaymentList_();
});
studentFeeGetElement('sf-payment-reset').addEventListener('click', function () {
  sfPaymentState.keyword = '';
  sfPaymentState.status = '';
  sfPaymentState.page = 1;
  studentFeeGetElement('sf-payment-search').reset();
  loadSfPaymentList_();
});
document.addEventListener('change', function (event) {
  if (!event.target.matches('[data-role="payment-select"]')) return;
  sfPaymentState.selected[event.target.dataset.id] = event.target.checked;
  updateSfPaymentBulk_();
});
document.addEventListener('click', function (event) {
  var button = event.target.closest('[data-action]');
  if (!button || button.disabled) return;
  var action = button.dataset.action;
  if (action === 'payment-detail') openSfPaymentDetail_(button.dataset.id);
  else if (action === 'close-payment-detail') studentFeeCloseModal('sf-payment-detail-modal');
  else if (action === 'approve-payment') approveSfPaymentApplication_(sfPaymentState.currentDetail && sfPaymentState.currentDetail.application, button);
  else if (action === 'reject-payment') rejectSfPaymentApplication_(button.dataset.id, button);
  else if (action === 'bulk-approve-payment') bulkApproveSfPayments_(button);
  else if (action === 'bulk-reject-payment') bulkRejectSfPayments_(button);
  else if (action === 'open-payment-confirm') openSfPaymentConfirm_();
  else if (action === 'close-payment-confirm') studentFeeCloseModal('sf-payment-confirm-modal');
  else if (action === 'confirm-payment') confirmSfPayment_(button.dataset.result, button);
  else if (action === 'payment-page') {
    sfPaymentState.page = Number(button.dataset.page) || 1;
    loadSfPaymentList_();
  }
});

loadSfPaymentList_();
</script>
