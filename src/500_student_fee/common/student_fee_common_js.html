<script>
function studentFeeApi(functionName, request) {
  return runAppApi(functionName, request || {});
}

function studentFeeSetBusy(element, busy) {
  if (!element) return true;
  if (busy) {
    if (element.dataset && element.dataset.busy === 'true') return false;
    if (element.dataset) element.dataset.busy = 'true';
    element.disabled = true;
    return true;
  }
  if (element.dataset) delete element.dataset.busy;
  element.disabled = false;
  return true;
}

function studentFeeRunBusy(element, task) {
  if (!studentFeeSetBusy(element, true)) return Promise.resolve(null);
  var result;
  try {
    result = task();
  } catch (error) {
    studentFeeSetBusy(element, false);
    return Promise.reject(error);
  }
  return Promise.resolve(result).then(function (value) {
    studentFeeSetBusy(element, false);
    return value;
  }, function (error) {
    studentFeeSetBusy(element, false);
    throw error;
  });
}

function studentFeeGetElement(id) {
  return document.getElementById(id);
}

function studentFeeShowToast(message, isError) {
  var toast = studentFeeGetElement('sf-toast');
  if (!toast) return;
  toast.textContent = message || '';
  toast.classList.toggle('error', Boolean(isError));
  toast.hidden = false;
  window.clearTimeout(studentFeeShowToast.timer);
  studentFeeShowToast.timer = window.setTimeout(function () { toast.hidden = true; }, 4200);
}

function studentFeeHandleError(error) {
  studentFeeShowToast(error && error.message ? error.message : '오류가 발생했습니다.', true);
}

function studentFeeOpenModal(id) {
  var modal = studentFeeGetElement(id);
  if (modal) modal.hidden = false;
}

function studentFeeCloseModal(id) {
  var modal = studentFeeGetElement(id);
  if (modal) modal.hidden = true;
}

function studentFeeEscapeHtml(value) {
  return String(value === null || typeof value === 'undefined' ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function studentFeeMoney(value) {
  if (value === null || value === '' || typeof value === 'undefined') return '-';
  var number = Number(value);
  return isFinite(number) ? number.toLocaleString('ko-KR') + '원' : studentFeeEscapeHtml(value);
}

function studentFeeDate(value) {
  return value ? studentFeeEscapeHtml(String(value).slice(0, 10).replace(/-/g, '.')) : '-';
}

function studentFeeStatusKind(value) {
  var text = String(value || '');
  if (['승인', '완료'].indexOf(text) >= 0) return 'success';
  if (['접수', '대기'].indexOf(text) >= 0) return 'warning';
  if (['반려', '불일치', '실패'].indexOf(text) >= 0) return 'danger';
  return 'neutral';
}

function studentFeeBadge(value, fallback) {
  var label = value || fallback || '-';
  return '<span class="ui-badge ui-badge-' + studentFeeStatusKind(label) + '">' + studentFeeEscapeHtml(label) + '</span>';
}

function studentFeePaginationHtml(data, action) {
  var page = Math.max(Number(data && data.page) || 1, 1);
  var pageSize = Math.max(Number(data && data.pageSize) || 20, 1);
  var total = Math.max(Number(data && data.total) || 0, 0);
  var totalPages = Math.max(Math.ceil(total / pageSize), 1);
  if (totalPages <= 1) return '<div class="ui-pagination"></div>';
  var start = Math.max(1, page - 2);
  var end = Math.min(totalPages, start + 4);
  var html = '<div class="ui-pagination">';
  html += '<button type="button" class="ui-page-btn" data-action="' + studentFeeEscapeHtml(action) + '" data-page="' + Math.max(1, page - 1) + '" ' + (page <= 1 ? 'disabled' : '') + '>‹</button>';
  for (var index = start; index <= end; index += 1) {
    html += '<button type="button" class="ui-page-btn ' + (index === page ? 'active' : '') + '" data-action="' + studentFeeEscapeHtml(action) + '" data-page="' + index + '">' + index + '</button>';
  }
  html += '<button type="button" class="ui-page-btn" data-action="' + studentFeeEscapeHtml(action) + '" data-page="' + Math.min(totalPages, page + 1) + '" ' + (page >= totalPages ? 'disabled' : '') + '>›</button>';
  return html + '</div>';
}

function studentFeeConfirm(message) {
  return window.confirm(message);
}
</script>
