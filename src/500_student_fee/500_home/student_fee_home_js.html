<script>
function sfHomeStatCard_(label, value, kind, route) {
  var tag = route ? 'button' : 'div';
  var routeAttr = route ? ' type="button" data-route="' + studentFeeEscapeHtml(route) + '"' : '';
  return '<' + tag + ' class="ui-stat-card ' + (kind || '') + '"' + routeAttr + '>' +
    '<span>' + studentFeeEscapeHtml(label) + '</span><strong>' + studentFeeEscapeHtml(value) + '</strong></' + tag + '>';
}

function sfHomeSection_(title, cards) {
  return '<section class="ui-card sf-section"><h2 class="sf-section-title">' + studentFeeEscapeHtml(title) + '</h2>' +
    '<div class="ui-stat-grid">' + cards.join('') + '</div></section>';
}

function renderStudentFeeSummary_(data) {
  var payers = data.payers || {};
  var applications = data.applications || {};
  var payments = data.payments || {};
  var refundRequests = data.refundRequests || {};
  var refunds = data.refunds || {};
  var content = studentFeeGetElement('sf-home-content');
  content.innerHTML = [
    sfHomeSection_('가입자', [
      sfHomeStatCard_('전체 가입자', (payers.total || 0) + '명', 'info', 'student_fee_payers')
    ]),
    sfHomeSection_('납부신청', [
      sfHomeStatCard_('전체', (applications.total || 0) + '건', '', 'student_fee_payments'),
      sfHomeStatCard_('접수', (applications.pending || 0) + '건', 'warning', 'student_fee_payments'),
      sfHomeStatCard_('승인', (applications.approved || 0) + '건', 'success', 'student_fee_payments'),
      sfHomeStatCard_('반려', (applications.rejected || 0) + '건', 'danger', 'student_fee_payments')
    ]),
    sfHomeSection_('납부', [
      sfHomeStatCard_('전체', (payments.total || 0) + '건', ''),
      sfHomeStatCard_('대기', (payments.pending || 0) + '건', 'warning', 'student_fee_payments'),
      sfHomeStatCard_('완료', (payments.completed || 0) + '건', 'success', 'student_fee_payments'),
      sfHomeStatCard_('불일치', (payments.mismatch || 0) + '건', 'danger', 'student_fee_payments'),
      sfHomeStatCard_('완료 금액', studentFeeMoney(payments.completedAmount || 0), 'info', 'student_fee_payments')
    ]),
    sfHomeSection_('환불신청', [
      sfHomeStatCard_('전체', (refundRequests.total || 0) + '건', '', 'student_fee_refunds'),
      sfHomeStatCard_('접수', (refundRequests.pending || 0) + '건', 'warning', 'student_fee_refunds'),
      sfHomeStatCard_('승인', (refundRequests.approved || 0) + '건', 'success', 'student_fee_refunds'),
      sfHomeStatCard_('반려', (refundRequests.rejected || 0) + '건', 'danger', 'student_fee_refunds')
    ]),
    sfHomeSection_('환불', [
      sfHomeStatCard_('전체', (refunds.total || 0) + '건', ''),
      sfHomeStatCard_('대기', (refunds.pending || 0) + '건', 'warning', 'student_fee_refunds'),
      sfHomeStatCard_('완료', (refunds.completed || 0) + '건', 'success', 'student_fee_refunds'),
      sfHomeStatCard_('실패', (refunds.failed || 0) + '건', 'danger', 'student_fee_refunds'),
      sfHomeStatCard_('완료 금액', studentFeeMoney(refunds.completedAmount || 0), 'info', 'student_fee_refunds')
    ])
  ].join('');
}

function loadStudentFeeSummary_() {
  var loading = studentFeeGetElement('sf-home-loading');
  var error = studentFeeGetElement('sf-home-error');
  loading.hidden = false;
  error.hidden = true;
  studentFeeApi('api_getStudentFeeSummary', {})
    .then(function (data) {
      loading.hidden = true;
      renderStudentFeeSummary_(data || {});
    })
    .catch(function (failure) {
      loading.hidden = true;
      error.hidden = false;
      error.textContent = failure && failure.message ? failure.message : '현황을 불러오지 못했습니다.';
      studentFeeHandleError(failure);
    });
}

document.addEventListener('click', function (event) {
  var target = event.target.closest('[data-route]');
  if (!target) return;
  window.top.location.href = buildAppPageUrl(target.dataset.route);
});

loadStudentFeeSummary_();
</script>
