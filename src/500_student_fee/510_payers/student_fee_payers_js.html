<script>
var sfPayerState = {
  page: 1,
  pageSize: 20,
  keyword: '',
  affiliation: '',
  references: { semesters: [] },
  rowsByToken: {},
  editingStudentIdKey: ''
};

function sfPayerSemesterLabel_(id) {
  var semesters = sfPayerState.references.semesters || [];
  for (var index = 0; index < semesters.length; index += 1) {
    if (String(semesters[index].id) === String(id)) return semesters[index].label || semesters[index].id;
  }
  return id || '-';
}

function sfPayerSemesterOptions_(selectedId) {
  var selected = String(selectedId || '');
  return (sfPayerState.references.semesters || []).filter(function (semester) {
    return Boolean(semester.active) || String(semester.id) === selected;
  }).map(function (semester) {
    return '<option value="' + studentFeeEscapeHtml(semester.id) + '" ' + (String(semester.id) === selected ? 'selected' : '') + '>' +
      studentFeeEscapeHtml(semester.label || semester.id) + (semester.active ? '' : ' (비활성)') + '</option>';
  }).join('');
}

function renderSfPayerTable_(data) {
  var rows = data.items || [];
  sfPayerState.rowsByToken = {};
  var body = rows.length ? rows.map(function (row, index) {
    var token = 'payer-' + index;
    sfPayerState.rowsByToken[token] = row;
    return '<tr>' +
      '<td><strong>' + studentFeeEscapeHtml(row.studentId) + '</strong></td>' +
      '<td>' + studentFeeEscapeHtml(row.name) + '</td>' +
      '<td>' + studentFeeEscapeHtml(row.affiliation) + '</td>' +
      '<td>' + studentFeeEscapeHtml(sfPayerSemesterLabel_(row.startSemesterId)) + '</td>' +
      '<td>' + studentFeeDate(row.updatedAt) + '</td>' +
      '<td class="sf-actions-cell"><button type="button" class="ui-btn outline small" data-action="edit-payer" data-token="' + token + '">수정</button></td>' +
      '</tr>';
  }).join('') : '<tr><td colspan="6" class="ui-empty">조건에 맞는 가입자가 없습니다.</td></tr>';

  studentFeeGetElement('sf-payer-table').innerHTML = '<table class="ui-table"><thead><tr><th>학번</th><th>성명</th><th>소속</th><th>적용 시작 학기</th><th>수정일시</th><th>관리</th></tr></thead><tbody>' + body + '</tbody></table>';
  studentFeeGetElement('sf-payer-count').textContent = (data.total || 0) + '명';
  studentFeeGetElement('sf-payer-pagination').innerHTML = studentFeePaginationHtml(data, 'payer-page');
}

function loadSfPayerList_() {
  var loading = studentFeeGetElement('sf-payer-loading');
  var error = studentFeeGetElement('sf-payer-error');
  loading.hidden = false;
  error.hidden = true;
  return studentFeeClient.getPayers({
    keyword: sfPayerState.keyword,
    affiliation: sfPayerState.affiliation,
    page: sfPayerState.page,
    pageSize: sfPayerState.pageSize
  }).then(function (data) {
    loading.hidden = true;
    renderSfPayerTable_(data || {});
  }).catch(function (failure) {
    loading.hidden = true;
    error.hidden = false;
    error.textContent = failure && failure.message ? failure.message : '가입자 목록을 불러오지 못했습니다.';
    studentFeeHandleError(failure);
  });
}

function loadSfPayerReferences_() {
  return studentFeeClient.getReference().then(function (data) {
    sfPayerState.references = data || { semesters: [] };
  });
}

function resetSfPayerForm_() {
  var form = studentFeeGetElement('sf-payer-form');
  form.reset();
  sfPayerState.editingStudentIdKey = '';
  form.elements.studentId.readOnly = false;
  form.elements.startSemesterId.innerHTML = sfPayerSemesterOptions_('');
  studentFeeGetElement('sf-payer-modal-title').textContent = '가입자 등록';
  studentFeeGetElement('sf-payer-modal-desc').textContent = '학번, 성명, 소속, 적용 시작 학기를 입력합니다.';
}

function openSfPayerCreate_() {
  resetSfPayerForm_();
  studentFeeOpenModal('sf-payer-modal');
}

function openSfPayerEdit_(token) {
  var row = sfPayerState.rowsByToken[token];
  if (!row || !row.studentIdKey) return;
  var studentIdKey = row.studentIdKey;
  studentFeeClient.getPayer({ studentId: studentIdKey })
    .then(function (detail) {
      var form = studentFeeGetElement('sf-payer-form');
      sfPayerState.editingStudentIdKey = studentIdKey;
      form.elements.studentId.value = detail.studentId || studentIdKey;
      form.elements.studentId.readOnly = true;
      form.elements.name.value = detail.name || '';
      form.elements.affiliation.value = detail.affiliation || '';
      form.elements.startSemesterId.innerHTML = sfPayerSemesterOptions_(detail.startSemesterId);
      form.elements.startSemesterId.value = detail.startSemesterId || '';
      studentFeeGetElement('sf-payer-modal-title').textContent = '가입자 수정';
      studentFeeGetElement('sf-payer-modal-desc').textContent = '학번은 변경할 수 없습니다.';
      studentFeeOpenModal('sf-payer-modal');
    })
    .catch(function (error) { studentFeeHandleError(error); });
}

function submitSfPayer_(event) {
  event.preventDefault();
  var form = event.target;
  var button = studentFeeGetElement('sf-payer-submit');
  var name = form.elements.name.value.trim();
  var affiliation = form.elements.affiliation.value.trim();
  var startSemesterId = form.elements.startSemesterId.value;
  if (!name || !affiliation || !startSemesterId) {
    studentFeeShowToast('필수 정보를 모두 입력해주세요.', true);
    return;
  }

  var isEdit = Boolean(sfPayerState.editingStudentIdKey);
  var payload;
  if (isEdit) {
    payload = { studentId: sfPayerState.editingStudentIdKey, name: name, affiliation: affiliation, startSemesterId: startSemesterId };
  } else {
    var studentId = form.elements.studentId.value.trim();
    if (!studentId) {
      studentFeeShowToast('학번을 입력해주세요.', true);
      return;
    }
    payload = { studentId: studentId, name: name, affiliation: affiliation, startSemesterId: startSemesterId };
  }

  studentFeeRunBusy(button, function () {
    return (isEdit ? studentFeeClient.updatePayer(payload) : studentFeeClient.createPayer(payload)).then(function () {
      studentFeeCloseModal('sf-payer-modal');
      studentFeeShowToast(isEdit ? '가입자 정보를 수정했습니다.' : '가입자를 등록했습니다.');
      return loadSfPayerList_();
    });
  }).catch(function (error) { studentFeeHandleError(error); });
}

studentFeeGetElement('sf-payer-create').addEventListener('click', openSfPayerCreate_);
studentFeeGetElement('sf-payer-reset').addEventListener('click', function () {
  sfPayerState.keyword = '';
  sfPayerState.affiliation = '';
  sfPayerState.page = 1;
  studentFeeGetElement('sf-payer-search').reset();
  loadSfPayerList_();
});
studentFeeGetElement('sf-payer-search').addEventListener('submit', function (event) {
  event.preventDefault();
  sfPayerState.keyword = event.target.elements.keyword.value.trim();
  sfPayerState.affiliation = event.target.elements.affiliation.value.trim();
  sfPayerState.page = 1;
  loadSfPayerList_();
});
studentFeeGetElement('sf-payer-form').addEventListener('submit', submitSfPayer_);
document.addEventListener('click', function (event) {
  var target = event.target.closest('[data-action]');
  if (!target) return;
  if (target.dataset.action === 'close-payer-modal') studentFeeCloseModal('sf-payer-modal');
  if (target.dataset.action === 'edit-payer') openSfPayerEdit_(target.dataset.token);
  if (target.dataset.action === 'payer-page') {
    sfPayerState.page = Number(target.dataset.page) || 1;
    loadSfPayerList_();
  }
});

loadSfPayerReferences_()
  .then(function () { return loadSfPayerList_(); })
  .catch(function (error) { studentFeeHandleError(error); });
</script>
