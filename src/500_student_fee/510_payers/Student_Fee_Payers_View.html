<div class="sf-workspace">
  <section class="ui-page-head">
    <div>
      <small>학생회비관리 / 가입자 조회</small>
      <h1>가입자 조회</h1>
      <p class="ui-page-desc">학생회비 납부자 정보를 검색하고 등록·수정합니다.</p>
    </div>
    <button type="button" class="ui-btn" id="sf-payer-create">＋ 신규 등록</button>
  </section>

  <section class="ui-card sf-table-card">
    <form id="sf-payer-search" class="ui-toolbar sf-table-toolbar">
      <div class="ui-field grow sf-search">
        <label for="sf-payer-keyword">학번·성명 검색</label>
        <input id="sf-payer-keyword" name="keyword" type="search" placeholder="학번 또는 성명">
      </div>
      <div class="ui-field">
        <label for="sf-payer-affiliation">소속</label>
        <input id="sf-payer-affiliation" name="affiliation" type="text" placeholder="전체">
      </div>
      <button type="button" class="ui-btn outline" id="sf-payer-reset">초기화</button>
      <button type="submit" class="ui-btn">검색</button>
      <span class="ui-count" id="sf-payer-count">0명</span>
    </form>
    <div id="sf-payer-table" class="ui-table-wrap"></div>
    <div id="sf-payer-pagination" class="sf-table-footer"></div>
    <div id="sf-payer-loading" class="ui-loading">불러오는 중입니다.</div>
    <div id="sf-payer-error" class="sf-error-state" hidden></div>
  </section>

  <div id="sf-toast" class="ui-toast" role="status" hidden></div>
</div>
