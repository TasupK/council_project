<script>
var sfRefundState = {
  page: 1,
  pageSize: 20,
  keyword: '',
  status: '',
  rowsById: {},
  selected: {},
  currentDetail: null,
  currentCalculation: null,
  currentRefund: null
};

function sfRefundRow_(row) {
  sfRefundState.rowsById[String(row.id)] = row;
  var selectable = String(row.status || '') === '접수';
  var refundStatus = row.refund ? studentFeeBadge(row.refund.moneyStatus) : '<span class="sf-muted">미생성</span>';
  return '<tr>' +
    '<td class="sf-checkbox-cell">' + (selectable ? '<input class="sf-checkbox" type="checkbox" data-role="refund-select" data-id="' + studentFeeEscapeHtml(row.id) + '">' : '') + '</td>' +
    '<td><strong>' + studentFeeEscapeHtml(row.accountHolder || '-') + '</strong><span class="sf-muted">' + studentFeeEscapeHtml(row.studentId || '-') + '</span></td>' +
    '<td>' + studentFeeEscapeHtml(row.bankName || '-') + '</td>' +
    '<td>' + studentFeeEscapeHtml(row.accountNumber || '-') + '</td>' +
    '<td>' + studentFeeDate(row.appliedAt) + '</td>' +
    '<td>' + studentFeeBadge(row.status) + '</td>' +
    '<td>' + refundStatus + '</td>' +
    '<td class="sf-actions-cell"><button type="button" class="ui-btn outline small" data-action="refund-detail" data-id="' + studentFeeEscapeHtml(row.id) + '">상세</button></td>' +
    '</tr>';
}

function renderSfRefundTable_(data) {
  sfRefundState.rowsById = {};
  sfRefundState.selected = {};
  updateSfRefundBulk_();
  var rows = data.items || [];
  var body = rows.length ? rows.map(sfRefundRow_).join('') : '<tr><td colspan="8" class="ui-empty">조건에 맞는 환불신청이 없습니다.</td></tr>';
  studentFeeGetElement('sf-refund-table').innerHTML = '<table class="ui-table"><thead><tr><th class="sf-checkbox-cell"></th><th>신청자</th><th>은행</th><th>계좌번호</th><th>신청일</th><th>신청상태</th><th>금전상태</th><th>관리</th></tr></thead><tbody>' + body + '</tbody></table>';
  studentFeeGetElement('sf-refund-count').textContent = (data.total || 0) + '건';
  studentFeeGetElement('sf-refund-pagination').innerHTML = studentFeePaginationHtml(data, 'refund-page');
}

function updateSfRefundBulk_() {
  var ids = Object.keys(sfRefundState.selected).filter(function (id) { return sfRefundState.selected[id]; });
  studentFeeGetElement('sf-refund-selected-count').textContent = ids.length;
  studentFeeGetElement('sf-refund-bulk').classList.toggle('show', ids.length > 0);
}

function selectedSfRefundIds_() {
  return Object.keys(sfRefundState.selected).filter(function (id) { return sfRefundState.selected[id]; });
}

function loadSfRefundList_() {
  var loading = studentFeeGetElement('sf-refund-loading');
  var error = studentFeeGetElement('sf-refund-error');
  loading.hidden = false;
  error.hidden = true;
  return studentFeeApi('api_getStudentFeeRefundRequests', {
    keyword: sfRefundState.keyword,
    status: sfRefundState.status,
    page: sfRefundState.page,
    pageSize: sfRefundState.pageSize
  }).then(function (data) {
    loading.hidden = true;
    renderSfRefundTable_(data || {});
  }).catch(function (failure) {
    loading.hidden = true;
    error.hidden = false;
    error.textContent = failure && failure.message ? failure.message : '환불신청 목록을 불러오지 못했습니다.';
    studentFeeHandleError(failure);
  });
}

function renderSfRefundDetail_(detail, calculation) {
  sfRefundState.currentDetail = detail;
  sfRefundState.currentCalculation = calculation;
  sfRefundState.currentRefund = detail.refund || null;
  var request = detail.request || {};
  var refund = detail.refund || null;
  studentFeeGetElement('sf-refund-detail-content').innerHTML =
    '<div class="sf-detail-grid">' +
      '<div class="sf-detail-box"><small>학번</small><strong>' + studentFeeEscapeHtml(request.studentId || '-') + '</strong></div>' +
      '<div class="sf-detail-box"><small>신청상태</small><strong>' + studentFeeBadge(request.status) + '</strong></div>' +
      '<div class="sf-detail-box"><small>은행</small><strong>' + studentFeeEscapeHtml(request.bankName || '-') + '</strong></div>' +
      '<div class="sf-detail-box"><small>계좌번호</small><strong>' + studentFeeEscapeHtml(request.accountNumber || '-') + '</strong></div>' +
      '<div class="sf-detail-box"><small>예금주</small><strong>' + studentFeeEscapeHtml(request.accountHolder || '-') + '</strong></div>' +
      '<div class="sf-detail-box"><small>대상 납부 ID</small><strong>' + studentFeeEscapeHtml(request.paymentId || '-') + '</strong></div>' +
      '<div class="sf-detail-box wide"><small>환불사유</small><strong>' + studentFeeEscapeHtml(request.reason || '-') + '</strong></div>' +
    '</div>' +
    '<div class="sf-evidence-grid">' +
      '<div class="sf-evidence"><small>학생카드 캡처 파일 ID</small>' + studentFeeEscapeHtml(request.studentCardFileId || '-') + '</div>' +
      '<div class="sf-evidence"><small>학적변동내역 파일 ID</small>' + studentFeeEscapeHtml(request.enrollmentChangeFileId || '-') + '</div>' +
      '<div class="sf-evidence"><small>기타 증빙 파일 ID</small>' + studentFeeEscapeHtml(request.otherEvidenceFileId || '-') + '</div>' +
    '</div>' +
    '<div class="sf-modal-amount"><span>납부금액 / 최대 환불 가능액</span><strong>' + studentFeeMoney(calculation.paymentAmount || 0) + ' / ' + studentFeeMoney(calculation.refundableAmount || 0) + '</strong></div>' +
    (refund ? '<div class="sf-detail-grid"><div class="sf-detail-box"><small>승인금액</small><strong>' + studentFeeMoney(refund.approvedAmount) + '</strong></div><div class="sf-detail-box"><small>금전상태</small><strong>' + studentFeeBadge(refund.moneyStatus) + '</strong></div></div>' : '');

  var actions = '<button type="button" class="ui-btn outline" data-action="close-refund-detail">닫기</button>';
  if (String(request.status || '') === '접수') {
    actions += '<button type="button" class="ui-btn danger" data-action="reject-refund" data-id="' + studentFeeEscapeHtml(request.id) + '">반려</button>';
    actions += '<button type="button" class="ui-btn" data-action="open-refund-approval" data-id="' + studentFeeEscapeHtml(request.id) + '">승인</button>';
  }
  if (refund && String(refund.moneyStatus || '') === '대기') {
    actions += '<button type="button" class="ui-btn success" data-action="open-refund-transfer">송금 확인</button>';
  }
  studentFeeGetElement('sf-refund-detail-actions').innerHTML = actions;
}

function openSfRefundDetail_(requestId) {
  studentFeeApi('api_getStudentFeeRefundRequest', { refundRequestId: requestId })
    .then(function (detail) {
      return studentFeeApi('api_calculateStudentFeeRefund', { paymentId: detail.request.paymentId })
        .then(function (calculation) {
          renderSfRefundDetail_(detail || {}, calculation || {});
          studentFeeOpenModal('sf-refund-detail-modal');
        });
    })
    .catch(function (error) { studentFeeHandleError(error); });
}

function openSfRefundApproval_(button) {
  var detail = sfRefundState.currentDetail;
  if (!detail || !detail.request) return;
  studentFeeRunBusy(button, function () {
    return studentFeeApi('api_calculateStudentFeeRefund', { paymentId: detail.request.paymentId }).then(function (calculation) {
      sfRefundState.currentCalculation = calculation;
      var maximum = Number(calculation.refundableAmount) || 0;
      studentFeeGetElement('sf-refund-maximum').textContent = studentFeeMoney(maximum);
      var form = studentFeeGetElement('sf-refund-approval-form');
      form.reset();
      form.elements.approvedAmount.value = maximum > 0 ? maximum : '';
      form.elements.approvedAmount.max = maximum;
      studentFeeOpenModal('sf-refund-approval-modal');
    });
  }).catch(function (error) { studentFeeHandleError(error); });
}

function submitSfRefundApproval_(event) {
  event.preventDefault();
  var detail = sfRefundState.currentDetail;
  var calculation = sfRefundState.currentCalculation || {};
  if (!detail || !detail.request) return;
  var form = event.target;
  var approvedAmount = Number(form.elements.approvedAmount.value);
  var maximum = Number(calculation.refundableAmount) || 0;
  if (!(approvedAmount > 0) || approvedAmount > maximum) {
    studentFeeShowToast('승인금액은 0원보다 크고 최대 환불 가능액 이하여야 합니다.', true);
    return;
  }
  if (!studentFeeConfirm(studentFeeMoney(approvedAmount) + '으로 환불 승인하시겠습니까?')) return;
  var button = studentFeeGetElement('sf-refund-approve-submit');
  studentFeeRunBusy(button, function () {
    return studentFeeApi('api_processStudentFeeRefundRequests', {
      ids: [detail.request.id],
      action: 'APPROVE',
      approvedAmount: approvedAmount,
      reason: form.elements.reason.value.trim()
    }).then(function () {
      studentFeeCloseModal('sf-refund-approval-modal');
      studentFeeCloseModal('sf-refund-detail-modal');
      studentFeeShowToast('환불신청을 승인했습니다.');
      return loadSfRefundList_();
    });
  }).catch(function (error) {
    studentFeeHandleError(error);
  });
}

function rejectSfRefund_(requestId, button) {
  if (!studentFeeConfirm('이 환불신청을 반려하시겠습니까?')) return;
  studentFeeRunBusy(button, function () {
    return studentFeeApi('api_processStudentFeeRefundRequests', {
      ids: [requestId],
      action: 'REJECT',
      reason: ''
    }).then(function () {
      studentFeeCloseModal('sf-refund-detail-modal');
      studentFeeShowToast('환불신청을 반려했습니다.');
      return loadSfRefundList_();
    });
  }).catch(function (error) { studentFeeHandleError(error); });
}

function bulkApproveSfRefunds_(button) {
  var ids = selectedSfRefundIds_();
  if (!ids.length) return;
  var rows = ids.map(function (id) { return sfRefundState.rowsById[id]; }).filter(Boolean);
  studentFeeRunBusy(button, function () {
    return Promise.all(rows.map(function (row) {
      return studentFeeApi('api_calculateStudentFeeRefund', { paymentId: row.paymentId });
    })).then(function (calculations) {
      var total = calculations.reduce(function (sum, item) { return sum + (Number(item.refundableAmount) || 0); }, 0);
      if (!studentFeeConfirm(ids.length + '건을 각 최대 환불 가능액으로 승인하시겠습니까? 예상 합계 ' + studentFeeMoney(total))) return null;
      return studentFeeApi('api_processStudentFeeRefundRequests', {
        ids: ids,
        action: 'APPROVE',
        reason: ''
      });
    }).then(function (result) {
      if (!result) return null;
      studentFeeShowToast(ids.length + '건을 승인했습니다.');
      return loadSfRefundList_();
    });
  }).catch(function (error) { studentFeeHandleError(error); });
}

function bulkRejectSfRefunds_(button) {
  var ids = selectedSfRefundIds_();
  if (!ids.length || !studentFeeConfirm(ids.length + '건을 반려하시겠습니까?')) return;
  studentFeeRunBusy(button, function () {
    return studentFeeApi('api_processStudentFeeRefundRequests', {
      ids: ids,
      action: 'REJECT',
      reason: ''
    }).then(function () {
      studentFeeShowToast(ids.length + '건을 반려했습니다.');
      return loadSfRefundList_();
    });
  }).catch(function (error) { studentFeeHandleError(error); });
}

function openSfRefundTransfer_() {
  if (!sfRefundState.currentRefund) return;
  var form = studentFeeGetElement('sf-refund-transfer-form');
  form.reset();
  form.elements.transferDate.value = sfRefundState.currentRefund.transferDate ? String(sfRefundState.currentRefund.transferDate).slice(0, 10) : '';
  form.elements.transferEvidenceId.value = sfRefundState.currentRefund.transferEvidenceId || '';
  studentFeeOpenModal('sf-refund-transfer-modal');
}

function confirmSfRefundTransfer_(result, button) {
  var refund = sfRefundState.currentRefund;
  if (!refund || ['DONE', 'FAILED'].indexOf(result) < 0) return;
  var form = studentFeeGetElement('sf-refund-transfer-form');
  var message = result === 'DONE' ? '송금 완료로 처리하시겠습니까?' : '송금 실패로 처리하시겠습니까?';
  if (!studentFeeConfirm(message)) return;
  studentFeeRunBusy(button, function () {
    return studentFeeApi('api_confirmStudentFeeRefund', {
      refundId: refund.id,
      result: result,
      transferDate: form.elements.transferDate.value,
      transferEvidenceId: form.elements.transferEvidenceId.value.trim(),
      reason: form.elements.reason.value.trim()
    }).then(function () {
      studentFeeCloseModal('sf-refund-transfer-modal');
      studentFeeCloseModal('sf-refund-detail-modal');
      studentFeeShowToast('송금 확인 상태를 변경했습니다.');
      return loadSfRefundList_();
    });
  }).catch(function (error) {
    studentFeeHandleError(error);
  });
}

studentFeeGetElement('sf-refund-search').addEventListener('submit', function (event) {
  event.preventDefault();
  sfRefundState.keyword = event.target.elements.keyword.value.trim();
  sfRefundState.status = event.target.elements.status.value;
  sfRefundState.page = 1;
  loadSfRefundList_();
});
studentFeeGetElement('sf-refund-reset').addEventListener('click', function () {
  sfRefundState.keyword = '';
  sfRefundState.status = '';
  sfRefundState.page = 1;
  studentFeeGetElement('sf-refund-search').reset();
  loadSfRefundList_();
});
studentFeeGetElement('sf-refund-approval-form').addEventListener('submit', submitSfRefundApproval_);
document.addEventListener('change', function (event) {
  if (!event.target.matches('[data-role="refund-select"]')) return;
  sfRefundState.selected[event.target.dataset.id] = event.target.checked;
  updateSfRefundBulk_();
});
document.addEventListener('click', function (event) {
  var button = event.target.closest('[data-action]');
  if (!button || button.disabled) return;
  var action = button.dataset.action;
  if (action === 'refund-detail') openSfRefundDetail_(button.dataset.id);
  else if (action === 'close-refund-detail') studentFeeCloseModal('sf-refund-detail-modal');
  else if (action === 'open-refund-approval') openSfRefundApproval_(button);
  else if (action === 'close-refund-approval') studentFeeCloseModal('sf-refund-approval-modal');
  else if (action === 'reject-refund') rejectSfRefund_(button.dataset.id, button);
  else if (action === 'bulk-approve-refund') bulkApproveSfRefunds_(button);
  else if (action === 'bulk-reject-refund') bulkRejectSfRefunds_(button);
  else if (action === 'open-refund-transfer') openSfRefundTransfer_();
  else if (action === 'close-refund-transfer') studentFeeCloseModal('sf-refund-transfer-modal');
  else if (action === 'confirm-refund-transfer') confirmSfRefundTransfer_(button.dataset.result, button);
  else if (action === 'refund-page') {
    sfRefundState.page = Number(button.dataset.page) || 1;
    loadSfRefundList_();
  }
});

loadSfRefundList_();
</script>
