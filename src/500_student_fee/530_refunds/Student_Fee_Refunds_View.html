<div class="sf-workspace">
  <section class="ui-page-head">
    <div>
      <small>학생회비관리 / 환불 관리</small>
      <h1>환불 관리</h1>
      <p class="ui-page-desc">환불신청을 검토하고 승인·반려 및 송금 확인을 처리합니다.</p>
    </div>
  </section>

  <section class="ui-card sf-table-card">
    <form id="sf-refund-search" class="ui-toolbar" style="padding:16px 16px 4px;">
      <div class="ui-field grow sf-search">
        <label for="sf-refund-keyword">학번·예금주·은행 검색</label>
        <input id="sf-refund-keyword" name="keyword" type="search" placeholder="검색어">
      </div>
      <div class="ui-field">
        <label for="sf-refund-status">신청 상태</label>
        <select id="sf-refund-status" name="status">
          <option value="">전체</option>
          <option value="접수">접수</option>
          <option value="승인">승인</option>
          <option value="반려">반려</option>
        </select>
      </div>
      <button type="button" class="ui-btn outline" id="sf-refund-reset">초기화</button>
      <button type="submit" class="ui-btn">검색</button>
      <span class="ui-count" id="sf-refund-count">0건</span>
    </form>

    <div id="sf-refund-bulk" class="ui-bulk-bar">
      <strong><span id="sf-refund-selected-count">0</span>건 선택</strong>
      <span class="spacer"></span>
      <button type="button" class="ui-btn success small" data-action="bulk-approve-refund">선택 승인</button>
      <button type="button" class="ui-btn danger small" data-action="bulk-reject-refund">선택 반려</button>
    </div>

    <div id="sf-refund-table" class="ui-table-wrap"></div>
    <div id="sf-refund-pagination" class="sf-table-footer"></div>
    <div id="sf-refund-loading" class="ui-loading">불러오는 중입니다.</div>
    <div id="sf-refund-error" class="sf-error-state" hidden></div>
  </section>

  <div id="sf-refund-detail-modal" class="ui-modal-overlay" hidden>
    <div class="ui-modal" role="dialog" aria-modal="true" aria-labelledby="sf-refund-detail-title">
      <h2 id="sf-refund-detail-title">환불신청 상세</h2>
      <p class="ui-modal-desc">신청 정보, 계좌, 증빙, 환불 가능액을 확인합니다.</p>
      <div id="sf-refund-detail-content"></div>
      <div class="ui-modal-actions" id="sf-refund-detail-actions"></div>
    </div>
  </div>

  <div id="sf-refund-approval-modal" class="ui-modal-overlay" hidden>
    <div class="ui-modal" role="dialog" aria-modal="true" aria-labelledby="sf-refund-approval-title">
      <h2 id="sf-refund-approval-title">환불 승인</h2>
      <p class="ui-modal-desc">서버에서 계산한 최대 환불 가능액을 넘을 수 없습니다.</p>
      <form id="sf-refund-approval-form">
        <div class="sf-modal-amount"><span>최대 환불 가능액</span><strong id="sf-refund-maximum">0원</strong></div>
        <div class="sf-modal-grid">
          <div class="ui-field wide">
            <label for="sf-refund-approved-amount">승인금액</label>
            <input id="sf-refund-approved-amount" name="approvedAmount" type="number" min="1" step="1" required>
          </div>
          <div class="ui-field wide">
            <label for="sf-refund-approval-reason">처리 메모</label>
            <textarea id="sf-refund-approval-reason" name="reason"></textarea>
          </div>
        </div>
        <div class="ui-modal-actions">
          <button type="button" class="ui-btn outline" data-action="close-refund-approval">취소</button>
          <button type="submit" class="ui-btn" id="sf-refund-approve-submit">승인</button>
        </div>
      </form>
    </div>
  </div>

  <div id="sf-refund-transfer-modal" class="ui-modal-overlay" hidden>
    <div class="ui-modal" role="dialog" aria-modal="true" aria-labelledby="sf-refund-transfer-title">
      <h2 id="sf-refund-transfer-title">송금 확인</h2>
      <p class="ui-modal-desc">송금일과 확인 자료를 입력합니다.</p>
      <form id="sf-refund-transfer-form">
        <div class="sf-modal-grid">
          <div class="ui-field">
            <label for="sf-refund-transfer-date">송금일</label>
            <input id="sf-refund-transfer-date" name="transferDate" type="date">
          </div>
          <div class="ui-field">
            <label for="sf-refund-transfer-file">송금확인자료 ID</label>
            <input id="sf-refund-transfer-file" name="transferEvidenceId" type="text">
          </div>
          <div class="ui-field wide">
            <label for="sf-refund-transfer-reason">처리 메모</label>
            <textarea id="sf-refund-transfer-reason" name="reason"></textarea>
          </div>
        </div>
        <div class="ui-modal-actions">
          <button type="button" class="ui-btn outline" data-action="close-refund-transfer">취소</button>
          <button type="button" class="ui-btn danger" data-action="confirm-refund-transfer" data-result="FAILED">실패</button>
          <button type="button" class="ui-btn" data-action="confirm-refund-transfer" data-result="DONE">완료</button>
        </div>
      </form>
    </div>
  </div>

  <div id="sf-toast" class="ui-toast" role="status" hidden></div>
</div>
