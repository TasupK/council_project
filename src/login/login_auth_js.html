<script>
// 1. 로그인 버튼 연결
$('loginButton').onclick = loginAndLoad;

// 2. 로그인 동작 흐름 - login_api.gs 참조
async function loginAndLoad() {
  var button = $('loginButton');
  button.disabled = true;
  button.textContent = 'Google 계정 확인 중...';
  $('loginAlert').classList.remove('show');

  try {
    var login = await callAuthApi('api_checkLogin');
    if (!login || !login.ok) {
      setLoginAlert((login && login.message) || '접근 권한이 없는 계정입니다.');
      return;
    }
    goToPage('settings');
  } catch (err) {
    setLoginAlert(err.message || String(err));
  } finally {
    button.disabled = false;
    button.textContent = 'Google 계정으로 로그인';
  }
}

// 3. 서버 API 호출
function callAuthApi(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      reject(new Error('Apps Script 웹앱에서만 실행할 수 있습니다.'));
      return;
    }
    google.script.run
      .withSuccessHandler(function (result) {
        resolve(parseApiResult(result));
      })
      .withFailureHandler(function (err) {
        reject(new Error(err && err.message ? err.message : String(err)));
      })
      [fn].apply(google.script.run, args);
  });
}

function parseApiResult(result) {
  if (typeof result === 'string') {
    try {
      return JSON.parse(result);
    } catch (e) {
      return result;
    }
  }
  return result;
}

// 4. 화면 이동 및 오류 표시
function goToPage(page) {
  var url = new URL(window.location.href);
  url.searchParams.set('page', page);
  window.top.location.href = url.toString();
}

function setLoginAlert(message) {
  var alert = $('loginAlert');
  alert.textContent = message;
  alert.classList.add('show');
}

// 5. DOM 조회
function $(id) {
  return document.getElementById(id);
}
</script>
