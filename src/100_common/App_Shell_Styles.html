<style>
  html,
  body {
    height: 100%;
  }

  body.app-mode {
    overflow: hidden;
  }

  .app {
    height: 100vh;
    min-height: 0;
    display: grid;
    grid-template-rows: var(--header-h) minmax(0, 1fr);
    overflow: hidden;
  }

  .header {
    grid-template-columns: 40px 208px minmax(280px, 640px) auto auto 168px;
  }

  .sidebar-toggle {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: var(--text-2);
    font-size: 20px;
    line-height: 1;
  }

  .sidebar-toggle:hover {
    background: var(--bg);
  }

  .sidebar-toggle:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  .body {
    min-height: 0;
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    overflow: hidden;
    transition: grid-template-columns 160ms ease;
  }

  .app.sidebar-hidden .body {
    grid-template-columns: 0 minmax(0, 1fr);
  }

  .sidebar {
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .app.sidebar-hidden .sidebar {
    visibility: hidden;
    pointer-events: none;
    border-right: 0;
    padding-left: 0;
    padding-right: 0;
  }

  .main {
    min-width: 0;
    min-height: 0;
    overflow: auto;
    display: flex;
    flex-direction: column;
  }

  .workspace {
    overflow: visible;
    flex: 1 0 auto;
  }

  @media (max-width: 1100px) {
    .header {
      grid-template-columns: 40px minmax(150px, 208px) minmax(180px, 1fr) auto auto 150px;
      gap: 10px;
      padding: 0 16px;
    }
  }
</style>
