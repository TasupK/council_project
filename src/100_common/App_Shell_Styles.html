<style>
  html,
  body {
    height: 100%;
  }

  body.app-mode {
    overflow: hidden;
  }

  .app {
    height: 100vh;
    min-height: 0;
    display: grid;
    grid-template-rows: var(--header-h) minmax(0, 1fr);
    overflow: hidden;
  }

  .header {
    position: relative;
    display: grid;
    grid-template-columns: 40px 208px minmax(280px, 640px) auto auto 168px;
    gap: 16px;
    align-items: center;
    padding: 0 24px;
    background: var(--ui-surface);
    border-bottom: 1px solid var(--ui-border);
  }

  .header .brand {
    font-size: 18px;
    font-weight: 700;
    color: var(--brand);
    white-space: nowrap;
  }

  .sidebar-toggle {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid transparent;
    border-radius: var(--ui-radius-sm);
    background: transparent;
    color: var(--ui-text);
    font-size: 20px;
    line-height: 1;
  }

  .sidebar-toggle:hover,
  .nav-item:hover,
  .nav-subitem:hover,
  .user-trigger:hover,
  .icon-btn:hover {
    background: #f8f9fb;
  }

  .sidebar-toggle:focus-visible,
  .nav-item:focus-visible,
  .nav-subitem:focus-visible,
  .user-trigger:focus-visible,
  .icon-btn:focus-visible,
  .term-select:focus-visible {
    outline: 2px solid var(--ui-primary);
    outline-offset: 2px;
  }

  .global-search {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 40px;
    max-width: 640px;
    padding: 0 12px;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border-strong);
    border-radius: var(--ui-radius-sm);
    color: var(--ui-muted);
  }

  .global-search input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ui-text);
  }

  .term-select,
  .icon-btn {
    height: 40px;
    border: 1px solid var(--ui-border-strong);
    background: var(--ui-surface);
    border-radius: var(--ui-radius-sm);
    color: var(--ui-text);
  }

  .term-select {
    min-width: 124px;
    padding: 0 12px;
  }

  .icon-btn {
    width: 48px;
    position: relative;
    display: grid;
    place-items: center;
    border-color: transparent;
    font-size: 0;
  }

  .dot {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ui-danger-fg);
  }

  .user-trigger {
    margin-left: auto;
    min-width: 0;
    border: 0;
    border-radius: var(--ui-radius-sm);
    background: var(--ui-surface);
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: left;
    color: var(--ui-text);
  }

  .user-avatar {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--ui-info-bg);
    color: var(--ui-info-fg);
    font-weight: 700;
    font-size: 18px;
  }

  .user-trigger strong {
    display: block;
    font-size: 14px;
  }

  .user-trigger small {
    display: block;
    margin-top: 2px;
    color: var(--ui-muted);
    font-size: 12px;
  }

  .pop {
    display: none;
    position: absolute;
    right: 23px;
    top: 58px;
    width: 320px;
    padding: 23px;
    z-index: 40;
    background: var(--ui-surface);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-md);
    box-shadow: 0 10px 26px rgba(16, 24, 40, 0.14);
  }

  .pop.open {
    display: block;
  }

  .pop-head {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .pop .user-avatar {
    width: 44px;
    height: 44px;
  }

  .pop-name {
    font-weight: 700;
    font-size: 16px;
  }

  .pop-email {
    margin-top: 6px;
    color: var(--ui-muted);
    font-size: 12px;
  }

  .online {
    margin-left: auto;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--ui-success-bg);
    color: var(--ui-success-fg);
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .pop hr {
    border: 0;
    border-top: 1px solid var(--ui-border);
    margin: 20px 0 15px;
  }

  .pop-menu {
    width: 100%;
    height: 52px;
    border: 0;
    border-radius: var(--ui-radius-sm);
    background: var(--ui-info-bg);
    color: var(--ui-text);
    text-align: left;
    padding: 0 12px;
    font-weight: 700;
  }

  .pop-menu b {
    display: inline-grid;
    place-items: center;
    width: 28px;
    height: 28px;
    margin-right: 12px;
    border-radius: var(--ui-radius-sm);
    background: #dee8ff;
    color: var(--ui-info-fg);
    font-size: 13px;
  }

  .pop-foot {
    margin: 17px 0 0;
    color: var(--ui-muted);
    font-size: 11px;
  }

  .body {
    min-height: 0;
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    overflow: hidden;
    transition: grid-template-columns 160ms ease;
  }

  .app.sidebar-hidden .body {
    grid-template-columns: 0 minmax(0, 1fr);
  }

  .sidebar {
    min-width: 0;
    min-height: 0;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--ui-surface);
    border-right: 1px solid var(--ui-border);
  }

  .app.sidebar-hidden .sidebar {
    visibility: hidden;
    pointer-events: none;
    border-right: 0;
    padding-left: 0;
    padding-right: 0;
  }

  .nav-item {
    width: 100%;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 16px;
    border: 0;
    border-radius: var(--ui-radius-md);
    background: transparent;
    color: var(--ui-text);
    font-size: 15px;
    font-weight: 500;
    text-align: left;
  }

  .nav-chevron {
    margin-left: auto;
    color: var(--ui-muted);
    font-size: 10px;
  }

  .nav-item.active {
    background: var(--ui-info-bg);
    color: var(--ui-info-fg);
    font-weight: 600;
    box-shadow: inset 3px 0 0 var(--ui-primary);
  }

  .nav-group {
    display: grid;
    gap: 4px;
  }

  .nav-group-toggle[aria-expanded="true"] .nav-chevron {
    transform: rotate(0deg);
  }

  .nav-submenu {
    display: grid;
    gap: 2px;
    margin: 0 0 4px 14px;
    padding-left: 10px;
    border-left: 1px solid var(--ui-border);
  }

  .nav-submenu[hidden] {
    display: none;
  }

  .nav-subitem {
    min-height: 34px;
    display: flex;
    align-items: center;
    padding: 6px 10px;
    border-radius: var(--ui-radius-sm);
    color: var(--ui-muted);
    font-size: 13px;
    font-weight: 500;
  }

  .nav-subitem:hover {
    color: var(--ui-text);
  }

  .nav-subitem.active {
    background: var(--ui-info-bg);
    color: var(--ui-info-fg);
    font-weight: 600;
  }

  .nav-spacer {
    flex: 1;
  }

  .nav-label {
    margin: 16px 0 4px 16px;
    color: var(--ui-muted);
    font-size: 12px;
    font-weight: 500;
  }

  .nav-divider {
    height: 1px;
    margin: 8px 0;
    background: var(--ui-border);
  }

  .main {
    min-width: 0;
    min-height: 0;
    overflow: auto;
    display: flex;
    flex-direction: column;
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    padding: 16px 32px 20px;
    background: var(--ui-surface);
    border-bottom: 1px solid var(--ui-border);
  }

  .crumb-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 24px;
    margin-bottom: 8px;
  }

  .back-btn {
    display: none;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ui-text);
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .back-btn.show {
    display: inline-flex;
  }

  .back-btn svg {
    width: 22px;
    height: 22px;
    display: block;
  }

  .page-header .crumb {
    margin: 0;
    color: var(--ui-muted);
    font-size: 12px;
    font-weight: 500;
  }

  .page-title {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
  }

  .workspace {
    padding: 24px 32px 32px;
    overflow: visible;
    flex: 1 0 auto;
  }

  @media (max-width: 1100px) {
    .header {
      grid-template-columns: 40px minmax(150px, 208px) minmax(180px, 1fr) auto auto 150px;
      gap: 10px;
      padding: 0 16px;
    }

    .body {
      grid-template-columns: 72px minmax(0, 1fr);
    }

    .nav-item span.label,
    .nav-label,
    .header .brand {
      display: none;
    }

    .nav-submenu {
      margin-left: 0;
      padding-left: 0;
      border-left: 0;
    }

    .nav-subitem {
      justify-content: center;
      padding: 6px 2px;
      font-size: 10px;
      text-align: center;
    }

    .app.sidebar-hidden .body {
      grid-template-columns: 0 minmax(0, 1fr);
    }
  }
</style>
