  <style>
    :root {
      --bg: #f2f4f8;
      --surface: #ffffff;
      --border: #dde1e6;
      --border-strong: #c1c7cd;
      --text: #121619;
      --text-2: #21272a;
      --text-3: #697077;
      --text-4: #4d5358;
      --brand: #001d6c;
      --primary: #0f62fe;
      --blue: var(--primary);
      --primary-hover: #0353e9;
      --active-bg: #e5f2ff;
      --active-text: #257ad8;
      --danger: #da1e28;
      --warn-bg: #fcf4d6;
      --warn-border: #f1c21b;
      --changed-bg: #edf5ff;
      --new-bg: #defbe6;
      --green: #24a148;
      --sidebar-w: 248px;
      --header-h: 64px;
      --status-h: 32px;
      --radius: 8px;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;

      /* Shared UI tokens: Student Fee-derived visual language */
      --ui-bg: #f5f6f8;
      --ui-surface: #ffffff;
      --ui-border: #e5e7eb;
      --ui-border-strong: #d1d5db;
      --ui-text: #1f2430;
      --ui-muted: #6b7280;
      --ui-primary: #2f3b52;
      --ui-primary-hover: #3f4d6b;
      --ui-info-bg: #eaf1fd;
      --ui-info-fg: #1d4ed8;
      --ui-success-bg: #e7f7ee;
      --ui-success-fg: #17803d;
      --ui-warning-bg: #fff6e0;
      --ui-warning-fg: #92650a;
      --ui-danger-bg: #fdecec;
      --ui-danger-fg: #c22b2b;
      --ui-neutral-bg: #eef0f3;
      --ui-neutral-fg: #5b6472;
      --ui-radius-sm: 6px;
      --ui-radius-md: 8px;
      --ui-radius-lg: 10px;
      --ui-shadow: 0 2px 8px rgba(20, 24, 32, 0.06);
      --ui-space-1: 4px;
      --ui-space-2: 8px;
      --ui-space-3: 12px;
      --ui-space-4: 16px;
      --ui-space-5: 20px;
      --ui-space-6: 24px;
      --ui-space-8: 32px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: var(--header-h) 1fr var(--status-h);
    }

    /* Header */
    .header {
      display: grid;
      grid-template-columns: 208px minmax(280px, 640px) auto auto 168px;
      gap: 16px;
      align-items: center;
      padding: 0 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-size: 18px;
      font-weight: 700;
      color: var(--brand);
      white-space: nowrap;
    }
    .global-search {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 40px;
      max-width: 640px;
      padding: 0 12px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      color: var(--text-3);
    }
    .global-search input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text-2);
    }
    .term-select, .icon-btn {
      height: 40px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      border-radius: 4px;
      color: var(--text-2);
    }
    .term-select { padding: 0 12px; min-width: 124px; }
    .icon-btn {
      width: 48px;
      position: relative;
      display: grid;
      place-items: center;
      border-color: transparent;
      font-size: 0;
    }
    .dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .user-card {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 140px;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg);
      display: grid;
      place-items: center;
      color: var(--text-3);
      font-size: 0;
    }
    .avatar::after {
      content: "";
      width: 14px;
      height: 14px;
      border: 2px solid var(--text-3);
      border-radius: 50%;
      box-shadow: 0 10px 0 -3px var(--bg), 0 10px 0 -1px var(--text-3);
    }
    .user-card strong { display: block; font-size: 14px; font-weight: 500; }
    .user-card span { display: block; font-size: 12px; color: var(--text-3); }

    /* Body */
    .body {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 0;
    }
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-2);
      font-weight: 500;
      font-size: 15px;
      text-align: left;
      width: 100%;
      justify-content: space-between;
    }
    .nav-chevron { margin-left: auto; color: var(--text-3); font-size: 10px; }
    .nav-item:hover { background: #f8f9fb; }
    .nav-item.active {
      background: var(--active-bg);
      color: var(--active-text);
      font-weight: 600;
      box-shadow: inset 3px 0 0 var(--primary);
    }
    .nav-group { display: grid; gap: 4px; }
    .nav-group-toggle[aria-expanded="true"] .nav-chevron { transform: rotate(0deg); }
    .nav-submenu {
      display: grid;
      gap: 2px;
      margin: 0 0 4px 14px;
      padding-left: 10px;
      border-left: 1px solid var(--ui-border);
    }
    .nav-submenu[hidden] { display: none; }
    .nav-subitem {
      min-height: 34px;
      display: flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: var(--ui-radius-sm);
      color: var(--text-3);
      font-size: 13px;
      font-weight: 500;
    }
    .nav-subitem:hover { background: #f8f9fb; color: var(--text-2); }
    .nav-subitem.active { background: var(--ui-info-bg); color: var(--ui-info-fg); font-weight: 600; }
    .nav-spacer { flex: 1; }
    .nav-label {
      margin: 16px 0 4px 16px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-4);
    }
    .nav-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 0;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .page-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }
    .crumb-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      min-height: 24px;
    }
    .back-btn {
      display: none;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #121619;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .back-btn.show { display: inline-flex; }
    .back-btn svg {
      width: 22px;
      height: 22px;
      display: block;
    }
    .crumb {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-3);
      margin: 0;
    }
    .page-title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }
    .workspace {
      padding: 24px 32px 32px;
      overflow: auto;
      flex: 1;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      color: var(--text-3);
      font-size: 12px;
    }
    .status-bar a { color: var(--primary); font-weight: 500; }
    .db-card {
      margin-top: 24px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .db-card strong { display: block; margin-bottom: 4px; }
    .db-card p { margin: 0; color: var(--text-3); font-size: 13px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 40px;
      padding: 0 16px;
      border-radius: 4px;
      border: 1px solid transparent;
      font-weight: 500;
      white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--surface); color: var(--text-2); border-color: var(--border-strong); }
    .btn-ghost { background: transparent; color: var(--text-2); border-color: transparent; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-lg { height: 48px; padding: 0 20px; font-size: 16px; }

    .section-title {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-4);
    }
    .chevron { color: var(--text-3); }

    /* Filters / toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .field, .select, .search-field {
      height: 40px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: var(--surface);
      padding: 0 12px;
      color: var(--text-2);
    }
    .search-field { min-width: 240px; }
    .count-label {
      margin-left: auto;
      color: var(--text-3);
      font-size: 14px;
    }
    /* Table */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: auto;
    }
    table.data {
      width: 100%;
      border-collapse: collapse;
      min-width: 1180px;
    }
    table.data th, table.data td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }
    table.data th {
      background: #f8f9fb;
      color: var(--text-3);
      font-weight: 600;
      white-space: nowrap;
    }
    table.data tr:last-child td { border-bottom: 0; }
    .table-footer {
      display: flex;
      justify-content: space-between;
      padding: 12px 14px;
      color: var(--text-3);
      font-size: 13px;
      border-top: 1px solid var(--border);
      background: #fafbfc;
    }

    .loading {
      padding: 48px;
      text-align: center;
      color: var(--text-3);
    }
    .placeholder-page {
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: 4px;
      padding: 48px;
      color: var(--text-3);
    }
    .page-panel { display: none; }
    .page-panel.active { display: block; }
    .hidden { display: none !important; }
        /* 로그인 화면 */
    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--cool);
    }
    .login-box {
      width: min(390px, calc(100% - 32px));
      text-align: center;
    }
    .login h1 { font-size: 26px; color: #121619; margin: 0; }
    .login p { color: var(--muted); margin: 14px 0 28px; }
    .login button {
      width: 100%; height: 48px; border: 1px solid #c1c7cd;
      background: white; font-weight: 700; color: #121619;
    }
    .login button:disabled { opacity: 0.7; cursor: not-allowed; }
    .alert {
      display: none; margin-top: 14px; padding: 12px;
      border: 1px solid #f1c21b; background: #fff8e1;
      color: #8c610d; text-align: left;
    }
    .alert.show { display: block; }

    /* 전체 쉘 (상단, 좌측) */
    .shell { display: none; min-width: 1000px; }
    .shell.show { display: block; }

    /* 상단 헤더 */
    .top {
      height: 64px; display: flex; align-items: center;
      position: fixed; z-index: 3; inset: 0 0 auto;
      background: #fff; border-bottom: 1px solid var(--line);
      padding: 0 23px;
    }
    .brand { color: var(--navy); font-weight: 800; font-size: 18px; white-space: nowrap; }
    .search {
      height: 40px; width: clamp(360px, 45vw, 640px);
      margin-left: 166px; display: flex; align-items: center; gap: 9px;
      padding: 0 12px; border: 1px solid #c1c7cd;
      background: var(--cool); color: var(--muted);
    }
    .search-icon { font-size: 20px; }
    .term {
      height: 40px; width: 124px; margin-left: 60px; padding: 0 12px;
      border: 1px solid #c1c7cd; background: #fff;
      display: flex; align-items: center; justify-content: space-between;
    }
    .bell {
      width: 48px; height: 48px; border: 0; background: #fff;
      font-size: 21px; position: relative; margin-left: 24px;
    }
    .bell i {
      position: absolute; width: 8px; height: 8px;
      right: 8px; top: 8px; border-radius: 50%; background: #da1e28;
    }
    .user-trigger {
      margin-left: auto; border: 0; background: #fff;
      display: flex; align-items: center; gap: 8px; text-align: left;
    }
    .user-avatar {
      width: 40px; height: 40px; display: grid; place-items: center;
      border-radius: 50%; background: var(--cool);
      color: #295cdb; font-weight: 800; font-size: 18px;
    }
    .user-trigger strong { display: block; font-size: 14px; }
    .user-trigger small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }

    /* 팝업 모달 (프로필 모달) */
    .pop {
      display: none; position: absolute; right: 23px; top: 58px; width: 320px;
      background: #fff; border: 1px solid #dfe3ea; border-radius: 8px;
      box-shadow: 0 10px 26px rgba(16, 24, 40, 0.14); padding: 23px; z-index: 4;
    }
    .pop.open { display: block; }
    .pop-head { display: flex; align-items: center; gap: 16px; }
    .pop .user-avatar { width: 44px; height: 44px; background: #e3edff; }
    .pop-name { font-weight: 800; font-size: 16px; }
    .pop-email { font-size: 12px; color: #636e80; margin-top: 6px; }
    .online {
      margin-left: auto; padding: 5px 10px; border-radius: 12px;
      background: #e8f7ed; color: #21854d; font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .pop hr { border: 0; border-top: 1px solid #dfe3ea; margin: 20px 0 15px; }
    .pop-menu {
      width: 100%; height: 52px; border: 0; border-radius: 6px;
      background: #f0f5ff; color: #1c2430; text-align: left;
      padding: 0 12px; font-weight: 700;
    }
    .pop-menu + .pop-menu { margin-top: 8px; background: #fff0f2; color: #bf2e38; }
    .pop-menu b {
      display: inline-grid; place-items: center; width: 28px; height: 28px;
      margin-right: 12px; border-radius: 6px; background: #dee8ff;
      color: #295cdb; font-size: 13px;
    }
    .pop-menu.logout b { background: #ffe0e4; color: #bf2e38; }
    .pop-foot { margin: 17px 0 0; font-size: 11px; color: #636e80; }

    /* 좌측 사이드바 */
    .side {
      position: fixed; z-index: 2; top: 64px; bottom: 0; left: 0;
      width: var(--side); padding: 23px 15px; background: #fff;
      border-right: 1px solid var(--line);
    }
    .side button {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; height: 44px; border: 0; background: #fff;
      border-radius: 8px; padding: 0 16px; color: #212629;
      text-align: left; font-weight: 500; font-size: 15px;
    }
    .side button + button { margin-top: 8px; }
    .side .system {
      position: absolute; left: 15px; right: 15px; bottom: 124px;
      padding-top: 16px; border-top: 1px solid var(--line);
      color: #4d5459; font-size: 12px;
    }
    .side .setting { position: absolute; left: 15px; right: 15px; bottom: 64px; background: #f2f4f8; font-weight: 700; }

    /* 메인 컨텐츠 영역 */
    .page { margin: 64px 0 32px var(--side); min-height: calc(100vh - 96px); background: #f2f4f8; }
    .page-head {
      height: 112px; background: #fff; border-bottom: 1px solid var(--line);
      padding: 37px 31px; display: flex; flex-direction: column; justify-content: center;
    }
    .crumb { font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
    .page-head h1 { margin: 0; font-size: 24px; color: #121619; font-weight: 700; }


    .section { margin-top: 0; }
    .section + .section { margin-top: 24px; padding-top: 30px; border-top: 1px solid var(--line); }
    .section h2 { margin: 0; color: #121619; font-size: 20px; font-weight: 700; }
    .section > .desc { margin: 7px 0 16px; color: var(--muted); font-size: 13px; line-height: 1.5; }

    /* 내 정보 카드 */
    .profile-card {
      min-height: 192px; background: #fff; border: 1px solid var(--line);
      display: flex; align-items: flex-start; padding: 32px 32px 50px 32px; position: relative; border-radius: 4px;
      flex-wrap: wrap; gap: 20px;
    }
    .profile-avatar {
      width: 72px; height: 72px; border-radius: 50%;
      display: grid; place-items: center; background: #e8f2ff;
      color: var(--blue); font-size: 28px; font-weight: 800;
      flex-shrink: 0;
    }
    .profile-identity { margin: 3px 0 0 0; width: 180px; flex-shrink: 0; }
    .profile-identity b { font-size: 20px; font-weight: 700; display: block; word-break: keep-all; }
    .active { display: block; margin-top: 12px; color: var(--green); font-size: 13px; font-weight: 700; }
    
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 28px 40px; margin: 0; flex-grow: 1; width: 100%; min-width: 250px; }
    .facts dt { font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
    .facts dd { margin: 0; font-size: 14px; font-weight: 700; color: #121619; }
    .profile-note { position: absolute; bottom: 16px; left: 32px; color: var(--muted); font-size: 12px; margin: 0;}

    /* 역할 로우 */
    .role-row {
      height: 56px; display: flex; align-items: center;
      background: #fff; border: 1px solid var(--line); padding: 0 15px;
      border-radius: 4px;
    }
    .role-row + .role-row { margin-top: 8px; }
    .role-name { font-size: 15px; font-weight: 800; min-width: 184px; color: #121619; }
    .role-tag, .tag { padding: 7px 12px; background: var(--cool); border-radius: 4px; color: #4d5358; font-size: 12px; font-weight: 700; }
    .role-status { margin-left: 50px; color: var(--green); font-weight: 700; font-size: 13px; }
    .view { height: 40px; width: 120px; margin-left: auto; border: 1px solid #c1c7cd; background: #fff; color: var(--blue); font-weight: 700; border-radius: 4px; }

    /* 알림 테이블 */
    .notification-table { border: 1px solid var(--line); background: #fff; border-radius: 4px; }
    .n-head, .n-row { display: grid; grid-template-columns: minmax(150px, 2fr) minmax(180px, 3fr) 110px 110px 80px; align-items: center; gap: 8px; }
    .n-head { height: 48px; background: #dde1e6; font-weight: 700; font-size: 13px; color: #121619; }
    .n-head > * { padding-left: 16px; }
    .n-row { min-height: 72px; border-top: 1px solid var(--line); }
    .n-row.changed { background: #f0f6ff; }
    .n-row.failed { background: #fff1f1; }
    .n-row > * { padding-left: 16px; }
    .n-name { font-weight: 700; color: #121619; font-size: 14px; }
    .n-desc { font-size: 13px; color: var(--muted); }
    .locked { color: var(--green); font-size: 12px; font-weight: 700; }
    
    /* 토글 스위치 */
    .toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; border-radius: 12px; background: #c1c7cd; transition: .2s; }
    .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .2s; }
    .toggle input:checked + .slider { background: var(--green); }
    .toggle input:checked + .slider:before { transform: translateX(20px); }
    
    .changed-cell {
      height: 72px; display: flex; align-items: center; gap: 8px;
      border: 1px solid var(--blue); margin: -1px 0; padding-left: 15px !important;
      color: var(--blue); font-size: 11px; font-weight: 800; background: #e8f2ff;
    }
    .tag.optional { background: #e8f2ff; color: var(--blue); display: inline-block; padding: 7px 12px; }

    /* 하단 저장 바 (모달 내) */
    .bar {
      min-height: 48px; margin-top: 14px; padding: 4px 8px 4px 15px;
      display: flex; align-items: center; background: #fff8e1; border: 1px solid #f1c21b; border-radius: 4px;
    }
    .bar strong { font-size: 14px; color: #121619; }
    .bar button { height: 40px; border: 1px solid #c1c7cd; background: #fff; font-weight: 700; margin-left: 8px; padding: 0 16px; border-radius: 4px; color: #121619; }
    .bar .save { background: var(--blue); border-color: var(--blue); color: #fff; }
