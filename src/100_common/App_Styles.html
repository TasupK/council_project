  <style>
    :root {
      --bg: #f2f4f8;
      --surface: #ffffff;
      --border: #dde1e6;
      --border-strong: #c1c7cd;
      --text: #121619;
      --text-2: #21272a;
      --text-3: #697077;
      --text-4: #4d5358;
      --brand: #001d6c;
      --primary: #0f62fe;
      --primary-hover: #0353e9;
      --active-bg: #e5f2ff;
      --active-text: #257ad8;
      --danger: #da1e28;
      --warn-bg: #fcf4d6;
      --warn-border: #f1c21b;
      --changed-bg: #edf5ff;
      --new-bg: #defbe6;
      --green: #24a148;
      --sidebar-w: 248px;
      --header-h: 64px;
      --status-h: 32px;
      --radius: 8px;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;

      /* Shared UI tokens: Student Fee-derived visual language */
      --ui-bg: #f5f6f8;
      --ui-surface: #ffffff;
      --ui-border: #e5e7eb;
      --ui-border-strong: #d1d5db;
      --ui-text: #1f2430;
      --ui-muted: #6b7280;
      --ui-primary: #2f3b52;
      --ui-primary-hover: #3f4d6b;
      --ui-info-bg: #eaf1fd;
      --ui-info-fg: #1d4ed8;
      --ui-success-bg: #e7f7ee;
      --ui-success-fg: #17803d;
      --ui-warning-bg: #fff6e0;
      --ui-warning-fg: #92650a;
      --ui-danger-bg: #fdecec;
      --ui-danger-fg: #c22b2b;
      --ui-neutral-bg: #eef0f3;
      --ui-neutral-fg: #5b6472;
      --ui-radius-sm: 6px;
      --ui-radius-md: 8px;
      --ui-radius-lg: 10px;
      --ui-shadow: 0 2px 8px rgba(20, 24, 32, 0.06);
      --ui-space-1: 4px;
      --ui-space-2: 8px;
      --ui-space-3: 12px;
      --ui-space-4: 16px;
      --ui-space-5: 20px;
      --ui-space-6: 24px;
      --ui-space-8: 32px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: var(--header-h) 1fr var(--status-h);
    }

    /* Header */
    .header {
      display: grid;
      grid-template-columns: 208px minmax(280px, 640px) auto auto 168px;
      gap: 16px;
      align-items: center;
      padding: 0 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-size: 18px;
      font-weight: 700;
      color: var(--brand);
      white-space: nowrap;
    }
    .global-search {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 40px;
      max-width: 640px;
      padding: 0 12px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      color: var(--text-3);
    }
    .global-search input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text-2);
    }
    .term-select, .icon-btn {
      height: 40px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      border-radius: 4px;
      color: var(--text-2);
    }
    .term-select { padding: 0 12px; min-width: 124px; }
    .icon-btn {
      width: 48px;
      position: relative;
      display: grid;
      place-items: center;
      border-color: transparent;
      font-size: 0;
    }
    .dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .user-card {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 140px;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg);
      display: grid;
      place-items: center;
      color: var(--text-3);
      font-size: 0;
    }
    .avatar::after {
      content: "";
      width: 14px;
      height: 14px;
      border: 2px solid var(--text-3);
      border-radius: 50%;
      box-shadow: 0 10px 0 -3px var(--bg), 0 10px 0 -1px var(--text-3);
    }
    .user-card strong { display: block; font-size: 14px; font-weight: 500; }
    .user-card span { display: block; font-size: 12px; color: var(--text-3); }

    /* Body */
    .body {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 0;
    }
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-2);
      font-weight: 500;
      font-size: 15px;
      text-align: left;
      width: 100%;
      justify-content: space-between;
    }
    .nav-chevron { margin-left: auto; color: var(--text-3); font-size: 10px; }
    .nav-item:hover { background: #f8f9fb; }
    .nav-item.active {
      background: var(--active-bg);
      color: var(--active-text);
      font-weight: 600;
      box-shadow: inset 3px 0 0 var(--primary);
    }
    .nav-group { display: grid; gap: 4px; }
    .nav-group-toggle[aria-expanded="true"] .nav-chevron { transform: rotate(0deg); }
    .nav-submenu {
      display: grid;
      gap: 2px;
      margin: 0 0 4px 14px;
      padding-left: 10px;
      border-left: 1px solid var(--ui-border);
    }
    .nav-submenu[hidden] { display: none; }
    .nav-subitem {
      min-height: 34px;
      display: flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: var(--ui-radius-sm);
      color: var(--text-3);
      font-size: 13px;
      font-weight: 500;
    }
    .nav-subitem:hover { background: #f8f9fb; color: var(--text-2); }
    .nav-subitem.active { background: var(--ui-info-bg); color: var(--ui-info-fg); font-weight: 600; }
    .nav-spacer { flex: 1; }
    .nav-label {
      margin: 16px 0 4px 16px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-4);
    }
    .nav-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 0;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .page-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }
    .crumb-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      min-height: 24px;
    }
    .back-btn {
      display: none;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #121619;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .back-btn.show { display: inline-flex; }
    .back-btn svg {
      width: 22px;
      height: 22px;
      display: block;
    }
    .crumb {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-3);
      margin: 0;
    }
    .page-title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }
    .workspace {
      padding: 24px 32px 32px;
      overflow: auto;
      flex: 1;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      color: var(--text-3);
      font-size: 12px;
    }
    .status-bar a { color: var(--primary); font-weight: 500; }
    .db-card {
      margin-top: 24px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .db-card strong { display: block; margin-bottom: 4px; }
    .db-card p { margin: 0; color: var(--text-3); font-size: 13px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 40px;
      padding: 0 16px;
      border-radius: 4px;
      border: 1px solid transparent;
      font-weight: 500;
      white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--surface); color: var(--text-2); border-color: var(--border-strong); }
    .btn-ghost { background: transparent; color: var(--text-2); border-color: transparent; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-lg { height: 48px; padding: 0 20px; font-size: 16px; }

    /* Settings home */
    .section-title {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-4);
    }
    .settings-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .settings-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      padding: 0 20px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      text-align: left;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-2);
    }
    .settings-row:last-child { border-bottom: 0; }
    .settings-row:hover { background: #f8fafc; }
    .chevron { color: var(--text-3); }

    /* Filters / toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .field, .select, .search-field {
      height: 40px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: var(--surface);
      padding: 0 12px;
      color: var(--text-2);
    }
    .search-field { min-width: 240px; }
    .count-label {
      margin-left: auto;
      color: var(--text-3);
      font-size: 14px;
    }
    /* Table */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: auto;
    }
    table.data {
      width: 100%;
      border-collapse: collapse;
      min-width: 1180px;
    }
    table.data th, table.data td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }
    table.data th {
      background: #f8f9fb;
      color: var(--text-3);
      font-weight: 600;
      white-space: nowrap;
    }
    table.data tr:last-child td { border-bottom: 0; }
    .meta-sub { display: block; color: var(--text-3); font-size: 12px; margin-top: 2px; }
    .table-footer {
      display: flex;
      justify-content: space-between;
      padding: 12px 14px;
      color: var(--text-3);
      font-size: 13px;
      border-top: 1px solid var(--border);
      background: #fafbfc;
    }

    /* Permission page */
    .role-panel {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr 1.2fr auto;
      gap: 12px;
      align-items: end;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .role-panel label {
      display: block;
      font-size: 12px;
      color: var(--text-3);
      margin-bottom: 6px;
    }
    .role-panel .value {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-2);
    }
    .role-panel a.link { color: var(--primary); font-weight: 500; }
    .perm-table th, .perm-table td { text-align: center; }
    .perm-table th:first-child, .perm-table td:first-child { text-align: left; }
    .perm-group {
      font-weight: 600;
      background: #f8f9fb;
      cursor: pointer;
      user-select: none;
    }
    .perm-child td:first-child { padding-left: 36px; color: var(--text-2); }
    .na { color: var(--text-3); font-size: 12px; }
    .check {
      width: 18px; height: 18px;
      accent-color: var(--primary);
    }
    .check:disabled { opacity: 0.55; }

    .th-hint {
      display: block;
      font-weight: 400;
      font-size: 11px;
      color: var(--text-3);
    }
    .loading {
      padding: 48px;
      text-align: center;
      color: var(--text-3);
    }
    .placeholder-page {
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: 4px;
      padding: 48px;
      color: var(--text-3);
    }
    .page-panel { display: none; }
    .page-panel.active { display: block; }
    .hidden { display: none !important; }
    body.login-mode .app { display: none; }
    body.app-mode .login-screen { display: none; }
    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
    }
    .login-box {
      width: min(390px, 100%);
      text-align: center;
    }
    .login-box h1 {
      margin: 0;
      color: var(--text);
      font-size: 26px;
      font-weight: 700;
    }
    .login-box p {
      margin: 14px 0 28px;
      color: var(--text-3);
      line-height: 1.5;
    }
    .login-alert {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid var(--warn-border);
      background: var(--warn-bg);
      color: #8c610d;
      text-align: left;
      line-height: 1.5;
    }
    .login-alert.show { display: block; }
    .admin-note {
      margin: 0 0 16px;
      padding: 12px 16px;
      background: #edf5ff;
      border: 1px solid #a6c8ff;
      border-radius: 4px;
      color: var(--text-2);
      font-size: 13px;
    }
    .admin-note.preview {
      background: #fff8e1;
      border-color: #f1c21b;
    }
    .connect-card {
      margin-top: 16px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .connect-card label {
      display: block;
      font-size: 12px;
      color: var(--text-3);
      margin-bottom: 6px;
    }
    .connect-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .connect-row input {
      flex: 1;
      height: 40px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 0 12px;
    }
    .link { color: var(--primary); font-weight: 500; cursor: pointer; }

    /* Shared UI primitives */
    .ui-page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--ui-space-4);
      margin-bottom: var(--ui-space-4);
    }
    .ui-page-head small, .ui-page-desc { color: var(--ui-muted); font-size: 12px; }
    .ui-page-head h1 { margin: 2px 0 0; color: var(--ui-text); font-size: 21px; line-height: 1.35; }
    .ui-page-desc { margin: 4px 0 0; }
    .ui-page-actions {
      display: flex;
      align-items: center;
      gap: var(--ui-space-2);
      flex-wrap: wrap;
    }

    .ui-tabs {
      display: flex;
      align-items: center;
      gap: var(--ui-space-1);
      background: var(--ui-surface);
      border-bottom: 1px solid var(--ui-border);
    }
    .ui-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 var(--ui-space-4);
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--ui-muted);
      font-weight: 600;
      white-space: nowrap;
    }
    .ui-tab:hover { color: var(--ui-text); }
    .ui-tab.active { color: var(--ui-text); border-bottom-color: var(--ui-primary); }

    .ui-card {
      background: var(--ui-surface);
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius-lg);
      box-shadow: var(--ui-shadow);
      padding: var(--ui-space-4);
    }
    .ui-card + .ui-card { margin-top: var(--ui-space-3); }

    .ui-stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: var(--ui-space-3);
    }
    .ui-stat-card {
      display: block;
      min-height: 92px;
      padding: 14px 16px;
      border: 0;
      border-radius: var(--ui-radius-lg);
      background: var(--ui-neutral-bg);
      color: var(--ui-neutral-fg);
      text-align: left;
    }
    button.ui-stat-card { width: 100%; }
    .ui-stat-card span { display: block; font-size: 12px; opacity: .86; }
    .ui-stat-card strong { display: block; margin-top: 7px; font-size: 21px; line-height: 1.15; }
    .ui-stat-card.info { background: var(--ui-info-bg); color: var(--ui-info-fg); }
    .ui-stat-card.success { background: var(--ui-success-bg); color: var(--ui-success-fg); }
    .ui-stat-card.warning { background: var(--ui-warning-bg); color: var(--ui-warning-fg); }
    .ui-stat-card.danger { background: var(--ui-danger-bg); color: var(--ui-danger-fg); }

    .ui-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding: 7px 13px;
      border: 1px solid var(--ui-primary);
      border-radius: var(--ui-radius-md);
      background: var(--ui-primary);
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
    }
    .ui-btn:hover { background: var(--ui-primary-hover); border-color: var(--ui-primary-hover); }
    .ui-btn.primary { background: var(--ui-primary); border-color: var(--ui-primary); color: #fff; }
    .ui-btn.primary:hover { background: var(--ui-primary-hover); border-color: var(--ui-primary-hover); }
    .ui-btn.outline { background: #fff; color: var(--ui-primary); }
    .ui-btn.ghost { border-color: transparent; background: transparent; color: var(--ui-primary); }
    .ui-btn.success { border-color: var(--ui-success-fg); background: #fff; color: var(--ui-success-fg); }
    .ui-btn.danger { border-color: var(--ui-danger-fg); background: #fff; color: var(--ui-danger-fg); }
    .ui-btn.small { min-height: 30px; padding: 5px 9px; font-size: 11.5px; }
    .ui-btn:disabled { opacity: .48; cursor: not-allowed; }

    .ui-field { display: grid; gap: 5px; min-width: 0; }
    .ui-field label { color: var(--ui-muted); font-size: 12px; font-weight: 500; }
    .ui-field input, .ui-field select, .ui-field textarea,
    input.ui-control, select.ui-control, textarea.ui-control {
      width: 100%;
      min-height: 36px;
      padding: 7px 10px;
      border: 1px solid var(--ui-border-strong);
      border-radius: var(--ui-radius-md);
      background: #fff;
      color: var(--ui-text);
      outline: none;
    }
    .ui-field textarea, textarea.ui-control { min-height: 88px; resize: vertical; }
    .ui-field input:focus, .ui-field select:focus, .ui-field textarea:focus,
    .ui-control:focus { border-color: #8aa4da; box-shadow: 0 0 0 2px rgba(79, 109, 245, .12); }

    .ui-toolbar {
      display: flex;
      align-items: end;
      flex-wrap: wrap;
      gap: var(--ui-space-2);
      margin-bottom: var(--ui-space-3);
    }
    .ui-toolbar .ui-field { min-width: 150px; }
    .ui-toolbar .ui-field.grow { flex: 1; min-width: 220px; }
    .ui-toolbar .ui-count { margin-left: auto; color: var(--ui-muted); font-size: 12px; }
    .ui-table-wrap {
      overflow: auto;
      background: var(--ui-surface);
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius-lg);
    }
    table.ui-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.ui-table th, table.ui-table td { padding: 10px 9px; border-bottom: 1px solid var(--ui-border); text-align: left; vertical-align: middle; }
    table.ui-table th { background: #fafbfc; color: var(--ui-muted); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
    table.ui-table tbody tr:hover { background: #fafbfc; }
    table.ui-table tbody tr:last-child td { border-bottom: 0; }

    .ui-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--ui-neutral-bg);
      color: var(--ui-neutral-fg);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .ui-badge.success, .ui-badge-success { background: var(--ui-success-bg); color: var(--ui-success-fg); }
    .ui-badge.warning, .ui-badge-warning { background: var(--ui-warning-bg); color: var(--ui-warning-fg); }
    .ui-badge.danger, .ui-badge-danger { background: var(--ui-danger-bg); color: var(--ui-danger-fg); }
