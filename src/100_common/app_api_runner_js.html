<script>
var APP_API_ERROR_PREFIX_ = '__APP_ERROR__:';

function normalizeAppApiError_(error) {
  var message = error && error.message ? String(error.message) : '';
  var prefixIndex = message.indexOf(APP_API_ERROR_PREFIX_);
  if (prefixIndex >= 0) {
    try {
      var parsed = JSON.parse(message.slice(prefixIndex + APP_API_ERROR_PREFIX_.length));
      return {
        code: String(parsed && parsed.code || 'ERROR'),
        message: String(parsed && parsed.message || '서버 요청에 실패했습니다.'),
        details: parsed && parsed.details && typeof parsed.details === 'object' ? parsed.details : {}
      };
    } catch (parseError) {}
  }
  return {
    code: 'SERVER_ERROR',
    message: message || '서버 요청에 실패했습니다.',
    details: {}
  };
}

function runAppApi(apiName, request) {
  return new Promise(function (resolve, reject) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      reject({
        code: 'GAS_UNAVAILABLE',
        message: 'Google Apps Script 웹앱 환경에서 실행해주세요.',
        details: {}
      });
      return;
    }

    var runner = google.script.run
      .withSuccessHandler(function (response) {
        if (!response || response.ok !== true || !Object.prototype.hasOwnProperty.call(response, 'data')) {
          reject({
            code: 'INVALID_API_RESPONSE',
            message: '서버 응답 형식이 올바르지 않습니다.',
            details: {}
          });
          return;
        }
        resolve(response.data);
      })
      .withFailureHandler(function (error) {
        reject(normalizeAppApiError_(error));
      });

    runner[apiName]({ request: request || {} });
  });
}
</script>
