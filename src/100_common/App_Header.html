<header class="header">
  <button
    class="sidebar-toggle"
    id="appSidebarToggle"
    type="button"
    aria-controls="appSidebar"
    aria-expanded="true"
    aria-label="사이드바 숨기기"
  >
    <span aria-hidden="true">☰</span>
  </button>
  <div class="brand">학생회 통합 업무관리</div>
  <label class="global-search">
    <span aria-hidden="true">⌕</span>
    <input type="search" placeholder="업무·신청자·거래 검색" disabled>
  </label>
  <select class="term-select" id="appTerm" aria-label="학년도">
    <option>2026학년도</option>
  </select>
  <button class="icon-btn" type="button" aria-label="알림">
    알림<span class="dot"></span>
  </button>
  <a class="user-trigger" id="appUserCard" href="#">
    <div class="user-avatar" id="appAvatar" aria-hidden="true"></div>
    <div>
      <strong id="appUserName">운영자</strong>
      <small id="appUserTitle">사용자</small>
    </div>
  </a>
  
  <aside class="pop" id="profilePop">
    <div class="pop-head">
      <span class="user-avatar" id="popAvatar"></span>
      <div>
        <div class="pop-name" id="popName"></div>
        <div class="pop-email" id="popEmail"></div>
      </div>
      <span class="online">접속 중</span>
    </div>
    <hr>
    <button class="pop-menu" id="goMy"><b>M</b>마이페이지 <span style="float:right">›</span></button>
    <button class="pop-menu logout" id="logout"><b>O</b>로그아웃</button>
    <hr>
    <p class="pop-foot">로그인 계정 기준으로 정보와 권한이 표시됩니다.</p>
  </aside>
  
  <div class="toast" id="toast"></div>
</header>
