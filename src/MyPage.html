<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: 'Inter', 'Roboto', sans-serif;
      background-color: #f2f4f8;
      margin: 0;
      color: #121619;
      display: flex;
    }
    /* Sidebar */
    .sidebar {
      width: 248px;
      height: 100vh;
      background-color: #ffffff;
      border-right: 1px solid #dde1e6;
      padding-top: 64px; /* Header space */
      box-sizing: border-box;
      position: fixed;
    }
    .menu-item {
      padding: 12px 16px;
      margin: 8px 16px;
      border-radius: 8px;
      color: #212629;
      font-weight: 500;
      cursor: pointer;
    }
    .menu-item:hover {
      background-color: #f2f4f8;
    }
    .menu-item.active {
      font-weight: 600;
    }
    /* Main Content */
    .main-wrapper {
      margin-left: 248px;
      width: calc(100% - 248px);
    }
    /* Header */
    .header {
      height: 64px;
      background-color: #ffffff;
      border-bottom: 1px solid #dde1e6;
      display: flex;
      align-items: center;
      padding: 0 24px;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 10;
    }
    .header h1 {
      font-size: 18px;
      color: #001d6c;
      margin: 0;
    }
    /* Content Area */
    .content {
      margin-top: 64px;
      padding: 40px;
    }
    .page-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .card {
      background-color: #ffffff;
      border: 1px solid #dde1e6;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .card-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .card-desc {
      color: #697077;
      font-size: 13px;
      margin-bottom: 24px;
    }
    /* Profile Section */
    .profile-info {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .avatar {
      width: 72px;
      height: 72px;
      background-color: #e8f2ff;
      color: #0f62fe;
      border-radius: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 32px;
    }
    .info-item label {
      display: block;
      color: #697077;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .info-item span {
      color: #21272a;
      font-size: 14px;
      font-weight: 600;
    }
    .status-active {
      color: #10955e;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="menu-item">메인화면</div>
    <div class="menu-item">장부관리</div>
    <div class="menu-item">학생회비관리</div>
    <div class="menu-item">행사복지관리</div>
    <div class="menu-item active">마이페이지</div>
  </div>

  <div class="main-wrapper">
    <div class="header">
      <h1>학생회 통합 업무관리</h1>
    </div>

    <div class="content">
      <div class="page-title">마이페이지</div>

      <div class="card">
        <div class="card-title">내 정보</div>
        <div class="card-desc">Google 계정과 관리자 기준정보를 표시합니다.</div>
        
        <div class="profile-info">
          <div class="avatar" id="avatar-initial">운</div>
          <div>
            <div style="font-size: 20px; font-weight: bold;" id="user-name">운영자</div>
            <div class="status-active">● 활성 계정</div>
          </div>
          <div class="info-grid" style="margin-left: 40px;">
            <div class="info-item">
              <label>Google 계정</label>
              <span id="user-email">operator@example.ac.kr</span>
            </div>
            <div class="info-item">
              <label>직책</label>
              <span id="user-position">회계 담당자</span>
            </div>
            <div class="info-item">
              <label>소속·부서</label>
              <span id="user-department">학생회 사무국</span>
            </div>
            <div class="info-item">
              <label>권한</label>
              <span id="user-role">관리자</span>
            </div>
          </div>
        </div>
      </div>
      
    </div>
  </div>

  <script>
    // 페이지 로드 시 세션에 저장된 유저 정보를 가져와서 표시
    window.onload = function() {
      const userInfoStr = sessionStorage.getItem('userInfo');
      if (userInfoStr) {
        const user = JSON.parse(userInfoStr);
        document.getElementById('user-name').textContent = user.name;
        document.getElementById('user-email').textContent = user.email;
        document.getElementById('user-department').textContent = user.department;
        document.getElementById('user-position').textContent = user.position;
        document.getElementById('user-role').textContent = user.role;
        document.getElementById('avatar-initial').textContent = user.name.charAt(0);
      } else {
        // 정보가 없으면 다시 로그인 페이지로
        google.script.run
          .withSuccessHandler(function(url) {
            window.top.location.href = url + '?page=Login';
          })
          .getScriptUrl();
      }
    };
  </script>
</body>
</html>
