<div class="workspace">
  <section class="ui-page-head">
    <div>
      <small>장부관리 / 원장 관리</small>
      <h1>수입·지출 내역</h1>
      <p class="ui-page-desc">수입·지출을 검색·필터하고 등록·상세로 이동합니다.</p>
    </div>
    <div class="accounting-page-actions ui-page-actions">
      <a class="ui-btn outline" id="ledgerDbLink" target="_blank" rel="noopener">DB 시트 확인</a>
      <button class="ui-btn" id="openRegister" type="button"><span>＋</span><span>등록</span></button>
    </div>
  </section>

  <section class="accounting-summary-grid ui-stat-grid">
    <article class="ui-stat-card success"><span>이번 달 총 수입</span><strong id="sumIncome">₩0</strong></article>
    <article class="ui-stat-card danger"><span>이번 달 총 지출</span><strong id="sumExpense">₩0</strong></article>
    <article class="ui-stat-card warning"><span>승인 대기</span><strong id="sumPending">0건</strong></article>
    <article class="ui-stat-card info"><span>확인 요청</span><strong id="sumReview">0건</strong></article>
  </section>

  <section class="accounting-ledger-filters ui-toolbar">
    <div class="ui-field grow"><input class="ui-control" id="keyword" type="search" placeholder="거래처·적요 검색"></div>
    <div class="ui-field"><select class="ui-control"><option>날짜</option></select></div>
    <div class="ui-field"><select class="ui-control" id="type"><option value="전체">구분</option><option>수입</option><option>지출</option></select></div>
    <div class="ui-field"><select class="ui-control" id="department"><option value="전체">부서</option></select></div>
    <div class="ui-field"><select class="ui-control" id="event"><option value="전체">행사</option></select></div>
    <div class="ui-field"><select class="ui-control" id="status"><option value="전체">상태</option><option>미확인</option><option>정상</option><option>확인필요</option><option>임시저장</option></select></div>
  </section>

  <section class="accounting-ledger-table ui-table-wrap">
    <table class="ui-table">
      <colgroup>
        <col class="ledger-col-date">
        <col class="ledger-col-type">
        <col class="ledger-col-department">
        <col class="ledger-col-counterparty">
        <col class="ledger-col-income">
        <col class="ledger-col-expense">
        <col class="ledger-col-event">
        <col class="ledger-col-evidence">
        <col class="ledger-col-status">
        <col class="ledger-col-manager">
        <col class="ledger-col-action">
      </colgroup>
      <thead><tr><th>날짜</th><th>구분</th><th>부서</th><th>거래처</th><th>수입</th><th>지출</th><th>행사</th><th>증빙</th><th>상태</th><th>담당자</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="accounting-ledger-pagination ui-pagination" id="ledgerPagination">
      <button class="ui-page-btn" id="prevLedgerPage" type="button" aria-label="이전 페이지">‹</button>
      <span class="page-count" id="ledgerPageInfo">1 / 1</span>
      <button class="ui-page-btn" id="nextLedgerPage" type="button" aria-label="다음 페이지">›</button>
    </div>
  </section>
</div>

<div class="accounting-toast ui-toast" id="toast">처리되었습니다.</div>
