<script>
function fileToBankPayload(file) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onload = function () {
      const value = String(reader.result || '');
      resolve({ file_name: file.name, file_type: file.type || 'application/octet-stream', file_size: file.size, content_base64: value.includes(',') ? value.split(',')[1] : value });
    };
    reader.onerror = function () { reject(new Error(file.name + ' 파일을 읽을 수 없습니다.')); };
    reader.readAsDataURL(file);
  });
}

function reconcileType(bank) { return Number(bank && bank.amount || 0) < 0 ? '지출' : '수입'; }
function reconcileStatusClass(status) { return status === '정상' ? 'match-ok' : status === '원장누락' ? 'match-bad' : 'match-check'; }

function reconciliationLedgerBadgeClass(status) {
  if (status === '승인') return 'approved';
  if (status === '반려') return 'review';
  return 'pending';
}

function renderReconciliationDetail(detail) {
  state.reconciliationDetail = detail || { header: null, items: [] };
  const keyword = (document.getElementById('reconciliationSearch').value || '').toLowerCase();
  const status = document.getElementById('reconciliationStatus').value || '전체';
  const items = (state.reconciliationDetail.items || []).filter(function (item) {
    const searchable = [item.bank && item.bank.counterparty, item.bank && item.bank.description, item.ledger && item.ledger.counterparty, item.note].join(' ').toLowerCase();
    return (!keyword || searchable.includes(keyword)) && (status === '전체' || item.status === status);
  });
  document.getElementById('reconciliationSummary').textContent = '총 ' + items.length + '건 · 정상 ' + items.filter(function (x) { return x.status === '정상'; }).length + '건 · 확인 필요 ' + items.filter(function (x) { return x.status !== '정상'; }).length + '건';
  document.getElementById('reconciliationRows').innerHTML = items.length ? items.map(function (item) {
    const bank = item.bank || {};
    const ledger = item.ledger || {};
    const ledgerId = ledger.transaction_id || item.ledgerId || '';
    const action = ledgerId
      ? '<button class="small" data-action="detail" data-ledger-id="' + escapeHtml(ledgerId) + '">상세보기</button>'
      : item.status === '확인필요'
        ? '<button class="small" data-action="link" data-id="' + item.id + '">수동 연결</button>'
        : item.status === '원장누락'
          ? '<button class="small" data-action="create" data-id="' + item.id + '">장부 등록</button>'
          : '-';
    const counterparty = bank.counterparty || bank.description || '거래처 확인 필요';
    return '<tr><td>' + escapeHtml(String(bank.transactionAt || '').slice(0,10)) + '</td><td>' + reconcileType(bank) + '</td><td>' + escapeHtml(counterparty) + '</td><td>' + currency(bank.amount || 0) + '</td><td><span class="match-pill ' + reconcileStatusClass(item.status) + '">' + escapeHtml(item.status) + '</span></td><td>' + action + '</td></tr>';
  }).join('') : '<tr><td colspan="6" class="muted">대사 결과가 없습니다.</td></tr>';
}

function reconciliationEvidenceBase64ToBlob(contentBase64, mimeType) {
  const binary = window.atob(String(contentBase64 || ''));
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
  return new Blob([bytes], { type: mimeType || 'application/octet-stream' });
}

function isReconciliationImageEvidence(file) {
  const mimeType = String((file && (file.mime_type || file.file_type)) || '');
  return mimeType.indexOf('image/') === 0 || /\.(png|jpe?g|gif|webp|bmp)$/i.test(String(file && file.file_name || ''));
}

function clearReconciliationEvidencePreviews() {
  (state.reconciliationEvidencePreviewUrls || []).forEach(function (url) { URL.revokeObjectURL(url); });
  state.reconciliationEvidencePreviewUrls = [];
  state.reconciliationEvidenceRequest = Number(state.reconciliationEvidenceRequest || 0) + 1;
}

async function loadReconciliationEvidencePreview(file, index, requestId) {
  const target = document.getElementById('reconciliationEvidencePreview' + index);
  if (!target || !file.file_id || !isReconciliationImageEvidence(file)) return;
  try {
    const response = await accountingClient.getLedgerEvidenceFileContent({ evidence_id: file.evidence_id || '', file_id: file.file_id });
    if (!response || !response.content_base64) throw new Error('이미지 응답이 올바르지 않습니다.');
    if (requestId !== state.reconciliationEvidenceRequest) return;
    const objectUrl = URL.createObjectURL(reconciliationEvidenceBase64ToBlob(response.content_base64, response.mime_type));
    state.reconciliationEvidencePreviewUrls.push(objectUrl);
    const image = document.createElement('img');
    image.src = objectUrl; image.alt = file.file_name || '증빙자료 이미지';
    target.replaceChildren(image); target.classList.remove('evidence-preview-loading');
  } catch (error) { target.textContent = error && error.message ? error.message : '이미지를 불러오지 못했습니다.'; }
}

function renderReconciliationLedgerEvidence(item) {
  const files = item.evidence || [];
  clearReconciliationEvidencePreviews();
  const requestId = state.reconciliationEvidenceRequest;
  document.getElementById('reconciliationLedgerEvidenceList').innerHTML = files.length ? files.map(function (file, index) {
    const fileName = escapeHtml(file.file_name || '증빙자료');
    const download = file.file_id ? '<button class="small" data-action="download-evidence" data-evidence-id="' + escapeHtml(file.evidence_id || '') + '" data-file-id="' + escapeHtml(file.file_id) + '" data-file-name="' + fileName + '">다운로드</button>' : '';
    return isReconciliationImageEvidence(file)
      ? '<div class="evidence-preview"><div class="evidence-preview-loading" id="reconciliationEvidencePreview' + index + '">이미지 불러오는 중...</div><div class="evidence-preview-meta"><span class="evidence-name">' + fileName + '</span>' + download + '</div></div>'
      : '<div class="evidence-file"><span class="evidence-name">' + fileName + '</span>' + download + '</div>';
  }).join('') : '<div class="evidence-empty">첨부된 증빙자료가 없습니다.</div>';
  files.forEach(function (file, index) { loadReconciliationEvidencePreview(file, index, requestId); });
}

async function openReconciliationLedgerDetail(ledgerId) {
  try {
    const item = await accountingClient.getLedgerEntry({ id: ledgerId });
    if (!item) throw new Error('연결된 장부를 찾을 수 없습니다.');
    document.getElementById('reconciliationLedgerDetailTitle').textContent = (item.transaction_type || '') + ' 상세';
    const status = document.getElementById('reconciliationLedgerDetailStatus');
    status.className = 'badge ' + reconciliationLedgerBadgeClass(item.status);
    status.textContent = item.status || '승인대기';
    document.getElementById('reconciliationLedgerDetailRows').innerHTML = [
      ['거래일자', String(item.transaction_date || '').slice(0, 10)], ['구분', item.transaction_type || '-'],
      ['거래처/입금자명', item.counterparty || '-'], ['금액', currency(item.amount)],
      ['행사 연결', item.event_name || '해당없음'], ['적요', item.description || '-'],
      ['승인 상태', item.approval_status || '승인대기'], ['대조 상태', item.match_status || '미확인'],
      ['승인자', item.approved_by || '-'], ['승인일시', item.approved_at || '-'], ['담당자', item.manager || '-']
    ].map(function (row) { return '<div class="detail-row"><span class="detail-label">' + escapeHtml(row[0]) + '</span><span class="detail-value">' + escapeHtml(row[1]) + '</span></div>'; }).join('');
    renderReconciliationLedgerEvidence(item);
    document.getElementById('reconciliationLedgerDetailModal').classList.add('open');
  } catch (error) { toast(error && error.message ? error.message : '장부 상세를 불러오지 못했습니다.'); }
}

async function downloadReconciliationEvidence(button) {
  const response = await accountingClient.getLedgerEvidenceFileContent({ evidence_id: button.dataset.evidenceId || '', file_id: button.dataset.fileId || '' });
  if (!response || !response.content_base64) return toast('증빙 파일을 불러오지 못했습니다.');
  const objectUrl = URL.createObjectURL(reconciliationEvidenceBase64ToBlob(response.content_base64, response.mime_type));
  const link = document.createElement('a'); link.href = objectUrl; link.download = response.file_name || button.dataset.fileName || '증빙자료';
  document.body.appendChild(link); link.click(); link.remove(); window.setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 10000);
}

function showCurrentReconciliationRun(detail) {
  state.reconciliationRuns = detail && detail.header ? [detail.header] : [];
  const select = document.getElementById('reconciliationHistory');
  select.innerHTML = state.reconciliationRuns.length ? state.reconciliationRuns.map(function (row) {
    return '<option value="' + escapeHtml(row.id) + '">' + escapeHtml(String(row.auditStartDate || '').slice(0, 10) + ' ~ ' + String(row.auditEndDate || '').slice(0, 10) + ' · ' + row.status) + '</option>';
  }).join('') : '<option value="">현재 파일 대사 이력 없음</option>';
  renderReconciliationDetail(detail || null);
}

function resetCurrentReconciliation(files) {
  document.getElementById('reconciliationStartDate').value = '';
  document.getElementById('reconciliationEndDate').value = '';
  document.getElementById('reconciliationSearch').value = '';
  document.getElementById('reconciliationStatus').value = '전체';
  document.getElementById('ocrResultSummary').textContent = files && files.length
    ? '선택한 파일 ' + files.length + '개 · 누락 점검을 시작해 주세요.'
    : '점검 전';
  showCurrentReconciliationRun(null);
}

function extendImportDateRange(summary, result) {
  if (result.startDate && (!summary.startDate || result.startDate < summary.startDate)) summary.startDate = result.startDate;
  if (result.endDate && (!summary.endDate || result.endDate > summary.endDate)) summary.endDate = result.endDate;
}

async function runMissingCheck() {
  if (state.reconciliationImporting) return;
  const files = state.uploadFiles.reconciliation || [];
  if (!files.length) return toast('점검할 거래내역 파일을 선택해 주세요.');
  const checkButton = document.getElementById('runMissingCheck');
  const summaryElement = document.getElementById('ocrResultSummary');
  const originalLabel = checkButton.textContent;
  const summary = { extractedCount: 0, savedCount: 0, duplicateCount: 0, failedFileCount: 0, failedFiles: [], startDate: '', endDate: '', bankTransactionIds: [] };
  state.reconciliationImporting = true;
  checkButton.disabled = true;
  try {
    for (let index = 0; index < files.length; index += 1) {
      const file = files[index];
      checkButton.textContent = '파일 분석 ' + (index + 1) + '/' + files.length;
      summaryElement.textContent = file.name + ' 분석 중';
      try {
        const payload = await fileToBankPayload(file);
        const result = await accountingClient.processBankTransactionUpload({ files: [payload] });
        summary.extractedCount += Number(result.extractedCount || 0);
        summary.savedCount += Number(result.savedCount || 0);
        summary.duplicateCount += Number(result.duplicateCount || 0);
        summary.failedFileCount += Number(result.failedFileCount || 0);
        summary.failedFiles = summary.failedFiles.concat(result.failedFiles || []);
        summary.bankTransactionIds = summary.bankTransactionIds.concat((result.items || []).map(function (item) { return item.id; }).filter(Boolean));
        extendImportDateRange(summary, result);
      } catch (error) {
        summary.failedFileCount += 1;
        summary.failedFiles.push({ file_name: file.name, reason: error && error.message ? error.message : '파일 분석에 실패했습니다.' });
      }
    }
    summary.bankTransactionIds = Array.from(new Set(summary.bankTransactionIds));
    if (!summary.extractedCount || !summary.startDate || !summary.endDate || !summary.bankTransactionIds.length) {
      throw new Error(summary.failedFiles[0] && summary.failedFiles[0].reason ? summary.failedFiles[0].reason : '점검할 거래를 찾지 못했습니다.');
    }
    document.getElementById('reconciliationStartDate').value = summary.startDate;
    document.getElementById('reconciliationEndDate').value = summary.endDate;
    checkButton.textContent = '장부 대조 중';
    summaryElement.textContent = summary.startDate + ' ~ ' + summary.endDate + ' 승인 장부 대조 중';
    const detail = await accountingClient.processReconciliation({ startDate: summary.startDate, endDate: summary.endDate, bankTransactionIds: summary.bankTransactionIds });
    showCurrentReconciliationRun(detail);
    summaryElement.textContent = '점검 기간 ' + summary.startDate + ' ~ ' + summary.endDate + ' · 추출 ' + summary.extractedCount + '건 · 신규 ' + summary.savedCount + '건 · 중복 ' + summary.duplicateCount + '건 · 실패 ' + summary.failedFileCount + '개';
    summaryElement.title = summary.failedFiles.map(function (item) { return (item.file_name || '파일') + ': ' + (item.reason || '분석 실패'); }).join('\n');
    toast(summary.failedFileCount ? '일부 파일을 제외하고 누락 점검을 완료했습니다.' : '누락 점검을 완료했습니다.');
  } catch (error) {
    showCurrentReconciliationRun(null);
    summaryElement.textContent = error && error.message ? error.message : '누락 점검에 실패했습니다.';
    toast(summaryElement.textContent);
  } finally {
    state.reconciliationImporting = false;
    checkButton.disabled = false;
    checkButton.textContent = originalLabel;
  }
}

async function manuallyLink(itemId) {
  try {
    const result = await accountingClient.getReconciliationCandidates({ reconciliationItemId: itemId });
    const candidates = (result && result.items) || [];
    if (!candidates.length) return toast('연결할 수 있는 원장 후보가 없습니다.');
    const message = candidates.map(function (c, i) { return (i + 1) + '. ' + String(c.transactionAt || '').slice(0,10) + ' / ' + c.counterparty + ' / ' + currency(c.amount) + ' / ' + c.matchDetail; }).join('\n');
    const selected = Number(window.prompt('연결할 후보 번호를 입력하세요.\n' + message, '1')) - 1;
    if (selected < 0 || selected >= candidates.length) return;
    const detail = await accountingClient.applyReconciliationLink({ reconciliationItemId: itemId, ledgerId: candidates[selected].ledgerId });
    showCurrentReconciliationRun(detail); toast('수동 연결되었습니다.');
  } catch (error) { toast(error && error.message ? error.message : '수동 연결에 실패했습니다.'); }
}

async function createLedgerForItem(itemId) {
  if (!window.confirm('이 계좌 거래를 기준으로 새 원장을 만들까요?')) return;
  try {
    const detail = await accountingClient.createLedgerEntryFromReconciliation({ reconciliationItemId: itemId });
    showCurrentReconciliationRun(detail); toast('원장을 생성하고 연결했습니다.');
  } catch (error) { toast(error && error.message ? error.message : '원장 생성에 실패했습니다.'); }
}

setupAccountingPageLinks();
setupFileUpload({ key: 'reconciliation', zoneId: 'reconciliationDropzone', inputId: 'reconciliationFile', nameId: 'reconciliationFileName', multiple: true, onChange: resetCurrentReconciliation });
document.getElementById('runMissingCheck').addEventListener('click', runMissingCheck);
document.getElementById('reconciliationHistory').addEventListener('change', async function (event) { if (event.target.value) renderReconciliationDetail(await accountingClient.getReconciliation({ id: event.target.value })); });
['reconciliationSearch','reconciliationStatus'].forEach(function (id) { document.getElementById(id).addEventListener('input', function () { renderReconciliationDetail(state.reconciliationDetail); }); });
document.getElementById('resetReconciliationFilters').addEventListener('click', function () { document.getElementById('reconciliationSearch').value = ''; document.getElementById('reconciliationStatus').value = '전체'; renderReconciliationDetail(state.reconciliationDetail); });
document.getElementById('reconciliationRows').addEventListener('click', function (event) { const button = event.target.closest('[data-action]'); if (!button) return; if (button.dataset.action === 'detail') openReconciliationLedgerDetail(button.dataset.ledgerId); if (button.dataset.action === 'link') manuallyLink(button.dataset.id); if (button.dataset.action === 'create') createLedgerForItem(button.dataset.id); });
document.getElementById('reconciliationLedgerDetailModal').addEventListener('click', function (event) { const button = event.target.closest('[data-close],[data-action="download-evidence"]'); if (!button) return; if (button.dataset.close) { document.getElementById(button.dataset.close).classList.remove('open'); clearReconciliationEvidencePreviews(); } if (button.dataset.action === 'download-evidence') downloadReconciliationEvidence(button); });
resetCurrentReconciliation([]);
</script>
