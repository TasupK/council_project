<script>
(function () {
  var originalRenderBasicTab = renderBasicTab;
  var originalApplicantsToolbar = applicantsToolbar;
  function currentFormSync_() { return state.detail && state.detail.formSync ? state.detail.formSync : { configured: false, googleFormId: '', responseSheetId: '', status: '미연동', lastSyncedAt: '' }; }
  function formSyncStatusText_(sync) { if (!sync || !sync.configured) return '미연동'; return sync.status || '연동'; }
  function formSyncLastText_(sync) { return sync && sync.lastSyncedAt ? displayDate(sync.lastSyncedAt) : '없음'; }
  renderBasicTab = function (panel) {
    originalRenderBasicTab(panel);
    var sync = currentFormSync_(), integrationBar = panel.querySelector('.ew-integration-bar');
    if (integrationBar) integrationBar.innerHTML = integration('Google Forms 신청서', formSyncStatusText_(sync)) + integration('신청자 Google Sheets', sync.responseSheetId ? '연동' : '미연동') + integration('행사 증빙 Google Drive', '파일 필드 확인 필요') + integration('장부 데이터 연동', 'DB 확인 필요');
    panel.insertAdjacentHTML('beforeend', '<form id="ew-form-sync-form" class="ew-card ew-tab-toolbar ui-card ui-toolbar"><strong>Google Forms 응답 연동</strong><input class="ui-control" name="googleFormId" type="text" value="' + escapeHtml(sync.googleFormId || '') + '" placeholder="Google Form ID 또는 URL"><input class="ui-control" name="responseSheetId" type="text" value="' + escapeHtml(sync.responseSheetId || '') + '" placeholder="응답 Spreadsheet ID 또는 URL"><button class="ew-btn ew-btn-primary ew-btn-small ui-btn primary small" type="submit">↻ 응답 동기화</button><span class="ew-last-sync">마지막 동기화: ' + escapeHtml(formSyncLastText_(sync)) + '</span></form>');
  };
  applicantsToolbar = function () {
    var html = originalApplicantsToolbar(), sync = currentFormSync_();
    html = html.replace(/<strong>▣　Google Forms<\/strong><button[^>]*>↻<\/button>/, '<strong>▣　Google Forms</strong><button type="button" class="ew-btn ew-btn-small ui-btn outline small" data-action="sync-forms">↻ 응답 동기화</button>');
    return html.replace(/마지막 동기화: 확인 필요/, '마지막 동기화: ' + escapeHtml(formSyncLastText_(sync)));
  };
  function syncEventFormResponses_(payload) {
    return runEventBusy(function () { return eventClient.syncApplicantsFromForms({ id: state.currentEventId, payload: payload || {} }).then(function (result) { showToast('Forms 동기화: 신규 ' + Number(result.importedCount || 0) + '건 · 중복 ' + Number(result.duplicateCount || 0) + '건 · 오류행 ' + Number(result.invalidCount || 0) + '건'); return eventClient.getOverview({ id: state.currentEventId }); }); }).then(function (detail) { cacheEventDetailData_(detail); renderDetailShell(); renderActiveTab(); }).catch(handleError);
  }
  document.addEventListener('submit', function (event) { if (event.target.id !== 'ew-form-sync-form') return; event.preventDefault(); var form = event.target; syncEventFormResponses_({ googleFormId: form.elements.googleFormId.value, responseSheetId: form.elements.responseSheetId.value }); });
  document.addEventListener('click', function (event) { var button = event.target.closest('[data-action="sync-forms"]'); if (!button || button.disabled) return; syncEventFormResponses_({}); });
})();
</script>
