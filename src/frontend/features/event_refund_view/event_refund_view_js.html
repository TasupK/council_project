<script>
function loadRefunds(panel) {
  panel.innerHTML = '<div class="ew-card ew-tab-toolbar ui-card ui-toolbar"><strong>환불 대상</strong><span class="ew-spacer"></span><button type="button" class="ew-btn ew-btn-small ui-btn outline small" disabled title="환불 대상 선정 규칙 확인 필요">↻ 대상 동기화</button><button type="button" class="ew-btn ew-btn-outline ew-btn-small ui-btn outline small" disabled title="환불 계좌 필드 계약 확인 필요">환불 파일 내보내기</button></div><div id="ew-refund-table" class="ew-card ew-table-card ui-card"></div>';
  renderRefundTable(paginateCachedDetailItems_(getCachedDetailItems_('refunds'), state.refundPage, 10));
}
function renderRefundTable(data) {
  var target = document.getElementById('ew-refund-table'); if (!target) return;
  var body = (data.items || []).length ? data.items.map(function (item) { return '<tr><td>' + escapeHtml(item.name) + '</td><td>' + escapeHtml(item.studentId) + '</td><td>' + escapeHtml(item.bankName || '-') + '</td><td>' + escapeHtml(item.accountNumber || '-') + '</td><td>' + escapeHtml(item.accountHolder || '-') + '</td><td>' + money(item.refundAmount || 0) + '</td><td>' + displayDate(item.refundDate) + '</td><td>' + statusBadge(item.moneyStatus || '처리 대기') + '</td></tr>'; }).join('') : '<tr><td colspan="8" class="ew-table-empty ui-empty">환불 대상 데이터가 없습니다. Google Forms 응답 동기화 상태를 확인해주세요.</td></tr>';
  target.innerHTML = '<table class="ew-table ui-table"><thead><tr><th>이름</th><th>학번</th><th>은행</th><th>계좌번호</th><th>예금주</th><th>환불 금액</th><th>환불 처리일</th><th>상태</th></tr></thead><tbody>' + body + '</tbody></table>' + paginationHtml(data, 'refund-page');
}
</script>
