<script>
function optionHtml(values) {
  return values.map(function (item) {
    if (typeof item === 'string') return '<option value="' + escapeHtml(item) + '">' + escapeHtml(item) + '</option>';
    return '<option value="' + escapeHtml(item.value) + '">' + escapeHtml(item.label) + '</option>';
  }).join('');
}
function ledgerFilter() {
  return { keyword: document.getElementById('keyword').value.trim(), transaction_type: document.getElementById('type').value, event_id: document.getElementById('event').value, status: document.getElementById('status').value, date_from: document.getElementById('ledgerDateFrom').value, date_to: document.getElementById('ledgerDateTo').value };
}
function validateLedgerDateRange() {
  const from = document.getElementById('ledgerDateFrom');
  const to = document.getElementById('ledgerDateTo');
  const invalid = !!(from.value && to.value && from.value > to.value);
  to.setCustomValidity(invalid ? '종료일은 시작일과 같거나 이후여야 합니다.' : '');
  if (invalid) to.reportValidity();
}
function ledgerSearchText(item) {
  const date = String(item.transaction_date || '').slice(0, 10);
  return [item.counterparty, item.description, item.event_name, item.manager, date, date.replace(/\D/g, '')].join(' ').toLowerCase();
}
function filteredItems() {
  const f = ledgerFilter(); const keyword = f.keyword.toLowerCase();
  const keywordDigits = keyword.replace(/\D/g, '');
  return state.items.filter(function (item) {
    const haystack = ledgerSearchText(item);
    const date = String(item.transaction_date || '').slice(0, 10);
    const eventMatches = f.event_id === '전체' || (f.event_id === '미연결' ? !item.event_id : String(item.event_id || '') === f.event_id);
    return (!keyword || haystack.includes(keyword) || (keywordDigits && haystack.includes(keywordDigits))) && (f.transaction_type === '전체' || item.transaction_type === f.transaction_type) && eventMatches && (f.status === '전체' || item.approval_status === f.status) && (!f.date_from || date >= f.date_from) && (!f.date_to || date <= f.date_to);
  });
}
function badgeClass(status) { if (status === '승인') return 'success'; if (status === '반려') return 'danger'; return 'warning'; }
function renderLedgerSummary(summary) {
  summary = summary || {};
  document.getElementById('sumIncome').textContent = currency(summary.totalIncome || 0);
  document.getElementById('sumExpense').textContent = currency(summary.totalExpense || 0);
  document.getElementById('sumPending').textContent = (summary.pendingCount || 0) + '건';
  document.getElementById('sumBalance').textContent = currency(Number(summary.totalIncome || 0) - Number(summary.totalExpense || 0));
}
function renderPagination(totalItems, totalPages) {
  document.getElementById('ledgerPageInfo').textContent = state.ledgerPage + ' / ' + totalPages;
  document.getElementById('prevLedgerPage').disabled = state.ledgerPage <= 1;
  document.getElementById('nextLedgerPage').disabled = state.ledgerPage >= totalPages;
}
function render() {
  const items = filteredItems(); const totalPages = Math.max(1, Math.ceil(items.length / state.ledgerPageSize));
  state.ledgerPage = Math.min(Math.max(1, state.ledgerPage), totalPages);
  const start = (state.ledgerPage - 1) * state.ledgerPageSize; const pageItems = items.slice(start, start + state.ledgerPageSize);
  document.getElementById('rows').innerHTML = pageItems.length ? pageItems.map(function (item) {
    const income = item.transaction_type === '수입';
    return '<tr><td>' + escapeHtml(String(item.transaction_date || '').slice(0, 10)) + '</td><td class="' + (income ? 'income' : 'expense') + '">' + escapeHtml(item.transaction_type) + '</td><td>-</td><td>' + escapeHtml(item.counterparty || '') + '</td><td class="' + (income ? 'income' : 'muted') + '">' + (income ? won.format(item.amount || 0) : '-') + '</td><td class="' + (income ? 'muted' : 'expense') + '">' + (income ? '-' : won.format(item.amount || 0)) + '</td><td>' + escapeHtml(item.event_name || '해당없음') + '</td><td><strong>' + (item.has_evidence ? 'O' : 'X') + '</strong></td><td><span class="ui-badge ' + badgeClass(item.status) + '">' + escapeHtml(item.status || '') + '</span></td><td>' + escapeHtml(item.manager || '') + '</td><td><button class="ui-btn outline small" type="button" data-id="' + escapeHtml(item.transaction_id) + '">상세보기</button></td></tr>';
  }).join('') : '';
  renderPagination(items.length, totalPages);
}
function goLedgerPage(page) { state.ledgerPage = page; render(); }
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); if (id === 'detailModal') clearEvidencePreviewUrls(); }
function setType(type) {
  state.selectedType = type;
  document.getElementById('expenseBtn').className = type === '지출' ? 'segment expense-on' : 'segment';
  document.getElementById('incomeBtn').className = type === '수입' ? 'segment income-on' : 'segment';
}
function fillControls() {
  const selectedEvent = document.getElementById('event').value;
  const selectedFormEvent = document.getElementById('formEvent').value;
  const eventOptions = [{ value: '', label: '해당없음' }].concat(state.events.map(function (e) { return { value: e.event_id, label: e.event_name }; }));
  const filterOptions = [{ value: '전체', label: '행사: 전체' }, { value: '미연결', label: '행사 미연결' }].concat(state.events.map(function (e) { return { value: e.event_id, label: '행사: ' + e.event_name }; }));
  document.getElementById('event').innerHTML = optionHtml(filterOptions);
  document.getElementById('event').value = filterOptions.some(function (option) { return String(option.value) === selectedEvent; }) ? selectedEvent : '전체';
  document.getElementById('formEvent').innerHTML = optionHtml(eventOptions);
  document.getElementById('formEvent').value = eventOptions.some(function (option) { return String(option.value) === selectedFormEvent; }) ? selectedFormEvent : '';
  document.getElementById('department').innerHTML = '<option value="전체">부서 미사용</option>';
  document.getElementById('formDepartment').innerHTML = '<option value="">미사용</option>';
  updateBalance();
}
function updateBalance() {
  const eventId = document.getElementById('formEvent').value;
  const found = state.events.find(function (e) { return String(e.event_id) === String(eventId); });
  document.getElementById('eventBalance').textContent = '선택한 행사 잔액: ' + currency(found ? found.balance : 0);
}
async function refreshLedger() {
  const results = await Promise.all([ledgerClient.getLedgerEntries({}), ledgerClient.getLedgerSummary({}), ledgerClient.getLedgerEventOptions({})]);
  state.items = (results[0] && results[0].items) || []; state.events = results[2] || [];
  fillControls(); renderLedgerSummary(results[1] || {}); render();
}
async function updateDatabaseLink() {
  const link = document.getElementById('ledgerDbLink');
  try {
    const info = await ledgerClient.getLedgerDatabaseInfo();
    if (!info || !info.spreadsheetUrl) { link.removeAttribute('href'); link.textContent = 'DB 시트 확인 불가'; return; }
    link.href = info.spreadsheetUrl; link.textContent = 'DB 시트 확인 (' + info.transactionRowCount + '건)';
  } catch (error) { link.removeAttribute('href'); link.textContent = 'DB 시트 확인 불가'; }
}
</script>
