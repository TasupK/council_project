<script>
function evidenceBase64ToBlob(contentBase64, mimeType) {
  const binary = window.atob(String(contentBase64 || '')); const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
  return new Blob([bytes], { type: mimeType || 'application/octet-stream' });
}
function isImageEvidence(file) {
  const mimeType = String((file && (file.mime_type || file.file_type)) || ''); const fileName = String((file && file.file_name) || '');
  return mimeType.indexOf('image/') === 0 || /\.(png|jpe?g|gif|webp|bmp)$/i.test(fileName);
}
function clearEvidencePreviewUrls() {
  (state.evidencePreviewUrls || []).forEach(function (url) { URL.revokeObjectURL(url); });
  state.evidencePreviewUrls = []; state.evidencePreviewRequest = Number(state.evidencePreviewRequest || 0) + 1;
}
async function loadEvidencePreview(file, index, requestId) {
  const target = document.getElementById('evidencePreview' + index); if (!target || !file.file_id || !isImageEvidence(file)) return;
  try {
    const response = await ledgerClient.getLedgerEvidenceFileContent({ evidence_id: file.evidence_id || '', file_id: file.file_id || '' });
    if (!response || !response.content_base64) throw new Error('이미지 응답이 올바르지 않습니다.');
    if (requestId !== state.evidencePreviewRequest || !document.getElementById('evidencePreview' + index)) return;
    const mimeType = response.mime_type || 'application/octet-stream'; if (String(mimeType).indexOf('image/') !== 0) throw new Error('미리보기를 지원하지 않는 파일입니다.');
    const objectUrl = URL.createObjectURL(evidenceBase64ToBlob(response.content_base64, mimeType)); state.evidencePreviewUrls.push(objectUrl);
    const image = document.createElement('img'); image.src = objectUrl; image.alt = file.file_name || '증빙자료 이미지'; target.replaceChildren(image); target.classList.remove('evidence-preview-loading');
  } catch (error) { if (requestId !== state.evidencePreviewRequest) return; target.textContent = error && error.message ? error.message : '이미지를 불러오지 못했습니다.'; }
}
async function downloadEvidenceFile(button) {
  const originalLabel = button.textContent; button.disabled = true; button.textContent = '다운로드 중...';
  try {
    const response = await ledgerClient.getLedgerEvidenceFileContent({ evidence_id: button.dataset.evidenceId || '', file_id: button.dataset.fileId || '' });
    if (!response || !response.content_base64) throw new Error('증빙 파일 응답이 올바르지 않습니다.');
    const blob = evidenceBase64ToBlob(response.content_base64, response.mime_type); const objectUrl = URL.createObjectURL(blob); const link = document.createElement('a');
    link.href = objectUrl; link.download = response.file_name || button.dataset.fileName || '증빙자료'; link.style.display = 'none'; document.body.appendChild(link); link.click(); link.remove(); window.setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 10000);
  } catch (error) { toast(error && error.message ? error.message : '증빙 파일을 다운로드하지 못했습니다.'); }
  finally { button.disabled = false; button.textContent = originalLabel; }
}
function openDetail(id) {
  const item = state.items.find(function (entry) { return String(entry.transaction_id) === String(id); }); if (!item) return;
  state.selectedId = item.transaction_id; document.getElementById('detailTitle').textContent = item.transaction_type + ' 상세'; document.getElementById('detailStatus').className = 'ui-badge ' + badgeClass(item.status); document.getElementById('detailStatus').textContent = item.status;
  const approveButton = document.getElementById('approve'); approveButton.disabled = item.approval_status === '승인'; approveButton.textContent = item.approval_status === '승인' ? '승인 완료' : '승인'; document.getElementById('detailAlert').style.display = 'none';
  document.getElementById('detailRows').innerHTML = [['거래일자', String(item.transaction_date || '').slice(0, 10)], ['금액', currency(item.amount)], ['거래처/입금자명', item.counterparty || '-'], ['행사 연결', item.event_name || '해당없음'], ['적요', item.description || '-'], ['승인 상태', item.approval_status || '승인대기'], ['대조 상태', item.match_status || '미확인'], ['승인자', item.approved_by || '-'], ['승인일시', item.approved_at || '-'], ['담당자', item.manager || '-']].map(function (row) { return '<div class="detail-row"><span class="detail-label">' + escapeHtml(row[0]) + '</span><span class="detail-value">' + escapeHtml(row[1]) + '</span></div>'; }).join('');
  renderDetailEvidence(item); openModal('detailModal');
}
function renderDetailEvidence(item) {
  const files = item.evidence || []; clearEvidencePreviewUrls(); const requestId = state.evidencePreviewRequest;
  document.getElementById('detailEvidenceList').innerHTML = files.length ? files.map(function (file, index) {
    const fileName = escapeHtml(file.file_name || '증빙자료'); const downloadButton = file.file_id ? '<button class="ui-btn outline small" type="button" data-evidence-id="' + escapeHtml(file.evidence_id || '') + '" data-file-id="' + escapeHtml(file.file_id) + '" data-file-name="' + fileName + '">다운로드</button>' : '';
    if (file.file_id && isImageEvidence(file)) return '<div class="evidence-preview"><div class="evidence-preview-loading" id="evidencePreview' + index + '">이미지 불러오는 중...</div><div class="evidence-preview-meta"><span class="evidence-name">' + fileName + '</span>' + downloadButton + '</div></div>';
    return '<div class="evidence-file"><span class="evidence-name">' + fileName + '</span>' + downloadButton + '</div>';
  }).join('') : '<div class="evidence-empty">첨부된 증빙자료가 없습니다.</div>';
  files.forEach(function (file, index) { loadEvidencePreview(file, index, requestId); });
}
async function approve() {
  if (!state.selectedId) return; const button = document.getElementById('approve'); button.disabled = true; const label = button.textContent; button.textContent = '승인 중...';
  try { await ledgerClient.processLedgerEntry({ transaction_id: state.selectedId, action: 'approve' }); closeModal('detailModal'); await refreshLedger(); toast('승인되었습니다.'); }
  catch (error) { button.disabled = false; button.textContent = label; toast(error && error.message ? error.message : '승인 처리에 실패했습니다.'); }
}
async function deleteSelectedLedger() {
  if (!state.selectedId || !window.confirm('이 거래를 삭제 상태로 변경할까요?')) return;
  await ledgerClient.removeLedgerEntry({ transaction_id: state.selectedId }); closeModal('detailModal'); await refreshLedger(); toast('삭제 처리되었습니다.');
}
async function loadLedgerDetail(id) { return ledgerClient.getLedgerEntry({ id: id }); }
</script>
