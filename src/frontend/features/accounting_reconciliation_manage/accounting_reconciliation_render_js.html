<script>
function reconcileType(bank) { return Number(bank && bank.amount || 0) < 0 ? '지출' : '수입'; }
function reconcileStatusClass(status) { return status === '정상' ? 'success' : 'danger'; }
function reconciliationLedgerBadgeClass(status) { if (status === '승인') return 'success'; if (status === '반려') return 'danger'; return 'warning'; }
function renderReconciliationDetail(detail) {
  state.reconciliationDetail = detail || { header: null, items: [] };
  const keyword = document.getElementById('reconciliationSearch').value.toLowerCase();
  const status = document.getElementById('reconciliationStatus').value;
  const startDate = document.getElementById('reconciliationStartDate').value;
  const endDate = document.getElementById('reconciliationEndDate').value;
  const items = (state.reconciliationDetail.items || []).filter(function (item) {
    const bank = item.bank || {}; const date = String(bank.transactionAt || '').slice(0,10);
    const text = [bank.counterparty,bank.description,item.ledger && item.ledger.counterparty,item.note].join(' ').toLowerCase();
    return (!keyword || text.includes(keyword)) && (status === '전체' || item.workflowStatus === status) && (!startDate || date >= startDate) && (!endDate || date <= endDate);
  });
  document.getElementById('reconciliationSummary').textContent = '총 ' + items.length + '건 · 연결 완료 ' + items.filter(function (x) { return x.workflowStatus === '연결완료'; }).length + '건 · 원장 없음 ' + items.filter(function (x) { return x.workflowStatus === '원장없음'; }).length + '건 · 후보/확인 필요 ' + items.filter(function (x) { return x.workflowStatus === '연결후보' || x.workflowStatus === '확인필요'; }).length + '건';
  document.getElementById('reconciliationRows').innerHTML = items.length ? items.map(function (item) {
    const bank = item.bank || {}; const ledger = item.ledger || {}; const candidates = item.candidates || [];
    const eligible = item.workflowStatus === '원장없음' || candidates.length > 0;
    const labels = { 연결완료:'연결 완료', 연결후보:'연결 후보', 확인필요:'확인 필요', 원장없음:'원장 없음' };
    let action = '';
    if (item.ledgerId) action = '<button class="ui-btn outline small" data-action="detail" data-ledger-id="' + escapeHtml(item.ledgerId) + '">상세보기</button> <span>' + escapeHtml(ledger.approval_status || '') + '</span>';
    else if (candidates.length) {
      action = '<select class="ui-control reconciliation-candidate" data-candidate-id="' + escapeHtml(item.id) + '" aria-label="연결할 원장 선택">' + (candidates.length > 1 ? '<option value="">원장을 선택해 주세요</option>' : '') + candidates.map(function (candidate) { return '<option value="' + escapeHtml(candidate.ledgerId) + '">' + escapeHtml(String(candidate.transactionAt || '').slice(0,10) + ' · ' + candidate.counterparty + ' · ' + candidate.description + ' · ' + candidate.approvalStatus) + '</option>'; }).join('') + '</select><button class="ui-btn outline small" data-action="link" data-id="' + escapeHtml(item.id) + '">선택 원장 연결</button> <button class="ui-btn outline small" data-action="candidate-detail" data-id="' + escapeHtml(item.id) + '">후보 상세</button>';
    } else if (item.workflowStatus === '원장없음') action = '<button class="ui-btn outline small" data-action="create" data-id="' + escapeHtml(item.id) + '">원장 생성</button>';
    else action = escapeHtml(item.note || '원장 관리에서 기존 연결 거래를 확인해 주세요.');
    return '<tr><td>' + (eligible ? '<input type="checkbox" data-select-id="' + escapeHtml(item.id) + '" aria-label="거래 선택">' : '') + '</td><td>' + escapeHtml(String(bank.transactionAt || '').slice(0,10)) + '</td><td>' + reconcileType(bank) + '</td><td>' + escapeHtml(bank.counterparty || bank.description || '거래처 없음') + '</td><td>' + currency(Math.abs(Number(bank.amount || 0))) + '</td><td><span class="ui-badge ' + (item.workflowStatus === '연결완료' ? 'success' : 'warning') + '">' + escapeHtml(labels[item.workflowStatus] || item.workflowStatus) + '</span></td><td>' + action + '</td></tr>';
  }).join('') : '<tr><td colspan="7" class="muted">은행 거래내역을 가져오거나 조회 기간을 확인해 주세요.</td></tr>';
  document.getElementById('selectAllReconciliation').checked = false;
  document.getElementById('applySelectedReconciliation').disabled = !items.some(function (x) { return x.workflowStatus === '원장없음' || (x.candidates || []).length; });
}
function reconciliationEvidenceBase64ToBlob(contentBase64, mimeType) { const binary = window.atob(String(contentBase64 || '')); const bytes = new Uint8Array(binary.length); for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index); return new Blob([bytes], { type: mimeType || 'application/octet-stream' }); }
function isReconciliationImageEvidence(file) { const mimeType = String((file && (file.mime_type || file.file_type)) || ''); return mimeType.indexOf('image/') === 0 || /\.(png|jpe?g|gif|webp|bmp)$/i.test(String(file && file.file_name || '')); }
function clearReconciliationEvidencePreviews() { (state.reconciliationEvidencePreviewUrls || []).forEach(function (url) { URL.revokeObjectURL(url); }); state.reconciliationEvidencePreviewUrls = []; state.reconciliationEvidenceRequest = Number(state.reconciliationEvidenceRequest || 0) + 1; }
async function loadReconciliationEvidencePreview(file, index, requestId) {
  const target = document.getElementById('reconciliationEvidencePreview' + index); if (!target || !file.file_id || !isReconciliationImageEvidence(file)) return;
  try { const response = await getReconciliationLedgerEvidence({ evidence_id: file.evidence_id || '', file_id: file.file_id }); if (!response || !response.content_base64) throw new Error('이미지 응답이 올바르지 않습니다.'); if (requestId !== state.reconciliationEvidenceRequest) return; const objectUrl = URL.createObjectURL(reconciliationEvidenceBase64ToBlob(response.content_base64, response.mime_type)); state.reconciliationEvidencePreviewUrls.push(objectUrl); const image = document.createElement('img'); image.src = objectUrl; image.alt = file.file_name || '증빙자료 이미지'; target.replaceChildren(image); target.classList.remove('evidence-preview-loading'); } catch (error) { target.textContent = error && error.message ? error.message : '이미지를 불러오지 못했습니다.'; }
}
function renderReconciliationLedgerEvidence(item) { const files = item.evidence || []; clearReconciliationEvidencePreviews(); const requestId = state.reconciliationEvidenceRequest; document.getElementById('reconciliationLedgerEvidenceList').innerHTML = files.length ? files.map(function (file, index) { const fileName = escapeHtml(file.file_name || '증빙자료'); const download = file.file_id ? '<button class="ui-btn outline small" data-action="download-evidence" data-evidence-id="' + escapeHtml(file.evidence_id || '') + '" data-file-id="' + escapeHtml(file.file_id) + '" data-file-name="' + fileName + '">다운로드</button>' : ''; return isReconciliationImageEvidence(file) ? '<div class="evidence-preview"><div class="evidence-preview-loading" id="reconciliationEvidencePreview' + index + '">이미지 불러오는 중...</div><div class="evidence-preview-meta"><span class="evidence-name">' + fileName + '</span>' + download + '</div></div>' : '<div class="evidence-file"><span class="evidence-name">' + fileName + '</span>' + download + '</div>'; }).join('') : '<div class="evidence-empty">첨부된 증빙자료가 없습니다.</div>'; files.forEach(function (file, index) { loadReconciliationEvidencePreview(file, index, requestId); }); }
async function openReconciliationLedgerDetail(ledgerId) {
  try { const item = await getReconciliationLedgerEntry({ id: ledgerId }); if (!item) throw new Error('연결된 장부를 찾을 수 없습니다.'); state.reconciliationEditingItem = item; document.getElementById('editReconciliationLedger').hidden = item.approval_status === '승인'; document.getElementById('reconciliationLedgerDetailTitle').textContent = (item.transaction_type || '') + ' 상세'; const status = document.getElementById('reconciliationLedgerDetailStatus'); status.className = 'ui-badge ' + reconciliationLedgerBadgeClass(item.status); status.textContent = item.status || '승인대기'; document.getElementById('reconciliationLedgerDetailRows').innerHTML = [['거래일자', String(item.transaction_date || '').slice(0, 10)], ['구분', item.transaction_type || '-'], ['거래처/입금자명', item.counterparty || '-'], ['금액', currency(item.amount)], ['행사 연결', item.event_name || '해당없음'], ['적요', item.description || '-'], ['승인 상태', item.approval_status || '승인대기'], ['대조 상태', item.match_status || '미확인'], ['승인자', item.approved_by || '-'], ['승인일시', item.approved_at || '-'], ['담당자', item.manager || '-']].map(function (row) { return '<div class="detail-row"><span class="detail-label">' + escapeHtml(row[0]) + '</span><span class="detail-value">' + escapeHtml(row[1]) + '</span></div>'; }).join(''); renderReconciliationLedgerEvidence(item); document.getElementById('reconciliationLedgerDetailModal').classList.add('open'); } catch (error) { toast(error && error.message ? error.message : '장부 상세를 불러오지 못했습니다.'); }
}
async function downloadReconciliationEvidence(button) { const response = await getReconciliationLedgerEvidence({ evidence_id: button.dataset.evidenceId || '', file_id: button.dataset.fileId || '' }); if (!response || !response.content_base64) return toast('증빙 파일을 불러오지 못했습니다.'); const objectUrl = URL.createObjectURL(reconciliationEvidenceBase64ToBlob(response.content_base64, response.mime_type)); const link = document.createElement('a'); link.href = objectUrl; link.download = response.file_name || button.dataset.fileName || '증빙자료'; document.body.appendChild(link); link.click(); link.remove(); window.setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 10000); }
</script>
