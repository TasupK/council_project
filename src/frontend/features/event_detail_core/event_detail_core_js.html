<script>
function textWithBreaks(value) { return escapeHtml(value || '-').replace(/\r?\n/g, '<br>'); }
function cacheEventDetailData_(data) { state.detail = data || { event: {}, summary: {}, sections: {} }; state.detailSections = state.detail.sections || {}; }
function getCachedDetailItems_(sectionName) { var section = state.detailSections && state.detailSections[sectionName]; return section && Array.isArray(section.items) ? section.items : []; }
function paginateCachedDetailItems_(items, page, pageSize) {
  var safePageSize = Math.max(1, Number(pageSize) || 10), totalCount = items.length, totalPages = Math.max(1, Math.ceil(totalCount / safePageSize));
  var safePage = Math.min(Math.max(1, Number(page) || 1), totalPages), offset = (safePage - 1) * safePageSize;
  return { items: items.slice(offset, offset + safePageSize), page: safePage, pageSize: safePageSize, totalCount: totalCount, totalPages: totalPages };
}
function includesDetailKeyword_(values, keyword) { if (!keyword) return true; return (values || []).join(' ').toLowerCase().indexOf(String(keyword).toLowerCase()) >= 0; }
function selected(current, value) { return current === value ? 'selected' : ''; }
function renderDetailShell() { var detail = state.detail; populateEventDetail(detail.event, detail.summary || {}); }
function populateEventDetail(event, summary) {
  var status = document.getElementById('ew-detail-status');
  document.getElementById('ew-detail-name').textContent = event.name || '행사 정보';
  status.textContent = event.status || '확인 필요'; status.className = 'ew-status ' + statusClass(event.status) + ' ui-badge ' + sharedStatusClass(event.status);
  document.getElementById('ew-edit-event').dataset.id = event.id || '';
  document.getElementById('ew-detail-meta').innerHTML = [event.category, '담당자 ' + (event.managerEmail || '-'), '모집기간 ' + displayDate(event.applicationStartAt) + ' ~ ' + displayDate(event.applicationEndAt), '행사기간 ' + displayDate(event.eventStartAt) + ' ~ ' + displayDate(event.eventEndAt)].map(function (value) { return '<span>' + escapeHtml(value || '-') + '</span>'; }).join('');
  setEventKpi('ew-kpi-total', summary.totalApplicants, '명'); setEventKpi('ew-kpi-approved', summary.approvedApplicants, '명'); setEventKpi('ew-kpi-paid', summary.paidApplicants, '명'); setEventKpi('ew-kpi-attended', summary.actualAttendees, '명'); setEventKpi('ew-kpi-balance', summary.currentBalance, '원');
}
function setEventKpi(id, value, unit) { document.getElementById(id).textContent = value == null ? '확인 필요' : String(value) + unit; }
function renderActiveTab() {
  var panel = document.getElementById('ew-tab-panel'); if (!panel) return;
  document.querySelectorAll('.ew-tab').forEach(function (tab) { tab.classList.toggle('active', tab.dataset.tab === state.activeTab); });
  if (state.activeTab === 'basic') renderBasicTab(panel); else if (state.activeTab === 'applicants') loadApplicants(panel); else if (state.activeTab === 'attendance') loadAttendance(panel); else if (state.activeTab === 'ledger') renderPendingTab(panel, '결산/장부 연동 확인 필요', '행사 장부 DB 테이블과 장부관리 영역의 연동 키가 확정되지 않아 관련 기능은 비활성 상태입니다.'); else loadRefunds(panel);
}
function renderBasicTab(panel) {
  var event = state.detail.event;
  panel.innerHTML = '<section class="ew-card ew-info-card ui-card"><h3>행사 정보</h3><dl class="ew-info-list">' + info('행사명', event.name) + info('행사 유형', event.category) + info('담당 부서', event.department) + info('장소', event.location) + info('행사 목적', textWithBreaks(event.description), true) + info('담당자', event.managerEmail) + info('모집 기간', displayDate(event.applicationStartAt) + ' ~ ' + displayDate(event.applicationEndAt), true) + info('행사 기간', displayDate(event.eventStartAt) + ' ~ ' + displayDate(event.eventEndAt), true) + info('모집 정원', event.capacity + '명') + info('납부자 참가비', money(event.payerFee), true) + info('미납부자 참가비', money(event.nonPayerFee), true) + info('기타사항', textWithBreaks(event.note), true) + info('관련 자료', safeRelatedMaterialLink(event.evidenceFolderId) || '-', true) + '</dl></section>' + '<section class="ew-card ew-integration-bar ui-card">' + integration('Google Forms 신청서', '설정 확인 필요') + integration('신청자 Google Sheets', '설정 확인 필요') + integration('행사 증빙 Google Drive', '파일 필드 확인 필요') + integration('장부 데이터 연동', 'DB 확인 필요') + '<button type="button" class="ew-btn ui-btn outline" disabled title="Google Forms 연동 계약 확인 필요">↻　동기화</button></section>';
}
function info(label, value, alreadyHtml) { return '<dt>' + escapeHtml(label) + '</dt><dd>' + (alreadyHtml ? value : escapeHtml(value || '-')) + '</dd>'; }
function integration(label, status) { return '<div class="ew-integration"><strong>' + escapeHtml(label) + '</strong>' + statusBadge(status, '확인 필요') + '</div>'; }
function renderPendingTab(panel, title, message) { panel.innerHTML = '<section class="ew-card ew-pending-panel ui-card"><h3>' + escapeHtml(title) + '</h3><p>' + escapeHtml(message) + '</p></section>'; }
function hideApplicantModal_() { var modal = document.getElementById('ew-applicant-detail-modal'); if (modal) modal.hidden = true; }
function closeModal(event) { if (event && event.target.closest('[data-modal-stop]') && !event.target.closest('[data-action="close-modal"]')) return; hideApplicantModal_(); }
</script>
