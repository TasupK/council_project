<div id="ew-app" class="ew-app">
  <section class="ew-page-head ui-page-head"><div><small id="ew-form-breadcrumb">행사복지관리 / 행사 등록·수정</small><div class="ew-page-title-row"><button type="button" class="ew-back-btn ui-btn ghost" data-action="go-back" aria-label="이전 페이지로 이동" title="뒤로가기">←</button><h1 id="ew-form-title">행사 생성</h1></div><p>행사 기본정보를 입력하고 저장합니다.</p></div><div class="ew-page-actions ui-page-actions"><button type="button" class="ew-btn ui-btn outline" data-action="go-list">목록으로</button></div></section>
  <div class="ew-page-body">
    <form id="ew-event-form" class="ew-card ew-form-card ui-card">
      <div class="ew-form-row"><div class="ew-form-label">행사명 *</div><div class="ew-form-control ui-field"><input class="ui-control" name="name" required></div></div>
      <div class="ew-form-row"><div class="ew-form-label">유형 *</div><div class="ew-form-control ui-field"><select class="ui-control" name="category" required><option value="">유형 선택</option><option value="개강총회">개강총회</option><option value="MT">MT</option><option value="간식행사">간식행사</option><option value="사물함">사물함</option><option value="축제">축제</option><option value="기타">기타</option></select></div></div>
      <div class="ew-form-row"><div class="ew-form-label">담당 부서</div><div class="ew-form-control ui-field"><input class="ui-control" name="department" placeholder="담당 부서를 입력하세요."></div></div>
      <div class="ew-form-row"><div class="ew-form-label">행사 목적 *</div><div class="ew-form-control ui-field"><textarea class="ui-control" name="description" required placeholder="행사의 목적과 취지를 입력하세요."></textarea></div></div>
      <div class="ew-form-row"><div class="ew-form-label">모집 기간 *</div><div class="ew-form-control ui-field"><div class="ew-date-range"><input class="ui-control" name="applicationStartAt" type="date" required><span>~</span><input class="ui-control" name="applicationEndAt" type="date" required></div></div></div>
      <div class="ew-form-row"><div class="ew-form-label">행사 진행 일자 *</div><div class="ew-form-control ui-field"><div class="ew-date-range"><input class="ui-control" name="eventStartAt" type="date" required><span>~</span><input class="ui-control" name="eventEndAt" type="date" required></div></div></div>
      <div class="ew-form-row"><div class="ew-form-label">장소</div><div class="ew-form-control ui-field"><input class="ui-control" name="location" placeholder="행사 장소를 입력하세요."></div></div>
      <div class="ew-form-row"><div class="ew-form-label">정원 *</div><div class="ew-form-control ui-field"><input class="ui-control" name="capacity" type="number" min="0" required></div></div>
      <div class="ew-form-row"><div class="ew-form-label">담당자</div><div class="ew-form-control ui-field"><input class="ui-control" id="ew-manager-display" type="text" disabled aria-describedby="ew-manager-help"><div class="ew-form-help" id="ew-manager-help">현재 로그인 사용자가 담당자로 자동 지정됩니다.</div></div></div>
      <div class="ew-form-row"><div class="ew-form-label">관리 항목</div><div class="ew-form-control ui-field"><div class="ew-option-grid"><label class="ew-check-card"><input type="checkbox" name="applicationEnabled"><span>신청 관리</span></label><label class="ew-check-card"><input type="checkbox" name="feeEnabled"><span>참가비</span></label><label class="ew-check-card"><input type="checkbox" name="attendanceEnabled"><span>출석 관리</span></label><label class="ew-check-card"><input type="checkbox" name="balanceDistributionEnabled"><span>결산 잔액 분배</span></label></div><div class="ew-form-help">필요한 관리 항목을 여러 개 선택할 수 있습니다.</div></div></div>
      <div class="ew-form-row ew-fee-form-row" id="ew-fee-row" hidden><div class="ew-form-label ew-fee-main-label"><span>참가비 *</span><small>(*학생회비)</small></div><div class="ew-fee-options"><div class="ew-fee-option"><label for="ew-member-fee">납부자 *</label><div class="ew-money-input"><input class="ui-control" id="ew-member-fee" name="payerFee" type="number" min="0" value="0"><span>원</span></div></div><div class="ew-fee-option"><label for="ew-non-member-fee">미납부자 *</label><div class="ew-money-input"><input class="ui-control" id="ew-non-member-fee" name="nonPayerFee" type="number" min="0" value="0"><span>원</span></div></div></div></div>
      <div class="ew-form-row"><div class="ew-form-label">진행상태 *</div><div class="ew-form-control ui-field"><div class="ew-radio-group" id="ew-event-status-radios"><label class="ew-radio-pill"><input type="radio" name="status" value="예정" required><span>예정</span></label><label class="ew-radio-pill"><input type="radio" name="status" value="모집"><span>모집</span></label><label class="ew-radio-pill"><input type="radio" name="status" value="진행"><span>진행</span></label><label class="ew-radio-pill"><input type="radio" name="status" value="종료"><span>종료</span></label></div></div></div>
      <div class="ew-form-row"><div class="ew-form-label">관련자료</div><div class="ew-form-control ui-field"><div class="ew-file-upload-row"><label class="ew-btn ew-file-picker ui-btn outline" for="ew-related-material-file">파일 선택</label><input id="ew-related-material-file" type="file" hidden accept=".pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.zip"><span id="ew-related-material-name" class="ew-file-name">선택된 파일 없음</span></div><div class="ew-form-help">PDF, 문서, 이미지, ZIP 파일 · 최대 5MB</div><div id="ew-existing-material" class="ew-existing-file" hidden></div></div></div>
      <div class="ew-form-row"><div class="ew-form-label">기타사항</div><div class="ew-form-control ui-field"><textarea class="ui-control" name="note" placeholder="추가로 공유할 내용을 입력하세요."></textarea></div></div>
      <div class="ew-form-submit"><button class="ew-btn ew-btn-primary ui-btn primary" type="submit">저장</button></div>
    </form>
  </div>
  <div id="ew-loading" class="ew-loading ui-loading" hidden><span></span><p>불러오는 중입니다.</p></div><div id="ew-modal-root"></div><div id="ew-toast" class="ew-toast ui-toast" role="status" hidden></div>
</div>
