<div id="sf-payment-confirm-modal" class="ui-modal-overlay" hidden>
  <div class="ui-modal" role="dialog" aria-modal="true" aria-labelledby="sf-payment-confirm-title">
    <h2 id="sf-payment-confirm-title">입금 확인</h2>
    <p class="ui-modal-desc">실제 입금자명과 대사 결과를 입력합니다.</p>
    <form id="sf-payment-confirm-form">
      <div class="sf-modal-grid">
        <div class="ui-field wide">
          <label for="sf-payment-depositor">입금자명</label>
          <input id="sf-payment-depositor" name="depositorName" type="text">
        </div>
        <div class="ui-field wide">
          <label for="sf-payment-confirm-reason">처리 메모</label>
          <textarea id="sf-payment-confirm-reason" name="reason"></textarea>
        </div>
      </div>
      <div class="ui-modal-actions">
        <button type="button" class="ui-btn outline" data-action="close-payment-confirm">취소</button>
        <button type="button" class="ui-btn danger" data-action="confirm-payment" data-result="MISMATCH">불일치</button>
        <button type="button" class="ui-btn" data-action="confirm-payment" data-result="DONE">완료</button>
      </div>
    </form>
  </div>
</div>
