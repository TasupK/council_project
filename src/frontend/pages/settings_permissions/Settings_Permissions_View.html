<!--
  [Settings_Permissions_View] Figma 업무 권한 설정 UI
-->
<header class="page-header ui-page-head">
  <div>
    <p class="crumb">설정 / 사용자·권한 / 업무 권한 설정</p>
    <div class="settings-title-row">
      <a class="back-btn show settings-back-link" id="settingsBackLink" href="#" target="_top" aria-label="설정으로 돌아가기">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <h1 class="page-title">업무 권한 설정</h1>
    </div>
  </div>
</header>
<div class="workspace settings-figma">
  <div class="page-panel active" id="panel-loading"><div class="loading ui-loading">권한 불러오는 중…</div></div>
  <div class="page-panel" id="panel-content">
    <div class="settings-dirty-bar" id="permissionDirtyBar">
      <strong id="permissionDirtyLabel">0개 변경됨</strong>
      <div class="ui-page-actions">
        <button class="ui-btn outline" type="button" id="btnDiscardPermissions">변경사항 취소</button>
        <button class="ui-btn primary" type="button" id="btnSavePermissions">변경사항 저장 (0)</button>
      </div>
    </div>
    <div class="role-panel ui-card">
      <div class="ui-field"><label for="permissionRole">역할</label><select class="select ui-control" id="permissionRole" style="width: 100%"></select></div>
      <div><label>구분</label><div class="value" id="permissionRoleType">-</div></div>
      <div><label>상태</label><div class="value" id="permissionRoleStatus">-</div></div>
      <div><label>배정 사용자</label><div class="value"><a class="settings-link" href="#" id="permissionAssigned" target="_top">0명</a></div></div>
      <div><label>최근 저장</label><div class="value" id="permissionSaved">-</div></div>
      <div><a class="ui-btn outline" id="permissionRolesLink" href="#" target="_top">역할 관리</a></div>
    </div>
    <p class="count-label ui-count" id="permissionMutationStatus" aria-live="polite"></p>
    <div class="table-wrap ui-table-wrap">
      <table class="data perm-table ui-table">
        <thead><tr><th>화면·업무</th><th>메뉴 접근<span class="th-hint">(자동)</span></th><th>조회</th><th>등록 및 수정</th><th>승인 및 보관</th><th>다운로드</th></tr></thead>
        <tbody id="permissionTbody"></tbody>
      </table>
      <div class="table-footer"><span id="permissionTotal">총 0개 권한 대상</span><span id="permissionRoleName"></span></div>
    </div>
  </div>
</div>
<div class="settings-modal-backdrop" id="permissionSaveModal" role="dialog" aria-modal="true">
  <div class="settings-modal">
    <div class="settings-modal-head"><div><h2>권한 저장</h2><p id="permissionSaveModalSub">선택한 역할의 권한을 저장하시겠습니까?</p></div><button class="settings-modal-close" type="button" id="permissionSaveModalClose" aria-label="닫기">✕</button></div>
    <div class="settings-modal-body"><div class="summary-card is-changed"><div class="summary-card-top"><strong id="permissionSaveRoleName">-</strong><span class="summary-badge">권한 변경</span></div><div class="meta" id="permissionSaveMeta">변경된 권한을 UserDB 역할권한 시트에 반영합니다.</div></div></div>
    <div class="settings-modal-foot"><button class="ui-btn outline" type="button" id="permissionSaveModalCancel">취소</button><button class="ui-btn primary" type="button" id="permissionSaveModalConfirm"><span class="btn-ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h9.5L14 4.5V14H2V2zm2 1v4h7V3H4zm0 6v4h8V9H4z"/></svg></span>변경사항 저장</button></div>
  </div>
</div>
