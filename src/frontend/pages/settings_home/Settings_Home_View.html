<header class="page-header ui-page-head">
  <div>
    <p class="crumb">설정 / 설정 홈</p>
    <h1 class="page-title">설정</h1>
  </div>
</header>
<div class="workspace">
  <div class="page-panel active" id="panel-loading">
    <div class="loading ui-loading">데이터 불러오는 중…</div>
  </div>
  <div class="page-panel" id="panel-content">
    <p class="admin-note" id="adminNote">사용자·권한 설정 영역입니다.</p>
    <h2 class="section-title">사용자·권한</h2>
    <div class="settings-list ui-card">
      <a class="settings-row" id="departmentsLink" target="_top">부서 조직도 <span class="chevron">›</span></a>
      <a class="settings-row" id="usersLink" target="_top">사용자 관리 <span class="chevron">›</span></a>
      <a class="settings-row" id="rolesLink" target="_top">역할 관리 <span class="chevron">›</span></a>
      <a class="settings-row" id="permissionsLink" target="_top">업무 권한 설정 <span class="chevron">›</span></a>
    </div>
    <div class="connection-grid">
      <section class="connection-card ui-card" id="operationDbConnectionCard">
        <div class="connection-card__head">
          <strong>운영 데이터베이스</strong>
          <span class="connection-status" id="operationDbStatus">미연결</span>
        </div>
        <p class="connection-card__name" id="operationDbName">연결된 스프레드시트가 없습니다.</p>
        <p class="connection-card__meta" id="operationDbUpdatedAt"></p>
        <label for="operationDbUrlInput">Google Sheets URL</label>
        <input class="ui-control" id="operationDbUrlInput" type="url" placeholder="https://docs.google.com/spreadsheets/d/.../edit" />
        <div class="ui-page-actions">
          <button class="ui-btn primary" id="btnSaveOperationDb" type="button">최초 연결</button>
          <a class="ui-btn outline hidden" id="operationDbOpenLink" target="_blank" rel="noopener">열기</a>
        </div>
      </section>
      <section class="connection-card ui-card" id="userDbConnectionCard">
        <div class="connection-card__head">
          <strong>사용자 데이터베이스</strong>
          <span class="connection-status" id="userDbStatus">미연결</span>
        </div>
        <p class="connection-card__name" id="userDbName">연결된 스프레드시트가 없습니다.</p>
        <p class="connection-card__meta" id="userDbUpdatedAt"></p>
        <label for="userDbUrlInput">Google Sheets URL</label>
        <input class="ui-control" id="userDbUrlInput" type="url" placeholder="https://docs.google.com/spreadsheets/d/.../edit" />
        <div class="ui-page-actions">
          <button class="ui-btn primary" id="btnSaveUserDb" type="button">최초 연결</button>
          <a class="ui-btn outline hidden" id="userDbOpenLink" target="_blank" rel="noopener">열기</a>
        </div>
      </section>
      <section class="connection-card ui-card" id="rootFolderConnectionCard">
        <div class="connection-card__head">
          <strong>파일 저장소</strong>
          <span class="connection-status" id="rootFolderStatus">미연결</span>
        </div>
        <p class="connection-card__name" id="rootFolderName">연결된 Drive 폴더가 없습니다.</p>
        <p class="connection-card__meta" id="rootFolderUpdatedAt"></p>
        <label for="rootFolderUrlInput">Google Drive 폴더 URL</label>
        <input class="ui-control" id="rootFolderUrlInput" type="url" placeholder="https://drive.google.com/drive/folders/..." />
        <div class="ui-page-actions">
          <button class="ui-btn primary" id="btnSaveRootFolder" type="button">최초 연결</button>
          <a class="ui-btn outline hidden" id="rootFolderOpenLink" target="_blank" rel="noopener">열기</a>
        </div>
      </section>
    </div>
    <div class="ui-page-actions connection-page-actions">
      <button class="ui-btn outline" type="button" id="btnReloadData">다시 불러오기</button>
    </div>
  </div>
</div>
