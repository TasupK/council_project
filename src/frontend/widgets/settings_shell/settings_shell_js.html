<script>
  var SETTINGS_CAN_ADMIN = false;

  function applySettingsShell(data) {
    if (!data.session || !data.session.canAccessSettings) {
      throw new Error("설정 화면에 접근할 권한이 없습니다.");
    }
    SETTINGS_CAN_ADMIN = !!data.session.isAdmin;
    var user = data.currentUser || {};
    var app = data.app || {};
    var database = data.database || {};
    var nameEl = getAppElement("appUserName");
    var titleEl = getAppElement("appUserTitle");
    var termEl = getAppElement("appTerm");
    var statusBar = getSettingsElement("statusBar");
    if (nameEl) nameEl.textContent = user.name || "운영자";
    if (titleEl) titleEl.textContent = user.title || "사용자";
    if (termEl) termEl.innerHTML = "<option>" + escapeSettingsHtml(app.term || "2026학년도") + "</option>";
    if (statusBar) statusBar.textContent = "시스템 " + (app.version || "") + " · Google Sheets DB 연결됨";
    return database;
  }

  function showSettingsContent() {
    var loading = getSettingsElement("panel-loading");
    var content = getSettingsElement("panel-content");
    if (loading) loading.classList.remove("active");
    if (content) content.classList.add("active");
  }

  function showSettingsError(error) {
    var loading = getSettingsElement("panel-loading");
    if (!loading) return;
    loading.innerHTML = '<div class="placeholder-page"><strong>초기화 실패</strong><p>' + escapeSettingsHtml(error.message || error) + "</p></div>";
  }

  function escapeSettingsHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function getSettingsElement(id) {
    return document.getElementById(id);
  }

  function wireSettingsBackLink() {
    var link = getSettingsElement("settingsBackLink");
    if (!link || typeof buildAppPageUrl !== "function") return;
    link.href = buildAppPageUrl("settings");
  }

  wireSettingsBackLink();
</script>
