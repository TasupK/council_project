<!--
  [Settings_Styles] 설정 도메인 CSS — Figma 설정화면(사용자/역할/권한) 기준
  행: 선택=하늘색, 신규=하늘색+파란바, 수정=노란색+노란바
  버튼: IBM Carbon 블루 #0f62fe
-->
<style>
  .settings-figma {
    --s-primary: #0f62fe;
    --s-primary-hover: #0353e9;
    --s-row-new: #e8f1ff;
    --s-row-new-bar: #0f62fe;
    --s-row-changed: #fff8e1;
    --s-row-changed-bar: #f1c21b;
    --s-row-selected: #e5f2ff;
    --s-dirty-bg: #fcf4d6;
    --s-dirty-border: #f1c21b;
    --s-tag-new: #0f62fe;
    --s-meta-green: #198038;
    --s-warn-red: #da1e28;
    --s-radius: 6px;
    --s-table-font: 13px;
    --s-th-font: 12px;
  }

  /* 세부 페이지: ← + 제목 (설정 전 페이지 24px 통일) */
  .main .page-header .page-title,
  .settings-title-row .page-title {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.02em;
    color: #121619;
  }
  .settings-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
  }
  .settings-edit-hint {
    margin: 0 0 10px;
    color: #697077;
    font-size: 12px;
  }
  .settings-back-link.back-btn {
    display: inline-flex;
    color: #121619;
    text-decoration: none;
    border-radius: 6px;
  }
  .settings-back-link.back-btn:hover { background: #f2f4f8; }

  /* 설정 홈 목록 */
  .settings-list { overflow: hidden; padding: 0; }
  .settings-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--ui-space-3);
    min-height: 52px;
    padding: 0 var(--ui-space-5);
    border: 0;
    border-bottom: 1px solid var(--ui-border);
    background: transparent;
    text-align: left;
    font-size: 14px;
    font-weight: 600;
    color: var(--ui-text);
  }
  .settings-row:last-child { border-bottom: 0; }
  .settings-row:hover { background: #fafbfc; }
  .settings-row .chevron { color: var(--ui-muted); }

  .connection-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .connection-card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
    border-top: 3px solid #c1c7cd;
  }
  .connection-card.is-connected { border-top-color: #24a148; }
  .connection-card.is-error { border-top-color: #da1e28; }
  .connection-card.is-busy { opacity: .7; }
  .connection-card__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .connection-card__name {
    min-height: 40px;
    margin: 0;
    color: #161616;
    font-size: 14px;
    line-height: 1.45;
    word-break: break-word;
  }
  .connection-card__meta {
    min-height: 18px;
    margin: 0;
    color: #697077;
    font-size: 12px;
  }
  .connection-card label {
    color: #525252;
    font-size: 12px;
    font-weight: 600;
  }
  .connection-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #697077;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .connection-status::before {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c1c7cd;
    content: "";
  }
  .connection-card.is-connected .connection-status { color: #198038; }
  .connection-card.is-connected .connection-status::before { background: #24a148; }
  .connection-card.is-error .connection-status { color: #da1e28; }
  .connection-card.is-error .connection-status::before { background: #da1e28; }
  .connection-page-actions { margin-top: 16px; }

  @media (max-width: 960px) {
    .connection-grid { grid-template-columns: 1fr; }
  }

  /* Figma 프라이머리 버튼 */
  .settings-figma .ui-btn.primary,
  .page-header .ui-btn.primary.settings-primary-btn {
    background: var(--s-primary, #0f62fe);
    border-color: var(--s-primary, #0f62fe);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    min-height: 40px;
    padding: 0 16px;
    border-radius: var(--s-radius, 6px);
  }
  .settings-figma .ui-btn.primary:hover,
  .page-header .ui-btn.primary.settings-primary-btn:hover {
    background: var(--s-primary-hover, #0353e9);
    border-color: var(--s-primary-hover, #0353e9);
  }
  .settings-figma .ui-btn.outline {
    background: #fff;
    border: 1px solid #c1c7cd;
    color: #121619;
    font-weight: 500;
    font-size: 13px;
    min-height: 36px;
    border-radius: var(--s-radius, 6px);
  }
  .settings-figma .ui-btn.outline:hover { background: #f2f4f8; }
  .settings-figma .ui-btn .btn-ico {
    display: inline-flex;
    margin-right: 6px;
    vertical-align: -2px;
  }

  /* 변경사항 바 (노란 배너) */
  .settings-dirty-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    padding: 10px 14px;
    border: 1px solid var(--s-dirty-border, #f1c21b);
    border-radius: 8px;
    background: var(--s-dirty-bg, #fcf4d6);
  }
  .settings-dirty-bar.show { display: flex; }
  .settings-dirty-bar strong {
    font-size: 13px;
    font-weight: 600;
    color: #161616;
  }

  /* 툴바·표 */
  .settings-figma .ui-toolbar {
    gap: 10px;
    margin-bottom: 12px;
    padding: 12px;
    border: 1px solid #dde1e6;
    border-radius: 8px;
    background: #fff;
  }
  .settings-figma .ui-table-wrap {
    border: 1px solid #dde1e6;
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }
  .settings-figma table.ui-table {
    font-size: var(--s-table-font, 13px);
  }
  .settings-figma table.ui-table th {
    background: #f2f4f8;
    color: #4d5358;
    font-size: var(--s-th-font, 12px);
    font-weight: 600;
    padding: 12px 12px;
    border-bottom: 1px solid #dde1e6;
  }
  .settings-figma table.ui-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #e8eaed;
    vertical-align: middle;
    color: #161616;
  }
  .settings-figma table.ui-table tbody tr {
    cursor: pointer;
    position: relative;
  }
  .settings-figma table.ui-table tbody tr:hover { background: #fafbfc; }
  /* 1행: 선택·편집 (파란 바) — 미변경 */
  .settings-figma table.ui-table tbody tr.settings-row-selected:not(.settings-row-changed),
  .settings-figma table.ui-table tbody tr.settings-row-new {
    background: var(--s-row-new, #e8f1ff) !important;
    box-shadow: inset 3px 0 0 var(--s-row-new-bar, #0f62fe);
  }
  /* 2행: 변경됨 (노란 바) */
  .settings-figma table.ui-table tbody tr.settings-row-changed {
    background: var(--s-row-changed, #fff8e1) !important;
    box-shadow: inset 3px 0 0 var(--s-row-changed-bar, #f1c21b);
  }
  .settings-figma table.ui-table tbody tr.settings-row-changed.settings-row-selected {
    filter: brightness(0.98);
  }
  .settings-figma .ui-control.compact,
  .settings-figma .select.compact {
    min-height: 34px;
    padding: 4px 10px;
    font-size: 13px;
    border-radius: 4px;
    border-color: #c1c7cd;
    background: #fff;
    width: 100%;
    max-width: 100%;
  }
  .settings-figma .ui-control.compact:focus,
  .settings-figma .select.compact:focus {
    outline: 2px solid #0f62fe;
    outline-offset: 0;
    border-color: #0f62fe;
  }
  .settings-cell-text {
    display: block;
    font-size: 13px;
    color: #161616;
    line-height: 1.4;
    word-break: break-word;
  }
  .settings-cell-muted {
    color: #697077;
  }
  .settings-status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
  }
  .settings-status-pill::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c1c7cd;
  }
  .settings-status-pill.is-active::before { background: #24a148; }
  .settings-status-pill.is-active { color: #198038; }
  .settings-figma .table-footer {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    font-size: 12px;
    color: #697077;
    background: #fafbfc;
    border-top: 1px solid #dde1e6;
  }

  /* 상태 토글 */
  .settings-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .settings-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .settings-toggle-track {
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: #c1c7cd;
    position: relative;
    transition: background .15s ease;
    flex-shrink: 0;
  }
  .settings-toggle-track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
    transition: transform .15s ease;
  }
  .settings-toggle input:checked + .settings-toggle-track {
    background: #24a148;
  }
  .settings-toggle input:checked + .settings-toggle-track::after {
    transform: translateX(16px);
  }
  .settings-toggle-label {
    font-size: 12px;
    font-weight: 600;
    color: #525252;
  }
  .settings-toggle input:checked ~ .settings-toggle-label { color: #198038; }
  .settings-toggle input:disabled + .settings-toggle-track { opacity: .55; cursor: not-allowed; }

  .role-check-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 88px;
    overflow: auto;
    min-width: 140px;
  }
  .role-check-list label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ui-text);
  }
  .settings-type-tag {
    display: inline-flex;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: #e8f1ff;
    color: #0043ce;
  }
  .settings-type-tag.default {
    background: #eef0f3;
    color: #525252;
  }
  .settings-link {
    color: #0f62fe;
    font-weight: 600;
    font-size: 13px;
  }
  .settings-protected {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 6px;
    font-size: 11px;
    color: #697077;
  }

  /* 권한 패널·매트릭스 */
  .role-panel {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1fr 1.3fr auto;
    gap: 12px;
    align-items: end;
    margin-bottom: 12px;
    padding: 14px 16px;
    border: 1px solid #dde1e6;
    border-radius: 8px;
    background: #fff;
  }
  .role-panel label {
    display: block;
    margin-bottom: 6px;
    color: #697077;
    font-size: 12px;
    font-weight: 500;
  }
  .role-panel .value {
    color: #161616;
    font-size: 13px;
    font-weight: 600;
  }
  .role-panel a.link { color: #0f62fe; font-weight: 600; }

  /* 업무 권한 매트릭스 — Figma: 상위 진한회색(체크 없음) / 하위 체크·왼쪽 정렬 */
  .perm-table {
    table-layout: fixed;
    width: 100%;
  }
  .perm-table th,
  .perm-table td {
    text-align: left;
    vertical-align: middle;
  }
  .perm-table th:first-child,
  .perm-table td:first-child {
    width: auto;
  }
  .perm-table th:not(:first-child),
  .perm-table td:not(:first-child) {
    width: 112px;
    padding: 6px 10px;
  }
  .perm-table thead th {
    font-size: 12px;
    font-weight: 600;
    color: #525252;
    line-height: 1.25;
    background: #f4f4f4;
  }
  .perm-table tbody tr.perm-group {
    background: #d8d8d8 !important;
    cursor: pointer;
    user-select: none;
  }
  .perm-table tbody tr.perm-group:hover {
    background: #c6c6c6 !important;
  }
  .perm-table tbody tr.perm-group td {
    border-bottom-color: #c6c6c6;
    padding-top: 10px;
    padding-bottom: 10px;
  }
  .perm-table tbody tr.perm-child {
    background: #fff !important;
  }
  .perm-table tbody tr.perm-child:hover {
    background: #fafbfc !important;
  }
  .perm-group-label {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .perm-expand {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #161616;
    font-size: 10px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }
  .perm-group-name {
    color: #161616;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .perm-count {
    color: #697077;
    font-size: 12px;
    font-weight: 400;
    white-space: nowrap;
  }
  .perm-elbow {
    display: inline-block;
    width: 14px;
    margin-right: 6px;
    color: #8d8d8d;
    font-size: 13px;
    line-height: 1;
  }
  .perm-child td:first-child {
    padding-left: 56px;
    color: #161616;
    font-size: 13px;
    font-weight: 400;
  }
  .perm-group-empty {
    /* 상위 행: 권한 체크 칸 비움 */
  }
  .meta-sub {
    display: block;
    margin-top: 2px;
    color: var(--ui-muted);
    font-size: 11px;
    font-weight: 400;
  }
  .na { color: var(--ui-muted); font-size: 11px; }
  .th-hint {
    display: block;
    color: var(--ui-muted);
    font-size: 10.5px;
    font-weight: 400;
  }
  .perm-cell {
    background: transparent;
  }
  .perm-cell.is-changed {
    background: #e8f1ff;
  }
  .perm-cell-inner {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 3px;
    min-height: 44px;
  }
  .perm-change-badge {
    display: block;
    height: 12px;
    font-size: 10px;
    font-weight: 700;
    line-height: 12px;
    color: #0f62fe;
    letter-spacing: -0.02em;
    text-align: left;
  }
  .perm-change-badge.is-empty {
    visibility: hidden;
  }
  .perm-table input.check {
    -webkit-appearance: none;
    appearance: none;
    box-sizing: border-box;
    width: 18px;
    height: 18px;
    margin: 0;
    border: 1.5px solid #c1c7cd;
    border-radius: 3px;
    background: #fff;
    flex-shrink: 0;
    vertical-align: middle;
    position: relative;
  }
  .perm-table input.check:checked {
    background: #0f62fe;
    border-color: #0f62fe;
  }
  .perm-table input.check:checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1.5px;
    width: 5px;
    height: 9px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .perm-table input.check:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .perm-table input.check:disabled:checked {
    background: #8d8d8d;
    border-color: #8d8d8d;
  }
  .perm-table input.check:not(:disabled) {
    cursor: pointer;
  }
  .perm-table input.check:focus-visible {
    outline: 2px solid #0f62fe;
    outline-offset: 2px;
  }

  /* 확인 모달 (Figma) */
  .settings-modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 80;
    align-items: center;
    justify-content: center;
    background: rgba(22, 22, 22, 0.5);
    padding: 24px;
  }
  .settings-modal-backdrop.show { display: flex; }
  .settings-modal {
    width: min(560px, 100%);
    background: #fff;
    border-radius: 8px;
    border: 1px solid #c6c6c6;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
  }
  .settings-modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 20px 20px 8px;
  }
  .settings-modal-head h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: #161616;
  }
  .settings-modal-head p {
    margin: 8px 0 0;
    color: #525252;
    font-size: 14px;
    line-height: 1.4;
  }
  .settings-modal-close {
    width: 32px;
    height: 32px;
    border: 0;
    background: transparent;
    color: #161616;
    font-size: 18px;
    line-height: 1;
    border-radius: 4px;
    cursor: pointer;
  }
  .settings-modal-close:hover { background: #f2f4f8; }
  .settings-modal-body {
    padding: 8px 20px 16px;
    max-height: 48vh;
    overflow: auto;
  }
  .settings-modal-foot {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 14px 20px 18px;
    border-top: 1px solid #e0e0e0;
  }
  .summary-card {
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 10px;
    background: #fff;
  }
  .summary-card.is-new {
    border-color: #a6c8ff;
    background: #f4f8ff;
  }
  .summary-card.is-changed {
    border-color: #f1c21b;
    background: #fcf4d6;
  }
  .summary-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .summary-card-top strong {
    font-size: 14px;
    color: #161616;
  }
  .summary-badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--s-tag-new, #0f62fe);
    white-space: nowrap;
  }
  .summary-card .meta {
    color: #525252;
    font-size: 13px;
    line-height: 1.45;
  }
  .summary-card .meta-green { color: var(--s-meta-green, #198038); font-size: 12px; margin-top: 8px; }
  .summary-card .meta-change {
    margin-top: 8px;
    font-size: 13px;
    color: #161616;
  }
  .summary-card .meta-change .lbl { color: #697077; margin-right: 8px; }
  .summary-card .meta-warn {
    margin-top: 8px;
    color: var(--s-warn-red, #da1e28);
    font-size: 12px;
    font-weight: 600;
  }
  .settings-modal-foot .ui-btn.primary {
    background: #0f62fe;
    border-color: #0f62fe;
    color: #fff;
    font-weight: 600;
  }
  .settings-modal-foot .ui-btn.primary:hover {
    background: #0353e9;
    border-color: #0353e9;
  }

  @media (max-width: 1100px) {
    .role-panel { grid-template-columns: 1fr 1fr; }
  }
</style>
