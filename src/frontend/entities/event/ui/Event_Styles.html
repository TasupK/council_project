<style>

  /* 신청자 상세 모달: 공통 모달 토큰을 사용하되 동적 생성 구조를 지원합니다. */
  .ew-modal-backdrop {
    position: fixed;
    z-index: 100;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(20, 22, 30, .44);
  }
  .ew-modal {
    width: min(440px, 100%);

  .ew-modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--ui-space-4); padding: 12px 28px 26px; }

  /* 비동기 요청 중 행사 영역 전체를 덮는 로딩 오버레이입니다. */
  .ew-loading {

    .ew-filter-top { grid-template-columns: minmax(280px, 1fr) auto; }
    .ew-page-body { padding-left: var(--ui-space-6); padding-right: var(--ui-space-6); }
  }
</style>
