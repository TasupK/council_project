<style>
  :root {
    /* Canonical shared UI tokens */
    --ui-bg: #f5f6f8;
    --ui-surface: #ffffff;
    --ui-border: #e5e7eb;
    --ui-border-strong: #d1d5db;
    --ui-text: #1f2430;
    --ui-muted: #6b7280;
    --ui-primary: #2f3b52;
    --ui-primary-hover: #3f4d6b;
    --ui-info-bg: #eaf1fd;
    --ui-info-fg: #1d4ed8;
    --ui-success-bg: #e7f7ee;
    --ui-success-fg: #17803d;
    --ui-warning-bg: #fff6e0;
    --ui-warning-fg: #92650a;
    --ui-danger-bg: #fdecec;
    --ui-danger-fg: #c22b2b;
    --ui-neutral-bg: #eef0f3;
    --ui-neutral-fg: #5b6472;
    --ui-radius-sm: 6px;
    --ui-radius-md: 8px;
    --ui-radius-lg: 10px;
    --ui-shadow: 0 2px 8px rgba(20, 24, 32, 0.06);
    --ui-space-1: 4px;
    --ui-space-2: 8px;
    --ui-space-3: 12px;
    --ui-space-4: 16px;
    --ui-space-5: 20px;
    --ui-space-6: 24px;
    --ui-space-8: 32px;

    /* Structural / brand tokens */
    --brand: #001d6c;
    --sidebar-w: 248px;
    --header-h: 64px;
    --status-h: 32px;
    --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;

    /* Temporary compatibility aliases. Remove after domain migrations. */
    --bg: var(--ui-bg);
    --surface: var(--ui-surface);
    --border: var(--ui-border);
    --border-strong: var(--ui-border-strong);
    --text: var(--ui-text);
    --text-2: var(--ui-text);
    --text-3: var(--ui-muted);
    --text-4: var(--ui-muted);
    --primary: var(--ui-primary);
    --primary-hover: var(--ui-primary-hover);
    --active-bg: var(--ui-info-bg);
    --active-text: var(--ui-info-fg);
    --danger: var(--ui-danger-fg);
    --green: var(--ui-success-fg);
    --radius: var(--ui-radius-md);
    --shadow: var(--ui-shadow);
    --blue: var(--ui-primary);
    --warn-bg: var(--ui-warning-bg);
    --warn-border: var(--ui-warning-fg);
    --changed-bg: var(--ui-info-bg);
    --new-bg: var(--ui-success-bg);
    --line: var(--ui-border);
    --cool: var(--ui-bg);
    --muted: var(--ui-muted);
    --navy: var(--brand);
    --side: var(--sidebar-w);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--ui-text);
    background: var(--ui-bg);
  }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  /* Legacy shared content primitives retained until their owning domain migrates. */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 24px;
    background: var(--ui-surface);
    border-top: 1px solid var(--ui-border);
    color: var(--ui-muted);
    font-size: 12px;
  }
  .status-bar a { color: var(--ui-primary); font-weight: 500; }
  .db-card {
    margin-top: 24px;
    padding: 16px 20px;
    background: var(--ui-surface);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-sm);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .db-card strong { display: block; margin-bottom: 4px; }
  .db-card p { margin: 0; color: var(--ui-muted); font-size: 13px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 40px;
    padding: 0 16px;
    border-radius: var(--ui-radius-sm);
    border: 1px solid transparent;
    font-weight: 500;
    white-space: nowrap;
  }
  .btn-primary { background: var(--ui-primary); color: #fff; border-color: var(--ui-primary); }
  .btn-primary:hover { background: var(--ui-primary-hover); }
  .btn-secondary { background: var(--ui-surface); color: var(--ui-text); border-color: var(--ui-border-strong); }
  .btn-ghost { background: transparent; color: var(--ui-text); border-color: transparent; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-lg { height: 48px; padding: 0 20px; font-size: 16px; }

  .section-title {
    margin: 0 0 12px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ui-muted);
  }
  .chevron { color: var(--ui-muted); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
  }
  .field, .select, .search-field {
    height: 40px;
    border: 1px solid var(--ui-border-strong);
    border-radius: var(--ui-radius-sm);
    background: var(--ui-surface);
    padding: 0 12px;
    color: var(--ui-text);
  }
  .search-field { min-width: 240px; }
  .count-label { margin-left: auto; color: var(--ui-muted); font-size: 14px; }

  .table-wrap {
    background: var(--ui-surface);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-sm);
    overflow: auto;
  }
  table.data { width: 100%; border-collapse: collapse; min-width: 1180px; }
  table.data th, table.data td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--ui-border);
    text-align: left;
    vertical-align: middle;
    font-size: 14px;
  }
  table.data th {
    background: #f8f9fb;
    color: var(--ui-muted);
    font-weight: 600;
    white-space: nowrap;
  }
  table.data tr:last-child td { border-bottom: 0; }
  .table-footer {
    display: flex;
    justify-content: space-between;
    padding: 12px 14px;
    color: var(--ui-muted);
    font-size: 13px;
    border-top: 1px solid var(--ui-border);
    background: #fafbfc;
  }

  .loading { padding: 48px; text-align: center; color: var(--ui-muted); }
  .placeholder-page {
    background: var(--ui-surface);
    border: 1px dashed var(--ui-border-strong);
    border-radius: var(--ui-radius-sm);
    padding: 48px;
    color: var(--ui-muted);
  }
  .page-panel { display: none; }
  .page-panel.active { display: block; }
  .hidden { display: none !important; }

  /* Standalone Login */
  .login {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--ui-bg);
  }
  .login-box { width: min(390px, calc(100% - 32px)); text-align: center; }
  .login h1 { font-size: 26px; color: var(--ui-text); margin: 0; }
  .login p { color: var(--ui-muted); margin: 14px 0 28px; }
  .login button {
    width: 100%;
    height: 48px;
    border: 1px solid var(--ui-border-strong);
    border-radius: var(--ui-radius-sm);
    background: var(--ui-surface);
    font-weight: 700;
    color: var(--ui-text);
  }
  .login button:disabled { opacity: 0.7; cursor: not-allowed; }
  .login button:focus-visible { outline: 2px solid var(--ui-primary); outline-offset: 2px; }
  .alert {
    display: none;
    margin-top: 14px;
    padding: 12px;
    border: 1px solid var(--ui-warning-fg);
    border-radius: var(--ui-radius-sm);
    background: var(--ui-warning-bg);
    color: var(--ui-warning-fg);
    text-align: left;
  }
  .alert.show { display: block; }

  /* MyPage compatibility layer. Move into MyPage_Styles during the MyPage migration. */
  .section { margin-top: 0; }
  .section + .section { margin-top: 24px; padding-top: 30px; border-top: 1px solid var(--ui-border); }
  .section h2 { margin: 0; color: var(--ui-text); font-size: 20px; font-weight: 700; }
  .section > .desc { margin: 7px 0 16px; color: var(--ui-muted); font-size: 13px; line-height: 1.5; }

  .profile-card {
    min-height: 192px;
    background: var(--ui-surface);
    border: 1px solid var(--ui-border);
    display: flex;
    align-items: flex-start;
    padding: 32px 32px 50px;
    position: relative;
    border-radius: var(--ui-radius-sm);
    flex-wrap: wrap;
    gap: 20px;
  }
  .profile-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--ui-info-bg);
    color: var(--ui-info-fg);
    font-size: 28px;
    font-weight: 800;
    flex-shrink: 0;
  }
  .profile-identity { margin: 3px 0 0; width: 180px; flex-shrink: 0; }
  .profile-identity b { font-size: 20px; font-weight: 700; display: block; word-break: keep-all; }
  .facts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 28px 40px;
    margin: 0;
    flex-grow: 1;
    width: 100%;
    min-width: 250px;
  }
  .facts dt { font-size: 12px; color: var(--ui-muted); font-weight: 700; margin-bottom: 8px; }
  .facts dd { margin: 0; font-size: 14px; font-weight: 700; color: var(--ui-text); }
  .profile-note { position: absolute; bottom: 16px; left: 32px; color: var(--ui-muted); font-size: 12px; margin: 0; }

  .role-row {
    height: 56px;
    display: flex;
    align-items: center;
    background: var(--ui-surface);
    border: 1px solid var(--ui-border);
    padding: 0 15px;
    border-radius: var(--ui-radius-sm);
  }
  .role-row + .role-row { margin-top: 8px; }
  .role-name { font-size: 15px; font-weight: 800; min-width: 184px; color: var(--ui-text); }
  .role-tag, .tag { padding: 7px 12px; background: var(--ui-bg); border-radius: var(--ui-radius-sm); color: var(--ui-muted); font-size: 12px; font-weight: 700; }
  .role-status { margin-left: 50px; color: var(--ui-success-fg); font-weight: 700; font-size: 13px; }
  .view {
    height: 40px;
    width: 120px;
    margin-left: auto;
    border: 1px solid var(--ui-border-strong);
    background: var(--ui-surface);
    color: var(--ui-primary);
    font-weight: 700;
    border-radius: var(--ui-radius-sm);
  }

  .notification-table { border: 1px solid var(--ui-border); background: var(--ui-surface); border-radius: var(--ui-radius-sm); }
  .n-head, .n-row { display: grid; grid-template-columns: minmax(150px, 2fr) minmax(180px, 3fr) 110px 110px 80px; align-items: center; gap: 8px; }
  .n-head { height: 48px; background: var(--ui-neutral-bg); font-weight: 700; font-size: 13px; color: var(--ui-text); }
  .n-head > * { padding-left: 16px; }
  .n-row { min-height: 72px; border-top: 1px solid var(--ui-border); }
  .n-row.changed { background: var(--ui-info-bg); }
  .n-row.failed { background: var(--ui-danger-bg); }
  .n-row > * { padding-left: 16px; }
  .n-name { font-weight: 700; color: var(--ui-text); font-size: 14px; }
  .n-desc { font-size: 13px; color: var(--ui-muted); }
  .locked { color: var(--ui-success-fg); font-size: 12px; font-weight: 700; }

  .toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; border-radius: 12px; background: var(--ui-border-strong); transition: .2s; }
  .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .2s; }
  .toggle input:checked + .slider { background: var(--ui-success-fg); }
  .toggle input:checked + .slider:before { transform: translateX(20px); }

  .changed-cell {
    height: 72px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--ui-primary);
    margin: -1px 0;
    padding-left: 15px !important;
    color: var(--ui-primary);
    font-size: 11px;
    font-weight: 800;
    background: var(--ui-info-bg);
  }
  .tag.optional { background: var(--ui-info-bg); color: var(--ui-info-fg); display: inline-block; padding: 7px 12px; }

  .bar {
    min-height: 48px;
    margin-top: 14px;
    padding: 4px 8px 4px 15px;
    display: flex;
    align-items: center;
    background: var(--ui-warning-bg);
    border: 1px solid var(--ui-warning-fg);
    border-radius: var(--ui-radius-sm);
  }
  .bar strong { font-size: 14px; color: var(--ui-text); }
  .bar button { height: 40px; border: 1px solid var(--ui-border-strong); background: var(--ui-surface); font-weight: 700; margin-left: 8px; padding: 0 16px; border-radius: var(--ui-radius-sm); color: var(--ui-text); }
  .bar .save { background: var(--ui-primary); border-color: var(--ui-primary); color: #fff; }
  .bar .save, .bar .cancel { display: none; }
  .bar.has-changes .save, .bar.has-changes .cancel { display: block; }
  .bar .cancel { margin-left: auto; }

  .statusbar {
    position: fixed;
    z-index: 2;
    bottom: 0;
    left: 0;
    right: 0;
    height: 32px;
    background: var(--ui-surface);
    border-top: 1px solid var(--ui-border);
    padding: 8px 23px;
    color: var(--ui-muted);
    font-size: 12px;
  }

  .backdrop { display: none; position: fixed; z-index: 10; inset: 0; background: rgba(16,24,40,0.5); place-items: center; }
  .backdrop.open { display: grid; }
  .modal {
    width: min(1000px, calc(100vw - 40px));
    max-height: calc(100vh - 40px);
    overflow: auto;
    background: var(--ui-surface);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-md);
    padding: 26px 39px;
  }
  .modal.small { width: 560px; padding: 23px; }
  .modal h2 { margin: 0; font-size: 22px; color: var(--ui-text); font-weight: 700; }
  .modal-sub { margin: 9px 0 16px; color: var(--ui-muted); font-size: 13px; font-weight: 600; }
  .readonly { display: inline-block; margin-left: 10px; padding: 6px 12px; background: var(--ui-bg); border-radius: 13px; color: var(--ui-muted); font-size: 11px; }
  .close { float: right; width: 32px; height: 32px; border: 0; border-radius: var(--ui-radius-sm); background: var(--ui-bg); color: var(--ui-muted); font-size: 18px; display: grid; place-items: center; }
  .info { padding: 14px 16px; background: var(--ui-warning-bg); color: var(--ui-warning-fg); border-radius: var(--ui-radius-sm); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .permission-table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 12px; }
  .permission-table th, .permission-table td { height: 44px; border: 1px solid var(--ui-border); text-align: center; color: var(--ui-text); }
  .permission-table th { background: var(--ui-bg); font-weight: 700; }
  .permission-table td:first-child, .permission-table th:first-child { text-align: left; padding-left: 16px; }
  .yes { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; background: var(--ui-neutral-fg); color: #fff; }
  .permission-table tr.group { cursor: pointer; transition: background 0.2s; }
  .permission-table tr.group:hover { background: #f8f9fa; }
  .permission-table tr.group td:first-child { font-weight: 700; position: relative; }
  .permission-table tr.group:not(.no-subs) td:first-child::after { content: '⌄'; float: right; margin-right: 16px; transition: transform 0.2s; font-size: 14px; color: var(--ui-muted); }
  .permission-table tr.group.open td:first-child::after { transform: rotate(180deg); }
  .permission-table tr.sub { display: none; background: #fafbfc; }
  .permission-table tr.sub.show { display: table-row; }
  .permission-table tr.sub td:first-child { padding-left: 32px; color: var(--ui-muted); }
  .no { display: inline-grid; width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--ui-border-strong); background: var(--ui-surface); }
  .modal-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; padding-top: 17px; border-top: 1px solid var(--ui-border); color: var(--ui-muted); font-size: 12px; }
  .modal-foot button, .confirm-actions button { width: 88px; height: 40px; border: 1px solid var(--ui-border); background: var(--ui-surface); font-weight: 700; border-radius: var(--ui-radius-sm); color: var(--ui-text); }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--ui-border); }
  .confirm-actions .primary { width: 160px; background: var(--ui-primary); color: #fff; border-color: var(--ui-primary); }
  .change-list { padding: 14px 16px; margin: 22px 0 0; background: #f8f9fa; border: 1px solid var(--ui-border); border-radius: var(--ui-radius-sm); line-height: 1.8; font-size: 14px; color: var(--ui-text); }

  .toast { position: fixed; right: 24px; bottom: 50px; z-index: 12; display: none; padding: 12px 16px; background: var(--ui-primary); color: #fff; border-radius: var(--ui-radius-sm); font-size: 14px; font-weight: 500; }
  .toast.show { display: block; }

  @media (max-width: 1100px) {
    .facts { gap: 20px; margin-left: 22px; }
    .n-head, .n-row { grid-template-columns: 250px 1fr 125px 125px 80px; }
  }

  /* Shared UI primitives */
  .ui-page-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--ui-space-4);
    margin-bottom: var(--ui-space-4);
  }
  .ui-page-head small, .ui-page-desc { color: var(--ui-muted); font-size: 12px; }
  .ui-page-head h1 { margin: 2px 0 0; color: var(--ui-text); font-size: 21px; line-height: 1.35; }
  .ui-page-desc { margin: 4px 0 0; }
  .ui-page-actions { display: flex; align-items: center; gap: var(--ui-space-2); flex-wrap: wrap; }

  .ui-tabs {
    display: flex;
    align-items: center;
    gap: var(--ui-space-1);
    background: var(--ui-surface);
    border-bottom: 1px solid var(--ui-border);
  }
  .ui-tab {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 var(--ui-space-4);
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--ui-muted);
    font-weight: 600;
    white-space: nowrap;
  }
  .ui-tab:hover { color: var(--ui-text); }
  .ui-tab.active { color: var(--ui-text); border-bottom-color: var(--ui-primary); }

  .ui-card {
    background: var(--ui-surface);
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius-lg);
    box-shadow: var(--ui-shadow);
    padding: var(--ui-space-4);
  }
  .ui-card + .ui-card { margin-top: var(--ui-space-3); }

  .ui-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--ui-space-3); }
  .ui-stat-card {
    display: block;
    min-height: 92px;
    padding: 14px 16px;
    border: 0;
    border-radius: var(--ui-radius-lg);
    background: var(--ui-neutral-bg);
    color: var(--ui-neutral-fg);
    text-align: left;
  }
  button.ui-stat-card { width: 100%; }
  .ui-stat-card span { display: block; font-size: 12px; opacity: .86; }
  .ui-stat-card strong { display: block; margin-top: 7px; font-size: 21px; line-height: 1.15; }
  .ui-stat-card.info { background: var(--ui-info-bg); color: var(--ui-info-fg); }
  .ui-stat-card.success { background: var(--ui-success-bg); color: var(--ui-success-fg); }
  .ui-stat-card.warning { background: var(--ui-warning-bg); color: var(--ui-warning-fg); }
  .ui-stat-card.danger { background: var(--ui-danger-bg); color: var(--ui-danger-fg); }

  .ui-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 36px;
    padding: 7px 13px;
    border: 1px solid var(--ui-primary);
    border-radius: var(--ui-radius-md);
    background: var(--ui-primary);
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
  }
  .ui-btn:hover:not(:disabled) { background: var(--ui-primary-hover); border-color: var(--ui-primary-hover); }
  .ui-btn.primary { background: var(--ui-primary); border-color: var(--ui-primary); color: #fff; }
  .ui-btn.outline { background: #fff; color: var(--ui-primary); }
  .ui-btn.ghost { border-color: transparent; background: transparent; color: var(--ui-primary); }
  .ui-btn.success { border-color: var(--ui-success-fg); background: #fff; color: var(--ui-success-fg); }
  .ui-btn.danger { border-color: var(--ui-danger-fg); background: #fff; color: var(--ui-danger-fg); }
  .ui-btn.small { min-height: 30px; padding: 5px 9px; font-size: 11.5px; }
  .ui-btn.large { min-height: 44px; padding: 9px 17px; font-size: 14px; }
  .ui-btn:disabled { opacity: .48; cursor: not-allowed; }
  .ui-btn:focus-visible { outline: 2px solid var(--ui-primary); outline-offset: 2px; }

  .ui-field { display: grid; gap: 5px; min-width: 0; }
  .ui-field label { color: var(--ui-muted); font-size: 12px; font-weight: 500; }
  .ui-field input, .ui-field select, .ui-field textarea,
  input.ui-control, select.ui-control, textarea.ui-control {
    width: 100%;
    min-height: 36px;
    padding: 7px 10px;
    border: 1px solid var(--ui-border-strong);
    border-radius: var(--ui-radius-md);
    background: #fff;
    color: var(--ui-text);
    outline: none;
  }
  .ui-field textarea, textarea.ui-control { min-height: 88px; resize: vertical; }
  .ui-field input:disabled, .ui-field select:disabled, .ui-field textarea:disabled,
  .ui-control:disabled { background: var(--ui-neutral-bg); color: var(--ui-muted); cursor: not-allowed; opacity: .72; }
  .ui-field.invalid input, .ui-field.invalid select, .ui-field.invalid textarea,
