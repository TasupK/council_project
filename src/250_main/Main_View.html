<header class="page-header main-page-header ui-page-head">
  <div>
    <p class="crumb">메인화면</p>
    <h1 class="page-title">메인화면</h1>
    <p class="page-description">주요 현황과 빠른 실행을 확인합니다.</p>
  </div>
</header>

<div class="workspace dashboard-workspace">
  <section class="dashboard-section">
    <h2>주요 현황</h2>
    <p>현재 확인이 필요한 업무를 요약합니다.</p>
    <div class="status-grid">
      <article class="status-card ui-stat-card">
        <h3>학생회비</h3>
        <div class="metric"><span>납부 신청 대기</span><strong class="metric-blue">12건</strong></div>
        <div class="metric"><span>환불 처리 대기</span><strong class="metric-yellow">3건</strong></div>
      </article>
      <article class="status-card ui-stat-card">
        <h3>행사</h3>
        <div class="metric"><span>진행 중인 행사</span><strong class="metric-green">2건</strong></div>
        <div class="metric"><span>확인 대기</span><strong class="metric-yellow">7건</strong></div>
      </article>
      <article class="status-card ui-stat-card">
        <h3>회계</h3>
        <div class="metric"><span>확인 필요</span><strong class="metric-red">2건</strong></div>
        <div class="recent-transactions">
          <strong>최근 거래 내역</strong>
          <span>08.11 행사 참가비 입금 <b>+150,000원</b></span>
          <span>08.10 행사 물품 구매 <b>-82,000원</b></span>
        </div>
      </article>
    </div>
  </section>

  <section class="dashboard-section quick-section">
    <h2>빠른 실행</h2>
    <p>자주 사용하는 업무로 바로 이동합니다.</p>
    <div class="quick-grid">
      <button class="quick-action ui-card" type="button"><span class="quick-icon">＋</span><strong>수입·지출 등록</strong><span>›</span></button>
      <button class="quick-action ui-card" type="button"><span class="quick-icon">↻</span><strong>계좌 장부 대조</strong><span>›</span></button>
      <button class="quick-action ui-card" type="button"><span class="quick-icon">₩</span><strong>학생회비 납부관리</strong><span>›</span></button>
      <button class="quick-action ui-card" type="button"><span class="quick-icon">↓</span><strong>학생회비 환불관리</strong><span>›</span></button>
      <button class="quick-action ui-card" type="button"><span class="quick-icon">≡</span><strong>행사 목록</strong><span>›</span></button>
      <button class="quick-action ui-card" type="button"><span class="quick-icon">○</span><strong>마이페이지</strong><span>›</span></button>
    </div>
  </section>
</div>
