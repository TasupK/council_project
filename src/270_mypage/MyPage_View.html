<section class="mypage-page">
  <div class="page-head">
    <div>
      <h1>마이페이지</h1>
      <p>내 계정 정보와 현재 적용된 역할·권한을 확인합니다.</p>
    </div>
  </div>

  <!-- [기능명세 2.2] 데이터 로드 실패 등 오류 발생 시 나타나는 에러 컨테이너 -->
  <div class="mypage-error hidden" id="mypageError" role="alert"></div>

  <!-- [기능명세 1.1] 내 정보 (Profile): 구글 계정, 소속, 직책 등 기본 인적사항 노출 영역 -->
  <section class="card mypage-profile-card" aria-labelledby="mypageProfileTitle">
    <div class="mypage-section-head">
      <div>
        <h2 id="mypageProfileTitle">내 정보</h2>
        <p>Google 계정과 관리자 기준정보를 표시합니다.</p>
      </div>
      <span class="badge" id="mypageStatus">불러오는 중</span>
    </div>
    <div class="mypage-profile">
      <div class="mypage-avatar" id="mypageAvatar" aria-hidden="true">-</div>
      <div class="mypage-profile-main">
        <strong id="mypageName">불러오는 중</strong>
        <span id="mypageTitle">-</span>
      </div>
      <dl class="mypage-info-grid">
        <div><dt>Google 계정</dt><dd id="mypageEmail">-</dd></div>
        <div><dt>소속·부서</dt><dd id="mypageDepartment">-</dd></div>
      </dl>
    </div>
  </section>

  <div class="mypage-grid">
    <!-- [기능명세 1.2] 내 역할 (Roles): 현재 계정에 배정된 역할명을 칩 형태로 표시 -->
    <section class="card" aria-labelledby="mypageRolesTitle">
      <div class="mypage-section-head">
        <div>
          <h2 id="mypageRolesTitle">내 역할</h2>
          <p>현재 계정에 배정된 역할입니다.</p>
        </div>
      </div>
      <div class="mypage-list" id="mypageRoles"><span class="muted">불러오는 중...</span></div>
    </section>

    <!-- [기능명세 1.3] 접근 가능 업무영역 (Menus): 권한에 따라 접근할 수 있는 대분류 메뉴 나열 -->
    <section class="card" aria-labelledby="mypageMenusTitle">
      <div class="mypage-section-head">
        <div>
          <h2 id="mypageMenusTitle">접근 가능 업무영역</h2>
          <p>현재 유효 권한으로 접근 가능한 메뉴 영역입니다.</p>
        </div>
      </div>
      <div class="mypage-list" id="mypageMenus"><span class="muted">불러오는 중...</span></div>
    </section>
  </div>

  <!-- [기능명세 1.4] 내 권한 (Granular Permissions): IAM에 저장된 세부 권한별 허용 액션 리스트 -->
  <section class="card" aria-labelledby="mypagePermissionsTitle">
    <div class="mypage-section-head">
      <div>
        <h2 id="mypagePermissionsTitle">내 권한</h2>
        <p>IAM에 저장된 현재 유효 권한만 표시합니다.</p>
      </div>
    </div>
    <div class="mypage-permission-list" id="mypagePermissions"><span class="muted">불러오는 중...</span></div>
  </section>
</section>
