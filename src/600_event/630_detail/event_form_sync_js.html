<script>
/**
 * 630_detail Google Forms 응답 연동 확장 모듈입니다.
 * Event_Detail.html에서 기본 상세 스크립트 다음에 로드되며, 기본 렌더 함수를 보관한 뒤
 * Forms 상태/동기화 UI를 덧붙이는 방식으로 확장합니다.
 */
(function () {
  // 기본 상세 기능은 그대로 실행하기 위해 원본 함수 참조를 먼저 보관합니다.
  var originalRenderBasicTab = renderBasicTab;
  var originalApplicantsToolbar = applicantsToolbar;

  // 연동 정보가 없는 행사도 동일한 객체 구조를 사용하도록 기본값을 제공합니다.
  function currentFormSync_() {
    return state.detail && state.detail.formSync ? state.detail.formSync : {
      configured: false,
      googleFormId: '',
      responseSheetId: '',
      status: '미연동',
      lastSyncedAt: ''
    };
  }

  function formSyncStatusText_(sync) {
    if (!sync || !sync.configured) return '미연동';
    return sync.status || '연동';
  }

  function formSyncLastText_(sync) {
    return sync && sync.lastSyncedAt ? displayDate(sync.lastSyncedAt) : '없음';
  }

  // 기본정보 탭을 그린 뒤 연동 현황과 Forms ID 입력 폼을 추가합니다.
  renderBasicTab = function (panel) {
    originalRenderBasicTab(panel);
    var sync = currentFormSync_();
    var integrationBar = panel.querySelector('.ew-integration-bar');
    if (integrationBar) {
      integrationBar.innerHTML =
        integration('Google Forms 신청서', formSyncStatusText_(sync)) +
        integration('신청자 Google Sheets', sync.responseSheetId ? '연동' : '미연동') +
        integration('행사 증빙 Google Drive', '파일 필드 확인 필요') +
        integration('장부 데이터 연동', 'DB 확인 필요');
    }
    panel.insertAdjacentHTML('beforeend',
      '<form id="ew-form-sync-form" class="ew-card ew-tab-toolbar ui-card ui-toolbar">' +
        '<strong>Google Forms 응답 연동</strong>' +
        '<input class="ui-control" name="googleFormId" type="text" value="' + escapeHtml(sync.googleFormId || '') + '" placeholder="Google Form ID 또는 URL">' +
        '<input class="ui-control" name="responseSheetId" type="text" value="' + escapeHtml(sync.responseSheetId || '') + '" placeholder="응답 Spreadsheet ID 또는 URL">' +
        '<button class="ew-btn ew-btn-primary ew-btn-small ui-btn primary small" type="submit">↻ 응답 동기화</button>' +
        '<span class="ew-last-sync">마지막 동기화: ' + escapeHtml(formSyncLastText_(sync)) + '</span>' +
      '</form>'
    );
  };

  // 신청자 탭의 비활성 동기화 버튼을 실제 Forms 동기화 액션으로 교체합니다.
  applicantsToolbar = function () {
    var html = originalApplicantsToolbar();
    var sync = currentFormSync_();
    html = html.replace(
      /<strong>▣　Google Forms<\/strong><button[^>]*>↻<\/button>/,
      '<strong>▣　Google Forms</strong><button type="button" class="ew-btn ew-btn-small ui-btn outline small" data-action="sync-forms">↻ 응답 동기화</button>'
    );
    html = html.replace(
      /마지막 동기화: 확인 필요/,
      '마지막 동기화: ' + escapeHtml(formSyncLastText_(sync))
    );
    return html;
  };

  // 동기화 완료 후 overview를 다시 받아 모든 섹션 캐시와 KPI를 최신 상태로 맞춥니다.
  function syncEventFormResponses_(payload) {
    return runEventBusy(function () {
      return eventClient.syncApplicantsFromForms({
        id: state.currentEventId,
        payload: payload || {}
      }).then(function (result) {
        showToast(
          'Forms 동기화: 신규 ' + Number(result.importedCount || 0) +
          '건 · 중복 ' + Number(result.duplicateCount || 0) +
          '건 · 오류행 ' + Number(result.invalidCount || 0) + '건'
        );
        return eventClient.getOverview({ id: state.currentEventId });
      });
    }).then(function (detail) {
      cacheEventDetailData_(detail);
      renderDetailShell();
      renderActiveTab();
    }).catch(handleError);
  }

  // 기본정보 탭에서 Form/Spreadsheet ID를 지정하며 동기화하는 흐름입니다.
  document.addEventListener('submit', function (event) {
    if (event.target.id !== 'ew-form-sync-form') return;
    event.preventDefault();
    var form = event.target;
    syncEventFormResponses_({
      googleFormId: form.elements.googleFormId.value,
      responseSheetId: form.elements.responseSheetId.value
    });
  });

  // 신청자 탭에서는 이미 저장된 연동 설정으로 즉시 동기화합니다.
  document.addEventListener('click', function (event) {
    var button = event.target.closest('[data-action="sync-forms"]');
    if (!button || button.disabled) return;
    syncEventFormResponses_({});
  });
})();
</script>
