<div id="ew-app" class="ew-app">
  <section class="ew-page-head ui-page-head"><div><small id="ew-form-breadcrumb">행사복지관리 / 행사 등록·수정</small><h1 id="ew-form-title">행사 생성</h1><p>행사 기본정보를 입력하고 저장합니다.</p></div><div class="ew-page-actions ui-page-actions"><button type="button" class="ew-btn ui-btn outline" data-action="go-list">목록으로</button></div></section>
  <div class="ew-page-body">
    <form id="ew-event-form" class="ew-card ew-form-card ui-card">
      <div class="ew-form-row"><div class="ew-form-label">행사명 *</div><div class="ew-form-control ui-field"><input class="ui-control" name="name" required></div></div>
      <div class="ew-form-row"><div class="ew-form-label">유형 *</div><div class="ew-form-control ui-field"><input class="ui-control" name="category" required placeholder="예: MT, 개강총회"></div></div>
      <!-- TODO(DB 스키마): 행사 담당 부서 필드가 확정되면 입력을 활성화한다. -->
      <div class="ew-form-row"><div class="ew-form-label">담당 부서</div><div class="ew-form-control ui-field"><input class="ui-control" disabled></div></div>
      <div class="ew-form-row"><div class="ew-form-label">행사 목적 *</div><div class="ew-form-control ui-field"><textarea class="ui-control" name="description" required placeholder="행사의 목적과 취지를 입력하세요."></textarea></div></div>
      <div class="ew-form-row"><div class="ew-form-label">모집 기간 *</div><div class="ew-form-control ui-field"><div class="ew-date-range"><input class="ui-control" name="applicationStartAt" type="date" required><span>~</span><input class="ui-control" name="applicationEndAt" type="date" required></div></div></div>
      <!-- TODO(행사 일정): DB 종료일 필드 확정 후 종료일 입력과 저장을 활성화한다. -->
      <div class="ew-form-row"><div class="ew-form-label">행사 진행 일자 *</div><div class="ew-form-control ui-field"><div class="ew-date-range"><input class="ui-control" name="eventStartAt" type="date" required><span>~</span><input class="ui-control" type="date" disabled title="행사 종료일 필드 확인 필요"></div><div class="ew-form-help">행사 종료일 필드는 설계 확인 전까지 저장하지 않습니다.</div></div></div>
      <!-- TODO(DB 스키마): 행사 장소 필드가 확정되면 입력을 활성화한다. -->
      <div class="ew-form-row"><div class="ew-form-label">장소</div><div class="ew-form-control ui-field"><input class="ui-control" disabled></div></div>
      <div class="ew-form-row"><div class="ew-form-label">정원 *</div><div class="ew-form-control ui-field"><input class="ui-control" name="capacity" type="number" min="0" required></div></div>
      <div class="ew-form-row"><div class="ew-form-label">담당자 *</div><div class="ew-form-control ui-field"><input class="ui-control" name="managerId" required></div></div>
      <div class="ew-form-row ew-fee-form-row"><div class="ew-form-label ew-fee-main-label"><span>참가비 *</span><small>(*학생회비)</small></div><div class="ew-fee-options"><div class="ew-fee-option"><label for="ew-member-fee">납부자 *</label><div class="ew-money-input"><input class="ui-control" id="ew-member-fee" name="payerFee" type="number" min="0" required value="0"><span>원</span></div></div><div class="ew-fee-option"><label for="ew-non-member-fee">미납부자 *</label><div class="ew-money-input"><input class="ui-control" id="ew-non-member-fee" name="nonPayerFee" type="number" min="0" required value="0"><span>원</span></div></div></div></div>
      <!-- TODO(행사 장부): 예산안 테이블과 필드 계약 확정 후 입력을 활성화한다. -->
      <div class="ew-form-row"><div class="ew-form-label">예산안</div><div class="ew-form-control ui-field"><div class="ew-pending-field"><input class="ui-control" disabled placeholder="설계 확인 필요"><span class="ew-status ew-status-orange ui-badge warning">확인 필요</span></div><div class="ew-form-help">행사 장부 테이블 필드 확인 필요</div></div></div>
      <div class="ew-form-row"><div class="ew-form-label">진행상태 *</div><div class="ew-form-control ui-field"><div class="ew-radio-group" id="ew-event-status-radios"><label class="ew-radio-pill"><input type="radio" name="status" value="예정" required><span>예정</span></label><label class="ew-radio-pill"><input type="radio" name="status" value="모집"><span>모집</span></label><label class="ew-radio-pill"><input type="radio" name="status" value="진행"><span>진행</span></label><label class="ew-radio-pill"><input type="radio" name="status" value="종료"><span>종료</span></label><label class="ew-radio-pill"><input type="radio" name="status" value="취소"><span>취소</span></label></div></div></div>
      <div class="ew-form-row"><div class="ew-form-label">관련자료</div><div class="ew-form-control ui-field"><div class="ew-file-upload-row"><label class="ew-btn ew-file-picker ui-btn outline" for="ew-related-material-file">파일 선택</label><input id="ew-related-material-file" type="file" hidden accept=".pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.zip"><span id="ew-related-material-name" class="ew-file-name">선택된 파일 없음</span></div><div class="ew-form-help">PDF, 문서, 이미지, ZIP 파일 · 최대 5MB</div><div id="ew-existing-material" class="ew-existing-file" hidden></div></div></div>
      <!-- TODO(DB 스키마): 행사 기타사항 필드가 확정되면 입력을 활성화한다. -->
      <div class="ew-form-row"><div class="ew-form-label">기타사항</div><div class="ew-form-control ui-field"><textarea class="ui-control" disabled></textarea></div></div>
      <div class="ew-form-submit"><button class="ew-btn ew-btn-primary ui-btn primary" type="submit">저장</button></div>
    </form>
  </div>
  <div id="ew-loading" class="ew-loading ui-loading" hidden><span></span><p>불러오는 중입니다.</p></div><div id="ew-modal-root"></div><div id="ew-toast" class="ew-toast ui-toast" role="status" hidden></div>
</div>
