<script>
function textWithBreaks(value) {
    return escapeHtml(value || '-').replace(/\r?\n/g, '<br>');
  }

function renderDetailShell() {
    var detail = state.detail;
    var event = detail.event;
    var summary = detail.summary || {};
    populateEventDetail(event, summary);
  }

function populateEventDetail(event, summary) {
    var status = document.getElementById('ew-detail-status');
    document.getElementById('ew-detail-name').textContent = event.name || '행사 정보';
    status.textContent = event.status || '확인 필요';
    status.className = 'ew-status ' + statusClass(event.status) + ' ui-badge ' + sharedStatusClass(event.status);
    document.getElementById('ew-edit-event').dataset.id = event.id || '';
    document.getElementById('ew-detail-meta').innerHTML = [event.category, '담당자 ' + (event.managerId || '-'), '모집기간 ' + displayDate(event.applicationStartAt) + ' ~ ' + displayDate(event.applicationEndAt), '행사일 ' + displayDate(event.eventStartAt)].map(function (value) {
      return '<span>' + escapeHtml(value || '-') + '</span>';
    }).join('');
    setEventKpi('ew-kpi-total', summary.totalApplicants, '명');
    setEventKpi('ew-kpi-approved', summary.approvedApplicants, '명');
    setEventKpi('ew-kpi-paid', summary.paidApplicants, '명');
    setEventKpi('ew-kpi-attended', summary.actualAttendees, '명');
    setEventKpi('ew-kpi-balance', summary.currentBalance, '원');
  }

function setEventKpi(id, value, unit) {
    document.getElementById(id).textContent = value == null ? '확인 필요' : String(value) + unit;
  }

function renderActiveTab() {
    var panel = document.getElementById('ew-tab-panel');
    if (!panel) return;
    document.querySelectorAll('.ew-tab').forEach(function (tab) {
      tab.classList.toggle('active', tab.dataset.tab === state.activeTab);
    });
    if (state.activeTab === 'basic') renderBasicTab(panel);
    else if (state.activeTab === 'applicants') loadApplicants(panel);
    else if (state.activeTab === 'attendance') loadAttendance(panel);
    else if (state.activeTab === 'ledger') renderPendingTab(panel, '결산/장부 연동 확인 필요', '행사 장부 DB 테이블과 장부관리 영역의 연동 키가 확정되지 않아 관련 기능은 비활성 상태입니다.');
    else loadRefunds(panel);
  }

function renderBasicTab(panel) {
    var event = state.detail.event;
    panel.innerHTML = '<section class="ew-card ew-info-card ui-card"><h3>행사 정보</h3><dl class="ew-info-list">' +
      info('행사명', event.name) + info('행사 유형', event.category) +
      info('행사 목적', textWithBreaks(event.description), true) +
      info('담당자', event.managerId) + info('모집 기간', displayDate(event.applicationStartAt) + ' ~ ' + displayDate(event.applicationEndAt), true) +
      info('행사 기간', displayDate(event.eventStartAt) + ' ~ ' + displayDate(event.eventEndAt), true) +
      info('모집 정원', event.capacity + '명') + info('납부자 참가비', money(event.payerFee), true) +
      info('미납부자 참가비', money(event.nonPayerFee), true) +
      info('관련 자료', safeRelatedMaterialLink(event.evidenceFolderId) || '-', true) +
      '</dl></section>' +
      '<section class="ew-card ew-integration-bar ui-card">' +
        integration('Google Forms 신청서', '설정 확인 필요') +
        integration('신청자 Google Sheets', '설정 확인 필요') +
        integration('행사 증빙 Google Drive', '파일 필드 확인 필요') +
        integration('장부 데이터 연동', 'DB 확인 필요') +
        '<button type="button" class="ew-btn ui-btn outline" disabled title="Google Forms 연동 계약 확인 필요">↻　동기화</button>' +
      '</section>';
  }

function info(label, value, alreadyHtml) {
    return '<dt>' + escapeHtml(label) + '</dt><dd>' + (alreadyHtml ? value : escapeHtml(value || '-')) + '</dd>';
  }

function integration(label, status) {
    return '<div class="ew-integration"><strong>' + escapeHtml(label) + '</strong>' + statusBadge(status, '확인 필요') + '</div>';
  }

function renderPendingTab(panel, title, message) {
    panel.innerHTML = '<section class="ew-card ew-pending-panel ui-card"><h3>' + escapeHtml(title) + '</h3><p>' + escapeHtml(message) + '</p></section>';
  }

function loadApplicants(panel) {
    panel.innerHTML = applicantsToolbar() + '<div id="ew-applicants-table" class="ew-card ew-table-card ui-card"></div>';
    runEventBusy(function () {
      return eventClient.getApplicants({
        id: state.currentEventId,
        filter: state.applicantFilters,
        page: state.applicantPage,
        pageSize: 10
      });
    }).then(renderApplicantsTable).catch(handleError);
  }

function applicantsToolbar() {
    var filter = state.applicantFilters;
    return '<form id="ew-applicant-search" class="ew-card ew-tab-toolbar ui-card ui-toolbar">' +
      '<strong>▣　Google Forms</strong><button type="button" class="ew-btn ew-btn-small ui-btn outline small" disabled title="Google Forms 연동 계약 확인 필요">↻</button><span class="ew-spacer"></span>' +
      '<input class="ui-control" name="keyword" type="search" value="' + escapeHtml(filter.keyword || '') + '" placeholder="이름, 학번, 연락처 검색">' +
      '<select class="ui-control" name="applicantType"><option value="">학생회비 납부</option><option value="납부" ' + selected(filter.applicantType, '납부') + '>납부</option><option value="미납" ' + selected(filter.applicantType, '미납') + '>미납</option></select>' +
      '<select class="ui-control" name="status"><option value="">승인 상태</option><option value="대기" ' + selected(filter.status, '대기') + '>대기</option><option value="승인" ' + selected(filter.status, '승인') + '>승인</option><option value="반려" ' + selected(filter.status, '반려') + '>반려</option></select>' +
      '<button class="ew-btn ew-btn-primary ew-btn-small ui-btn primary small" type="submit">검색</button><span class="ew-last-sync">마지막 동기화: 확인 필요</span></form>';
  }

function renderApplicantsTable(data) {
    var target = document.getElementById('ew-applicants-table');
    if (!target) return;
    var body = (data.items || []).length ? data.items.map(function (item) {
      var paid = Number(item.paidAmount || 0) >= Number(item.appliedFee || 0) && Number(item.appliedFee || 0) >= 0;
      return '<tr><td>' + displayDate(item.sourceResponseAt) + '</td><td>' + escapeHtml(item.name) + '</td><td>' + escapeHtml(item.studentId) + '</td><td>' + escapeHtml(item.phone) + '</td>' +
        '<td>' + statusBadge(item.applicantType) + '</td><td>' + statusBadge(item.status) + '</td>' +
        '<td>' + statusBadge(paid ? '입금 완료' : '입금 대기') + '</td><td><button type="button" class="ew-btn ew-btn-outline ew-btn-small ui-btn outline small" data-action="applicant-detail" data-id="' + escapeHtml(item.id) + '">보기</button></td></tr>';
    }).join('') : '<tr><td colspan="8" class="ew-table-empty ui-empty">신청자 데이터가 없습니다. Forms 연동 설정을 확인해주세요.</td></tr>';
    target.innerHTML = '<table class="ew-table ui-table"><thead><tr><th>신청일시</th><th>이름</th><th>학번</th><th>연락처</th><th>학생회비</th><th>승인</th><th>참가비</th><th>상세</th></tr></thead><tbody>' + body + '</tbody></table>' + paginationHtml(data, 'applicant-page');
  }

function openApplicantModal(applicationId) {
    runEventBusy(function () { return eventClient.getApplicant({ id: applicationId }); }).then(function (data) {
      var item = data.applicant;
      var paid = Number(item.paidAmount || 0) >= Number(item.appliedFee || 0);
      modalRoot.innerHTML = '<div class="ew-modal-backdrop ui-modal-overlay" data-action="close-modal"><section class="ew-modal ui-modal" role="dialog" aria-modal="true" aria-labelledby="ew-modal-title" data-modal-stop>' +
        '<header class="ew-modal-head"><h2 id="ew-modal-title">신청자 상세</h2><button class="ew-modal-close ui-btn ghost small" type="button" data-action="close-modal" aria-label="닫기">×</button></header>' +
        '<div class="ew-modal-body"><dl class="ew-modal-info">' + info('이름', item.name) + info('학번', item.studentId) +
        info('학과', '확인 필요 · DB 필드 없음') + info('연락처', item.phone) + '</dl><div class="ew-modal-divider"></div>' +
        '<dl class="ew-modal-info">' + info('학생회비 상태', statusBadge(item.applicantType), true) +
        info('참가비 입금 상태', statusBadge(paid ? '입금 완료' : '입금 대기'), true) +
        info('승인 상태', statusBadge(item.status), true) + '</dl>' +
        '<div class="ew-modal-divider"></div><label>송금 내역 캡처</label><div class="ew-upload-placeholder"><div>▦<strong>송금 내역 파일 API 확인 필요</strong><small>설계 확정 전 업로드 비활성</small></div></div></div>' +
        '<footer class="ew-modal-actions"><button type="button" class="ew-btn ew-btn-outline ui-btn outline" data-action="process-applicant" data-id="' + escapeHtml(item.id) + '" data-process="confirmDeposit">입금 확인</button>' +
        '<button type="button" class="ew-btn ew-btn-primary ui-btn primary" data-action="process-applicant" data-id="' + escapeHtml(item.id) + '" data-process="approve">승인</button></footer>' +
        '</section></div>';
    }).catch(handleError);
  }

function loadAttendance(panel) {
    panel.innerHTML = attendanceToolbar() + '<div id="ew-attendance-table" class="ew-card ew-table-card ui-card"></div><div id="ew-dirty-bar"></div>';
    runEventBusy(function () {
      return eventClient.getAttendances({
        id: state.currentEventId,
        filter: state.attendanceFilters,
        page: state.attendancePage,
        pageSize: 10
      });
    }).then(renderAttendanceTable).catch(handleError);
  }

function attendanceToolbar() {
    var filter = state.attendanceFilters;
    return '<form id="ew-attendance-search" class="ew-card ew-tab-toolbar ui-card ui-toolbar"><strong>▣　출석 체크 시트 (Google Forms)</strong>' +
      '<button type="button" class="ew-btn ew-btn-small ui-btn outline small" disabled title="출석 원본 연동 계약 확인 필요">↻ 명단 동기화</button><span class="ew-spacer"></span>' +
      '<input class="ui-control" name="keyword" type="search" value="' + escapeHtml(filter.keyword || '') + '" placeholder="이름, 학번, 연락처 검색">' +
      '<select class="ui-control" name="feeStatus"><option value="">참가비 상태</option><option value="paid" ' + selected(filter.feeStatus, 'paid') + '>입금 완료</option><option value="unpaid" ' + selected(filter.feeStatus, 'unpaid') + '>미입금</option></select>' +
      '<select class="ui-control" name="status"><option value="">출석 상태</option><option value="출석" ' + selected(filter.status, '출석') + '>출석</option><option value="미참석" ' + selected(filter.status, '미참석') + '>미참석</option></select>' +
      '<button class="ew-btn ew-btn-primary ew-btn-small ui-btn primary small" type="submit">검색</button><span class="ew-last-sync">마지막 동기화: 확인 필요</span></form>';
  }

function selected(current, value) {
    return current === value ? 'selected' : '';
  }

function renderAttendanceTable(data) {
    var target = document.getElementById('ew-attendance-table');
    if (!target) return;
    var body = (data.items || []).length ? data.items.map(function (item) {
      var paid = Number(item.paidAmount || 0) >= Number(item.appliedFee || 0);
      var dirty = state.dirtyAttendance[item.applicationId];
      var status = dirty ? dirty.status : item.status;
      var checked = status === '출석';
      return '<tr class="' + (dirty ? 'selected' : '') + '"><td>□</td><td>' + escapeHtml(item.name) + '</td><td>' + escapeHtml(item.studentId) + '</td><td>' + escapeHtml(item.phone) + '</td>' +
        '<td>' + statusBadge(item.applicantType) + '</td><td>' + (paid ? 'O' : 'X') + '</td>' +
        '<td><input type="checkbox" data-role="attendance-toggle" data-id="' + escapeHtml(item.applicationId) + '" ' + (checked ? 'checked' : '') + ' aria-label="' + escapeHtml(item.name) + ' 출석"></td>' +
        '<td>' + statusBadge(checked ? '출석' : '미참석') + '</td></tr>';
    }).join('') : '<tr><td colspan="8" class="ew-table-empty ui-empty">출석 관리 대상이 없습니다.</td></tr>';
    target.innerHTML = '<table class="ew-table ui-table"><thead><tr><th>□</th><th>이름</th><th>학번</th><th>연락처</th><th>학생회비</th><th>참가비</th><th>출석 상태</th><th>비고</th></tr></thead><tbody>' + body + '</tbody></table>' + paginationHtml(data, 'attendance-page');
    renderDirtyBar();
  }

function renderDirtyBar() {
    var target = document.getElementById('ew-dirty-bar');
    if (!target) return;
    var count = Object.keys(state.dirtyAttendance).length;
    target.innerHTML = count ? '<div class="ew-dirty-bar"><div class="ew-dirty-message"><strong>ⓘ 변경사항 ' + count + '건이 있습니다.</strong>선택한 출석 상태가 아직 저장되지 않았습니다.</div>' +
      '<button type="button" class="ew-btn ew-btn-small ui-btn outline small" data-action="cancel-attendance">변경 취소</button><button type="button" class="ew-btn ew-btn-primary ew-btn-small ui-btn primary small" data-action="apply-attendance">변경사항 적용</button></div>' : '';
  }

function loadRefunds(panel) {
    panel.innerHTML = '<div class="ew-card ew-tab-toolbar ui-card ui-toolbar"><strong>환불 대상</strong><span class="ew-spacer"></span><button type="button" class="ew-btn ew-btn-small ui-btn outline small" disabled title="환불 대상 선정 규칙 확인 필요">↻ 대상 동기화</button><button type="button" class="ew-btn ew-btn-outline ew-btn-small ui-btn outline small" disabled title="환불 계좌 필드 계약 확인 필요">환불 파일 내보내기</button></div><div id="ew-refund-table" class="ew-card ew-table-card ui-card"></div>';
    runEventBusy(function () {
      return eventClient.getRefunds({ id: state.currentEventId, page: state.refundPage, pageSize: 10 });
    }).then(renderRefundTable).catch(handleError);
  }

function renderRefundTable(data) {
    var target = document.getElementById('ew-refund-table');
    if (!target) return;
    var body = (data.items || []).length ? data.items.map(function (item) {
      return '<tr><td>' + escapeHtml(item.name) + '</td><td>' + escapeHtml(item.studentId) + '</td><td>' + money(item.refundAmount || 0) + '</td><td>' + displayDate(item.refundDate) + '</td><td>' + statusBadge(item.moneyStatus || '처리 대기') + '</td></tr>';
    }).join('') : '<tr><td colspan="5" class="ew-table-empty ui-empty">환불 대상 데이터가 없습니다. 은행/계좌 물리 필드는 설계 확인이 필요합니다.</td></tr>';
    target.innerHTML = '<table class="ew-table ui-table"><thead><tr><th>이름</th><th>학번</th><th>환불 금액</th><th>환불 처리일</th><th>상태</th></tr></thead><tbody>' + body + '</tbody></table>' + paginationHtml(data, 'refund-page');
  }

function closeModal(event) {
    if (event.target.closest('[data-modal-stop]') && !event.target.classList.contains('ew-modal-close')) return;
    modalRoot.innerHTML = '';
  }

function processApplicant(id, action) {
    runEventBusy(function () { return eventClient.processApplicant({ id: id, action: action }); }).then(function () {
      showToast(action === 'confirmDeposit' ? '입금을 확인했습니다.' : '신청자를 승인했습니다.');
      modalRoot.innerHTML = '';
      goDetail(state.currentEventId, 'applicants');
    }).catch(handleError);
  }

function applyAttendance() {
    var items = Object.keys(state.dirtyAttendance).map(function (key) { return state.dirtyAttendance[key]; });
    runEventBusy(function () {
      return eventClient.applyAttendanceChanges({ id: state.currentEventId, payload: { items: items } });
    }).then(function () {
        state.dirtyAttendance = {};
        showToast('출석 변경사항을 저장했습니다.');
        goDetail(state.currentEventId, 'attendance');
      }).catch(handleError);
  }

document.addEventListener('submit', function (event) {
  event.preventDefault();
  if (event.target.id === 'ew-applicant-search') { state.applicantFilters = readForm(event.target); state.applicantPage = 1; loadApplicants(document.getElementById('ew-tab-panel')); }
  else if (event.target.id === 'ew-attendance-search') { state.attendanceFilters = readForm(event.target); state.attendancePage = 1; loadAttendance(document.getElementById('ew-tab-panel')); }
});
document.addEventListener('click', function (event) {
  var button = event.target.closest('[data-action]'); if (!button || button.disabled) return;
  var action = button.dataset.action;
  if (action === 'go-list') goList();
  else if (action === 'edit-event') goEventForm(button.dataset.id);
  else if (action === 'applicant-page') { state.applicantPage = Number(button.dataset.page); loadApplicants(document.getElementById('ew-tab-panel')); }
  else if (action === 'attendance-page') { state.attendancePage = Number(button.dataset.page); loadAttendance(document.getElementById('ew-tab-panel')); }
  else if (action === 'refund-page') { state.refundPage = Number(button.dataset.page); loadRefunds(document.getElementById('ew-tab-panel')); }
  else if (action === 'detail-tab') { state.activeTab = button.dataset.tab; renderActiveTab(); }
  else if (action === 'applicant-detail') openApplicantModal(button.dataset.id);
  else if (action === 'close-modal') closeModal(event);
  else if (action === 'process-applicant') processApplicant(button.dataset.id, button.dataset.process);
  // TODO(행사 연동): Google Forms와 출석 원본 계약 확정 후 semantic client 연결을 추가한다.
  else if (action === 'cancel-attendance') { state.dirtyAttendance = {}; loadAttendance(document.getElementById('ew-tab-panel')); }
  else if (action === 'apply-attendance') applyAttendance();
  // TODO(행사 환불): 대상 선정 및 계좌 필드 계약 확정 후 semantic client 연결을 추가한다.
});
document.addEventListener('change', function (event) {
  if (!event.target.matches('[data-role="attendance-toggle"]')) return;
  state.dirtyAttendance[event.target.dataset.id] = { applicationId: event.target.dataset.id, status: event.target.checked ? '출석' : '미참석' };
  renderDirtyBar(); event.target.closest('tr').classList.add('selected');
  var badge = event.target.closest('tr').querySelector('td:last-child .ew-status');
  if (badge) {
    badge.textContent = event.target.checked ? '출석' : '미참석';
    badge.className = 'ew-status ' + statusClass(badge.textContent) + ' ui-badge ' + sharedStatusClass(badge.textContent);
  }
});
document.addEventListener('keydown', function (event) { if (event.key === 'Escape' && modalRoot.innerHTML) modalRoot.innerHTML = ''; });
if (!APP_RESOURCE_ID) { showToast('행사 ID가 없습니다.', true); }
else {
  state.currentEventId = APP_RESOURCE_ID; state.activeTab = 'basic';
  runEventBusy(function () { return eventClient.getOverview({ id: APP_RESOURCE_ID }); })
    .then(function (data) { state.detail = data; renderDetailShell(); renderActiveTab(); }).catch(handleError);
}
</script>
