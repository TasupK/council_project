<script>
// 1. 로그인 성공 시 이동할 메인 페이지 연결
// [기능명세 1.3] 로그인 버튼 클릭 시 URL 파라미터로 ?page=main 을 전달하여 메인화면 진입 시도
getElement('loginButton').href = buildPageUrl('main');

// 2. 로그인 실패 메시지 표시
// [기능명세 1.1 & 1.3] 서버 인증 실패 시 반환된 LOGIN_ERROR 문구를 경고창에 표시
if (LOGIN_ERROR) {
  setLoginAlert(LOGIN_ERROR);
}

// 3. 웹앱 페이지 URL 생성
// [기능명세 1.3] WEB_APP_URL 뒤에 page 쿼리를 동적으로 붙여주는 헬퍼 함수
function buildPageUrl(page) {
  var appUrl = WEB_APP_URL || window.location.href;
  var url = new URL(appUrl);
  url.searchParams.set('page', page);
  return url.toString();
}

function setLoginAlert(message) {
  var alert = getElement('loginAlert');
  alert.textContent = message;
  alert.classList.add('show');
}

// 5. DOM 조회
function getElement(id) {
  return document.getElementById(id);
}
</script>
