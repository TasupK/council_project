<!--
  [Settings_Users_View] Figma 사용자 관리 UI
  행: 선택=하늘색 / 신규=하늘색 / 수정=노란색 · 뒤로가기 유지
-->
<header class="page-header ui-page-head">
  <div>
    <p class="crumb">설정 / 사용자·권한 / 사용자 관리</p>
    <div class="settings-title-row">
      <a class="back-btn show settings-back-link" id="settingsBackLink" href="#" target="_top" aria-label="설정으로 돌아가기">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <h1 class="page-title">사용자 관리</h1>
    </div>
  </div>
  <button class="ui-btn primary settings-primary-btn" type="button" id="btnAddUser">+ 사용자 추가</button>
</header>
<div class="workspace settings-figma">
  <div class="page-panel active" id="panel-loading"><div class="loading ui-loading">사용자 불러오는 중…</div></div>
  <div class="page-panel" id="panel-content">
    <div class="settings-dirty-bar" id="userDirtyBar">
      <strong id="userDirtyLabel">0개 변경됨</strong>
      <div class="ui-page-actions"><button class="ui-btn outline" type="button" id="btnDiscardUsers">변경사항 취소</button><button class="ui-btn primary" type="button" id="btnSaveUsers">변경사항 저장 (0)</button></div>
    </div>
    <div class="toolbar ui-toolbar">
      <div class="ui-field grow"><input class="search-field ui-control" id="userQ" type="search" placeholder="이름 또는 이메일 검색" /></div>
      <div class="ui-field"><select class="select ui-control" id="userRole"><option value="">역할 전체</option></select></div>
      <div class="ui-field"><select class="select ui-control" id="userDepartment"><option value="">부서 전체</option><option value="__unassigned__">미배정</option></select></div>
      <div class="ui-field"><select class="select ui-control" id="userStatus"><option value="">상태 전체</option><option value="active">활성</option><option value="inactive">비활성</option></select></div>
      <button class="ui-btn outline" type="button" id="userReset">초기화</button>
      <div class="count-label ui-count" id="userCountLabel">사용자 0명</div><div class="count-label ui-count" id="userMutationStatus" aria-live="polite"></div>
    </div>
    <p class="settings-edit-hint">행을 클릭하면 편집 모드(파란 표시)로 바뀌고, 칸을 수정하면 변경됨(노란 표시)으로 표시됩니다. 변경 후 상단에서 저장하세요.</p>
    <div class="table-wrap ui-table-wrap">
      <table class="data ui-table"><thead><tr><th>이름</th><th>Google 계정 이메일</th><th>학번</th><th>연락처</th><th data-user-department-column>소속부서</th><th>역할</th><th>상태</th><th>최근변경</th></tr></thead><tbody id="userTbody"></tbody></table>
      <div class="table-footer"><span id="userFooterTotal">총 0명</span><span>1 / 1</span></div>
    </div>
  </div>
</div>
<div class="settings-modal-backdrop" id="userSaveModal" role="dialog" aria-modal="true">
  <div class="settings-modal">
    <div class="settings-modal-head"><div><h2>변경사항 저장</h2><p id="userSaveModalSub">사용자 변경사항을 저장하시겠습니까?</p></div><button class="settings-modal-close" type="button" id="userSaveModalClose" aria-label="닫기">✕</button></div>
    <div class="settings-modal-body" id="userSaveModalBody"></div>
    <div class="settings-modal-foot"><button class="ui-btn outline" type="button" id="userSaveModalCancel">취소</button><button class="ui-btn primary" type="button" id="userSaveModalConfirm"><span class="btn-ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h9.5L14 4.5V14H2V2zm2 1v4h7V3H4zm0 6v4h8V9H4z"/></svg></span>변경사항 저장</button></div>
  </div>
</div>
