<script>
  var permissionRoles = [];
  var permissionTree = [];
  var permissionsByRole = {};
  var permissionColumns = [];

  function getSelectedPermissionRole() {
    var roleId = getSettingsElement("permissionRole").value;
    for (var index = 0; index < permissionRoles.length; index += 1) {
      if (permissionRoles[index].id === roleId) return permissionRoles[index];
    }
    return permissionRoles[0] || {};
  }

  function renderSettingsPermissions() {
    var role = getSelectedPermissionRole();
    var rolePermissions = permissionsByRole[role.id] || {};
    var rows = [];
    permissionTree.forEach(function (group) {
      rows.push(
        '<tr class="perm-group"><td>' +
          escapeSettingsHtml(group.name) +
          '<span class="meta-sub">' +
          (group.children || []).length +
          "개 화면</span></td>" +
          renderPermissionCells(rolePermissions[group.id], group.applicable) +
          "</tr>",
      );
      (group.children || []).forEach(function (child) {
        rows.push(
          '<tr class="perm-child"><td>└ ' +
            escapeSettingsHtml(child.name) +
            "</td>" +
            renderPermissionCells(rolePermissions[child.id], child.applicable) +
            "</tr>",
        );
      });
    });
    getSettingsElement("permissionTbody").innerHTML =
      rows.join("") || '<tr><td colspan="6">권한 대상이 없습니다.</td></tr>';
    getSettingsElement("permissionRoleType").textContent =
      role.typeLabel || role.type || "-";
    getSettingsElement("permissionRoleStatus").textContent =
      role.status === "active" ? "활성" : "비활성";
    getSettingsElement("permissionAssigned").textContent =
      (role.assignedCount || 0) + "명";
    getSettingsElement("permissionSaved").textContent = role.updatedAt || "-";
    getSettingsElement("permissionRoleName").textContent = role.name || "";
    getSettingsElement("permissionTotal").textContent =
      "총 " + countPermissionTargets() + "개 권한 대상";
  }

  function renderPermissionCells(values, applicable) {
    return permissionColumns
      .map(function (column) {
        if (applicable && applicable[column.key] === false)
          return '<td class="na">해당 없음</td>';
        var checked = values && values[column.key] ? " checked" : "";
        return (
          '<td><input class="check" type="checkbox" disabled' +
          checked +
          "></td>"
        );
      })
      .join("");
  }

  function countPermissionTargets() {
    var count = 0;
    permissionTree.forEach(function (group) {
      count += 1 + (group.children || []).length;
    });
    return count;
  }

  async function loadSettingsPermissions() {
    try {
      var data = await callSettingsApi("loadSettingsPermissionsData");
      if (!data || !data.ok)
        throw new Error(
          data && data.message
            ? data.message
            : "권한 데이터를 불러오지 못했습니다.",
        );
      applySettingsShell(data);
      permissionRoles = data.roles || [];
      permissionTree = data.permissionTree || [];
      permissionsByRole = data.permissionsByRole || {};
      permissionColumns = data.columns || [];
      getSettingsElement("permissionRole").innerHTML = permissionRoles
        .map(function (role) {
          return (
            '<option value="' +
            escapeSettingsHtml(role.id) +
            '">' +
            escapeSettingsHtml(role.name) +
            "</option>"
          );
        })
        .join("");
      renderSettingsPermissions();
      showSettingsContent();
    } catch (error) {
      showSettingsError(error);
    }
  }

  getSettingsElement("permissionRole").onchange = renderSettingsPermissions;
  // TODO: savePermissionChanges 서버 함수 구현 후 권한 저장 기능 연결
  loadSettingsPermissions();
</script>
