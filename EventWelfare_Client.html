<script>
(function () {
  'use strict';

  var state = {
    view: 'list',
    currentEventId: '',
    eventList: null,
    eventFilters: {},
    eventPage: 1,
    detail: null,
    activeTab: 'basic',
    applicantPage: 1,
    applicantFilters: {},
    attendancePage: 1,
    attendanceFilters: {},
    refundPage: 1,
    dirtyAttendance: {},
    loadingCount: 0
  };

  var content = document.getElementById('ew-content');
  var modalRoot = document.getElementById('ew-modal-root');
  var loading = document.getElementById('ew-loading');
  var toast = document.getElementById('ew-toast');

  function api(functionName, request) {
    setLoading(true);
    return new Promise(function (resolve, reject) {
      if (!window.google || !google.script || !google.script.run) {
        setLoading(false);
        reject(new Error('Google Apps Script 웹앱 환경에서 실행해주세요.'));
        return;
      }
      var runner = google.script.run
        .withSuccessHandler(function (response) {
          setLoading(false);
          if (!response || response.ok !== true) {
            var apiError = response && response.error ? response.error : {};
            var error = new Error(apiError.message || 'API 처리에 실패했습니다.');
            error.code = apiError.code || 'PROCESS_FAILED';
            error.details = apiError.details;
            reject(error);
            return;
          }
          resolve(response.data);
        })
        .withFailureHandler(function (serverError) {
          setLoading(false);
          reject(new Error(serverError && serverError.message
            ? serverError.message
            : '서버 호출에 실패했습니다.'));
        });
      runner[functionName]({
        // TODO(공통 인증): 로그인 사용자/권한 계약이 확정되면 auth를 공통 모듈에서 채운다.
        auth: { email: '' },
        request: request || {}
      });
    });
  }

  function setLoading(isLoading) {
    state.loadingCount = Math.max(0, state.loadingCount + (isLoading ? 1 : -1));
    loading.hidden = state.loadingCount === 0;
  }

  function showToast(message, isError) {
    toast.textContent = message;
    toast.classList.toggle('error', Boolean(isError));
    toast.hidden = false;
    window.clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(function () { toast.hidden = true; }, 4200);
  }

  function handleError(error) {
    var prefix = error && error.code ? '[' + error.code + '] ' : '';
    showToast(prefix + (error && error.message ? error.message : '오류가 발생했습니다.'), true);
  }

  function escapeHtml(value) {
    return String(value === null || typeof value === 'undefined' ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function money(value) {
    if (value === null || value === '' || typeof value === 'undefined') return '확인 필요';
    var number = Number(value);
    return isFinite(number) ? number.toLocaleString('ko-KR') + '원' : escapeHtml(value);
  }

  function displayDate(value) {
    return value ? escapeHtml(String(value).slice(0, 10).replace(/-/g, '.')) : '-';
  }

  function statusClass(value) {
    var text = String(value || '');
    if (['승인', '납부', '출석', '진행중', '입금 완료', '처리 완료', '연동'].indexOf(text) >= 0) return 'ew-status-green';
    if (['반려', '미납', '미참석', '미연동', '오류'].indexOf(text) >= 0) return 'ew-status-red';
    if (['모집중', '대기', '입금 대기', '처리 대기'].indexOf(text) >= 0) return 'ew-status-blue';
    if (text === '예정') return 'ew-status-purple';
    if (text === '동기화 필요') return 'ew-status-orange';
    return 'ew-status-gray';
  }

  function statusBadge(value, fallback) {
    var label = value || fallback || '확인 필요';
    return '<span class="ew-status ' + statusClass(label) + '">' + escapeHtml(label) + '</span>';
  }

  function pageHead(breadcrumb, title, description, actions) {
    return '<section class="ew-page-head">' +
      '<div><small>' + escapeHtml(breadcrumb) + '</small><h1>' + escapeHtml(title) + '</h1>' +
      '<p>' + escapeHtml(description) + '</p></div>' +
      '<div class="ew-page-actions">' + (actions || '') + '</div></section>';
  }

  function paginationHtml(data, action) {
    if (!data || data.totalPages <= 1) return '<div class="ew-pagination"></div>';
    var buttons = '';
    var start = Math.max(1, data.page - 2);
    var end = Math.min(data.totalPages, start + 4);
    for (var page = start; page <= end; page += 1) {
      buttons += '<button type="button" class="ew-page-btn ' + (page === data.page ? 'active' : '') +
        '" data-action="' + action + '" data-page="' + page + '">' + page + '</button>';
    }
    return '<div class="ew-pagination">' +
      '<button type="button" class="ew-page-btn" data-action="' + action + '" data-page="' +
      Math.max(1, data.page - 1) + '" ' + (data.page === 1 ? 'disabled' : '') + '>‹</button>' +
      buttons +
      '<button type="button" class="ew-page-btn" data-action="' + action + '" data-page="' +
      Math.min(data.totalPages, data.page + 1) + '" ' + (data.page === data.totalPages ? 'disabled' : '') + '>›</button>' +
      '</div>';
  }

  function setActiveNav(detailActive) {
    document.querySelectorAll('.ew-subnav').forEach(function (button, index) {
      button.classList.toggle('active', detailActive ? index === 1 : index === 0);
    });
  }

  function goList() {
    state.view = 'list';
    state.activeTab = 'basic';
    setActiveNav(false);
    renderEventListShell();
    loadEventList();
  }

  function renderEventListShell() {
    var filter = state.eventFilters;
    content.innerHTML = pageHead(
      '행사복지관리 / 행사 목록·생성',
      '행사 목록',
      '행사를 검색·필터하고 생성·상세로 이동합니다.',
      '<button type="button" class="ew-btn ew-btn-primary ew-btn-icon" data-action="go-create">＋ 행사 생성</button>'
    ) + '<div class="ew-page-body">' +
      '<form id="ew-event-search" class="ew-card ew-filter-card">' +
        '<div class="ew-filter-top">' +
          field('행사명·키워드 검색', '<input name="keyword" type="search" value="' + escapeHtml(filter.keyword || '') + '" placeholder="행사명·키워드 검색">', 'ew-keyword') +
          '<div class="ew-filter-buttons"><button class="ew-btn" type="button" data-action="reset-event-filters">초기화</button>' +
          '<button class="ew-btn ew-btn-primary ew-btn-icon" type="submit">⌕　검색</button></div>' +
        '</div>' +
        '<div class="ew-filter-grid ew-filter-grid-secondary">' +
          field('담당자', '<select name="manager" id="ew-manager-filter"><option value="">전체 담당자</option></select>') +
          field('진행 일자', '<div class="ew-date-range"><input name="start_date" type="date" value="' + escapeHtml(filter.start_date || '') + '"><span>~</span><input name="end_date" type="date" value="' + escapeHtml(filter.end_date || '') + '"></div>') +
          field('유형', '<select name="event_type" id="ew-type-filter"><option value="">전체 유형</option></select>') +
          field('행사 상태', '<select name="event_status" id="ew-status-filter"><option value="">전체</option></select>') +
        '</div>' +
      '</form>' +
      '<div id="ew-event-summary" class="ew-card ew-summary"></div>' +
      '<div id="ew-event-table" class="ew-card ew-table-card"></div>' +
    '</div>';
  }

  function field(label, control, extraClass) {
    return '<div class="ew-field ' + (extraClass || '') + '"><label>' + label + '</label>' + control + '</div>';
  }

  function loadEventList() {
    api('apiV1_getEventList', {
      filter: state.eventFilters,
      page: state.eventPage,
      pageSize: 10
    }).then(function (data) {
      state.eventList = data;
      fillEventFilterOptions(data.options || {});
      renderEventSummary(data.summary || {});
      renderEventTable(data);
    }).catch(handleError);
  }

  function fillEventFilterOptions(options) {
    fillSelect('ew-manager-filter', options.managers || [], state.eventFilters.manager);
    fillSelect('ew-type-filter', options.eventTypes || [], state.eventFilters.event_type);
    fillSelect('ew-status-filter', options.eventStatuses || [], state.eventFilters.event_status);
  }

  function fillSelect(id, values, selected) {
    var select = document.getElementById(id);
    if (!select) return;
    values.forEach(function (value) {
      var option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      option.selected = value === selected;
      select.appendChild(option);
    });
  }

  function renderEventSummary(summary) {
    var target = document.getElementById('ew-event-summary');
    if (!target) return;
    target.innerHTML = summaryItem('전체 행사', summary.total || 0, '') +
      summaryItem('예정', summary.scheduled || 0, 'purple') +
      summaryItem('모집 중', summary.recruiting || 0, 'blue') +
      summaryItem('진행 중', summary.inProgress || 0, 'green') +
      summaryItem('종료', summary.closed || 0, 'red');
  }

  function summaryItem(label, value, className) {
    return '<div class="ew-summary-item ' + className + '"><span>' + label + '</span><strong>' +
      escapeHtml(value) + '건</strong></div>';
  }

  function renderEventTable(data) {
    var target = document.getElementById('ew-event-table');
    if (!target) return;
    var rows = data.items || [];
    var body = rows.length ? rows.map(function (event) {
      return '<tr class="ew-event-row" data-role="event-row" data-id="' + escapeHtml(event.event_id) + '" title="더블 클릭하여 상세 보기"><td><strong>' + escapeHtml(event.event_name) + '</strong><small>' + escapeHtml(event.event_id) + '</small></td>' +
        '<td>' + escapeHtml(event.manager) + '</td><td>' + displayDate(event.event_date) + '</td>' +
        '<td>' + escapeHtml(event.event_type) + '</td>' +
        '<td>' + statusBadge(event.event_status) + '</td>' +
        '<td><div class="ew-row-actions"><button type="button" class="ew-btn ew-btn-outline ew-btn-small" data-action="go-detail" data-id="' + escapeHtml(event.event_id) + '">상세</button>' +
        '<button type="button" class="ew-btn ew-btn-small" data-action="close-event" data-id="' + escapeHtml(event.event_id) + '" ' + (event.event_status === '종료' ? 'disabled' : '') + '>종료</button></div></td></tr>';
    }).join('') : '<tr><td colspan="6" class="ew-table-empty">조건에 맞는 행사가 없습니다.</td></tr>';
    target.innerHTML = '<table class="ew-table"><thead><tr><th>행사명</th><th>담당자</th><th>진행 일자 ↓</th><th>유형</th><th>행사 상태</th><th>관리</th></tr></thead><tbody>' +
      body + '</tbody></table>' + paginationHtml(data, 'event-page');
  }

  function readForm(form) {
    var data = {};
    new FormData(form).forEach(function (value, key) {
      if (data[key]) data[key] = [].concat(data[key], value);
      else data[key] = value;
    });
    form.querySelectorAll('input[type="checkbox"]').forEach(function (input) {
      data[input.name] = input.checked;
    });
    return data;
  }

  function goEventForm(eventId) {
    state.view = eventId ? 'edit' : 'create';
    setActiveNav(false);
    if (!eventId) {
      renderEventForm(null);
      return;
    }
    api('apiV1_getEventForEdit', { id: eventId })
      .then(renderEventForm)
      .catch(handleError);
  }

  function renderEventForm(event) {
    var isEdit = Boolean(event);
    var value = event || {
      event_status: '예정',
      application_management_enabled: false,
      participation_fee_enabled: false,
      attendance_management_enabled: false,
      settlement_balance_distribution_enabled: false
    };
    content.innerHTML = pageHead(
      '행사복지관리 / 행사 목록·생성 / ' + (isEdit ? '행사 수정' : '행사 생성'),
      '행사 ' + (isEdit ? '수정' : '생성'),
      '행사 DB에 정의된 항목만 저장합니다.',
      '<button type="button" class="ew-btn" data-action="go-list">목록으로</button>'
    ) + '<div class="ew-page-body"><form id="ew-event-form" class="ew-card ew-form-card" data-id="' + escapeHtml(value.event_id || '') + '">' +
      formRow('행사명 *', '<input name="event_name" required value="' + escapeHtml(value.event_name || '') + '">') +
      formRow('유형 *', '<input name="event_type" required value="' + escapeHtml(value.event_type || '') + '" placeholder="예: MT, 개강총회">') +
      formRow('행사 목적 *', '<textarea name="event_purpose" required placeholder="행사의 목적과 취지를 입력해주세요.">' + escapeHtml(value.event_purpose || '') + '</textarea>') +
      formRow('모집 기간 *', '<div class="ew-date-range"><input name="recruit_start_date" type="date" required value="' + escapeHtml(value.recruit_start_date || '') + '"><span>~</span><input name="recruit_end_date" type="date" required value="' + escapeHtml(value.recruit_end_date || '') + '"></div>') +
      formRow('행사 진행 기간 *', '<div class="ew-date-range"><input name="event_date" type="date" required value="' + escapeHtml(value.event_date || '') + '"><span>~</span><input name="event_end_date" type="date" required value="' + escapeHtml(value.event_end_date || '') + '"></div>') +
      formRow('정원 *', '<input name="capacity" type="number" min="0" required value="' + escapeHtml(value.capacity || '') + '">') +
      formRow('담당자 ID *', '<input name="manager" required value="' + escapeHtml(value.manager || '') + '">') +
      managementOptionsFormRow(value) +
      feeFormRow(value) +
      formRow('진행상태 *', statusRadios(value.event_status)) +
      '<div class="ew-form-submit"><button class="ew-btn ew-btn-primary" type="submit">저장</button></div>' +
    '</form></div>';
  }

  function formRow(label, control) {
    return '<div class="ew-form-row"><div class="ew-form-label">' + label + '</div><div class="ew-form-control">' + control + '</div></div>';
  }

  function clientBoolean(value) {
    var text = String(value === null || typeof value === 'undefined' ? '' : value)
      .trim()
      .toLowerCase();
    return value === true || value === 1 || text === '1' || text === 'true' ||
      text === 'y' || text === 'yes' || text === 'o';
  }

  function eventFeeEnabled(value) {
    var configured = value && value.participation_fee_enabled;
    if (configured !== null && typeof configured !== 'undefined' && String(configured).trim() !== '') {
      return clientBoolean(configured);
    }
    var memberFee = Number(String(value && value.fee_amount || 0).replace(/,/g, '')) || 0;
    var nonMemberFee = Number(String(value && value.non_member_fee_amount || 0).replace(/,/g, '')) || 0;
    return memberFee > 0 || nonMemberFee > 0;
  }

  function managementOptionsFormRow(value) {
    return formRow('관리 설정', '<div class="ew-management-options">' +
      managementChoice('신청 관리 여부', 'application_management_enabled', value.application_management_enabled) +
      managementChoice('참가비 여부', 'participation_fee_enabled', eventFeeEnabled(value), 'participation-fee-enabled') +
      managementChoice('출석 관리 여부', 'attendance_management_enabled', value.attendance_management_enabled) +
      managementChoice('결산 잔액 분배 여부', 'settlement_balance_distribution_enabled', value.settlement_balance_distribution_enabled) +
      '</div>');
  }

  function managementChoice(label, name, selected, role) {
    var enabled = clientBoolean(selected);
    var roleAttribute = role ? ' data-role="' + role + '"' : '';
    return '<div class="ew-management-option"><strong>' + escapeHtml(label) + '</strong><div class="ew-radio-group">' +
      '<label class="ew-radio-pill"><input type="radio" name="' + name + '" value="true" ' + (enabled ? 'checked' : '') + roleAttribute + '><span>예</span></label>' +
      '<label class="ew-radio-pill"><input type="radio" name="' + name + '" value="false" ' + (!enabled ? 'checked' : '') + roleAttribute + '><span>아니오</span></label>' +
      '</div></div>';
  }

  function feeFormRow(value) {
    var enabled = eventFeeEnabled(value);
    var disabled = enabled ? '' : ' disabled';
    var memberFee = enabled && value.fee_amount !== null && typeof value.fee_amount !== 'undefined'
      ? value.fee_amount : '';
    var nonMemberFee = enabled && value.non_member_fee_amount !== null && typeof value.non_member_fee_amount !== 'undefined'
      ? value.non_member_fee_amount : '';
    return '<div class="ew-form-row ew-fee-form-row">' +
      '<div class="ew-form-label ew-fee-main-label"><span>참가비</span><small>선택 입력</small></div>' +
      '<div class="ew-fee-options">' +
        '<div class="ew-fee-option"><label for="ew-member-fee">납부자</label><div class="ew-money-input"><input id="ew-member-fee" name="fee_amount" type="number" min="0" placeholder="0" value="' + escapeHtml(memberFee) + '"' + disabled + '><span>원</span></div></div>' +
        '<div class="ew-fee-option"><label for="ew-non-member-fee">미납부자</label><div class="ew-money-input"><input id="ew-non-member-fee" name="non_member_fee_amount" type="number" min="0" placeholder="0" value="' + escapeHtml(nonMemberFee) + '"' + disabled + '><span>원</span></div></div>' +
      '</div></div>';
  }

  function textWithBreaks(value) {
    return escapeHtml(value || '-').replace(/\r?\n/g, '<br>');
  }

  function driveFileLinks(value) {
    var ids = String(value || '').split(',').map(function (id) { return id.trim(); })
      .filter(function (id) { return /^[A-Za-z0-9_-]{20,}$/.test(id); });
    if (!ids.length) return '-';
    return ids.map(function (id, index) {
      return '<a class="ew-inline-link" href="https://drive.google.com/open?id=' + encodeURIComponent(id) + '" target="_blank" rel="noopener">증빙 ' + (index + 1) + '</a>';
    }).join(' · ');
  }

  function statusRadios(selected) {
    return '<div class="ew-radio-group">' + ['예정', '모집중', '진행중', '종료'].map(function (status) {
      return '<label class="ew-radio-pill"><input type="radio" name="event_status" value="' + status + '" ' + (status === selected ? 'checked' : '') + ' required><span>' + status + '</span></label>';
    }).join('') + '</div>';
  }

  function goDetail(eventId, tab) {
    if (!eventId) {
      showToast('행사 목록에서 상세 행사를 먼저 선택해주세요.', true);
      return;
    }
    state.view = 'detail';
    if (state.currentEventId && state.currentEventId !== eventId) state.dirtyAttendance = {};
    state.currentEventId = eventId;
    state.activeTab = tab || state.activeTab || 'basic';
    setActiveNav(true);
    if (state.detail && String(state.detail.event.event_id) === String(eventId)) {
      renderDetailShell();
      renderActiveTab();
      return;
    }
    api('apiV1_getEventDetail', { id: eventId }).then(function (data) {
      state.detail = data;
      renderDetailShell();
      renderActiveTab();
    }).catch(handleError);
  }

  function renderDetailShell() {
    var detail = state.detail;
    var event = detail.event;
    var summary = detail.summary || {};
    content.innerHTML = pageHead(
      '행사복지관리 / 행사 상세 관리',
      '행사복지관리 상세',
      '행사 신청자, 참가비, 출석 및 환불 업무를 통합 관리합니다.',
      '<button type="button" class="ew-btn" data-action="go-list">목록으로</button>' +
      '<button type="button" class="ew-btn ew-btn-outline" data-action="sync-form-responses">↻ Google Form 응답 불러오기</button>' +
      '<button type="button" class="ew-btn ew-btn-primary ew-btn-icon" data-action="edit-event" data-id="' + escapeHtml(event.event_id) + '">＋ 행사 정보 수정</button>'
    ) + '<div class="ew-page-body"><section class="ew-card ew-event-hero">' +
      '<div class="ew-event-title"><h2>' + escapeHtml(event.event_name) + '</h2>' + statusBadge(event.event_status) + '</div>' +
      '<div class="ew-event-meta"><span>' + escapeHtml(event.event_type) + '</span><span>담당자 ID ' + escapeHtml(event.manager) + '</span>' +
      '<span>모집기간 ' + displayDate(event.recruit_start_date) + ' ~ ' + displayDate(event.recruit_end_date) + '</span><span>행사기간 ' + displayDate(event.event_date) + ' ~ ' + displayDate(event.event_end_date) + '</span>' +
      '<span>Google Form ' + escapeHtml((detail.formSync || {}).connectionStatus || '미연동') + '</span></div>' +
    '</section><div class="ew-kpis">' +
      kpi('전체 신청자', summary.totalApplicants, '명') +
      kpi('승인 참가자', summary.approvedApplicants, '명') +
      kpi('참가비 입금 완료', summary.paidApplicants, '명') +
      kpi('실제 출석자', summary.actualAttendees, '명') +
    '</div><div class="ew-tabs">' + tabsHtml() + '</div>' +
    '<div id="ew-tab-panel" class="ew-detail-body"></div></div>';
  }

  function kpi(label, value, unit, className) {
    var text = value === null || typeof value === 'undefined' ? '확인 필요' : escapeHtml(value) + unit;
    return '<div class="ew-card ew-kpi ' + (className || '') + '"><span>' + label + '</span><strong>' + text + '</strong></div>';
  }

  function tabsHtml() {
    var tabs = [
      ['basic', '기본정보'], ['applicants', '신청자'], ['attendance', '참가비·출석'],
      ['refund', '환불']
    ];
    return tabs.map(function (tab) {
      return '<button type="button" class="ew-tab ' + (state.activeTab === tab[0] ? 'active' : '') + '" data-action="detail-tab" data-tab="' + tab[0] + '">' + tab[1] + '</button>';
    }).join('');
  }

  function renderActiveTab() {
    var panel = document.getElementById('ew-tab-panel');
    if (!panel) return;
    document.querySelectorAll('.ew-tab').forEach(function (tab) {
      tab.classList.toggle('active', tab.dataset.tab === state.activeTab);
    });
    if (state.activeTab === 'basic') renderBasicTab(panel);

      info('신청 관리 여부', managementMark(event.application_management_enabled), true) +

      '<label class="ew-modal-field"><span>Google Form ID 또는 URL</span><input name="google_form_id" value="' + escapeHtml(sync.googleFormId || '') + '" placeholder="docs.google.com/forms/... 또는 Form ID"></label>' +
      '<label class="ew-modal-field"><span>응답 Spreadsheet ID 또는 URL</span><input name="response_spreadsheet_id" value="' + escapeHtml(sync.responseSpreadsheetId || '') + '" placeholder="docs.google.com/spreadsheets/... 또는 Spreadsheet ID"></label>' +

  function startFormSync() {
    var sync = state.detail && state.detail.formSync || {};
    if (!sync.configured) {
      openFormSyncSettings();
      return;
    }
    syncFormResponses({});
  }

  function syncFormResponses(payload) {
    return api('apiV1_syncApplicantsFromForms', {
      id: state.currentEventId,
      payload: payload || {}
    }).then(function (result) {
      mergeImportedApplicants(result.importedItems || []);
      state.detail.formSync = result.formSync || state.detail.formSync;
      refreshDetailSummary();
      modalRoot.innerHTML = '';
      renderDetailShell();
      renderActiveTab();
      var message = 'Google Form 신규 응답 ' + Number(result.importedCount || 0) + '건을 가져왔습니다.';
      if (result.duplicateCount) message += ' 기존 응답 ' + result.duplicateCount + '건은 건너뛰었습니다.';
      if (result.invalidCount) message += ' 필수값 누락 ' + result.invalidCount + '건은 제외했습니다.';
      showToast(message);
    }).catch(handleError);
  }

  function mergeImportedApplicants(items) {
    var applicants = state.detail.applicants || [];
    var attendanceRows = state.detail.attendanceRows || [];
    var existing = {};
    applicants.forEach(function (item) { existing[String(item.application_id)] = true; });
    items.forEach(function (item) {
      if (existing[String(item.application_id)]) return;
      existing[String(item.application_id)] = true;
      applicants.push(item);
      var attendanceRow = {};
      Object.keys(item).forEach(function (key) { attendanceRow[key] = item[key]; });
      attendanceRow.confirmed_at = '';
      attendanceRow.attendance_status = '';
      attendanceRow.attendance_checker = '';
      attendanceRows.push(attendanceRow);
    });
    state.detail.applicants = applicants;
    state.detail.attendanceRows = attendanceRows;
  }

  function refreshDetailSummary() {
    var applicants = state.detail.applicants || [];
    var attendanceRows = state.detail.attendanceRows || [];
    var feeEnabled = eventFeeEnabled(state.detail.event || {});
    state.detail.summary = {
      totalApplicants: applicants.length,
      approvedApplicants: applicants.filter(function (item) { return item.approval_status === '승인'; }).length,
      paidApplicants: feeEnabled ? applicants.filter(function (item) {
        var amountDue = Number(item.amount_due || 0);
        return amountDue > 0 && Number(item.amount_paid || 0) >= amountDue;
      }).length : 0,
      actualAttendees: attendanceRows.filter(function (item) {
        return item.attendance_status === '출석';
      }).length
    };
  }

  function loadApplicants(panel) {
    panel.innerHTML = applicantsToolbar() + '<div id="ew-applicants-table" class="ew-card ew-table-card"></div>';
    var filter = state.applicantFilters;
    var keyword = String(filter.keyword || '').toLowerCase();
    var rows = (state.detail.applicants || []).filter(function (row) {
      if (keyword && [row.name, row.student_id, row.phone, row.depositor_name]
        .join(' ').toLowerCase().indexOf(keyword) < 0) return false;
      if (filter.approval_status && row.approval_status !== filter.approval_status) return false;
      return true;
    }).sort(function (a, b) {
      return String(b.applied_at || '').localeCompare(String(a.applied_at || ''));
    });
    renderApplicantsTable(localPaginate(rows, state.applicantPage, 10));
  }

  function applicantsToolbar() {
    var filter = state.applicantFilters;
    return '<form id="ew-applicant-search" class="ew-card ew-tab-toolbar">' +
      '<strong>신청자</strong><span class="ew-spacer"></span>' +
      '<input name="keyword" type="search" value="' + escapeHtml(filter.keyword || '') + '" placeholder="이름, 학번, 연락처 검색">' +
      '<select name="approval_status"><option value="">승인 상태</option><option value="대기" ' + selected(filter.approval_status, '대기') + '>대기</option><option value="승인" ' + selected(filter.approval_status, '승인') + '>승인</option><option value="반려" ' + selected(filter.approval_status, '반려') + '>반려</option></select>' +

  }

    var feeEnabled = eventFeeEnabled(state.detail && state.detail.event || {});
    var body = (data.items || []).length ? data.items.map(function (item) {

        '<td>' + statusBadge(feeEnabled ? (paid ? '입금 완료' : '입금 대기') : '없음') + '</td><td><button type="button" class="ew-btn ew-btn-outline ew-btn-small" data-action="applicant-detail" data-id="' + escapeHtml(item.application_id) + '">보기</button></td></tr>';
    }).join('') : '<tr><td colspan="8" class="ew-table-empty">신청자 데이터가 없습니다.</td></tr>';
    target.innerHTML = '<table class="ew-table"><thead><tr><th>신청일시</th><th>이름</th><th>학번</th><th>연락처</th><th>신청자 구분</th><th>승인</th><th>참가비</th><th>상세</th></tr></thead><tbody>' + body + '</tbody></table>' + paginationHtml(data, 'applicant-page');

  function openApplicantModal(applicationId) {
    var item = (state.detail.applicants || []).find(function (row) {
      return String(row.application_id) === String(applicationId);
    });
    if (!item) {
      showToast('신청자 정보를 찾을 수 없습니다.', true);
      return;
    }
    var feeEnabled = eventFeeEnabled(state.detail && state.detail.event || {});
    var paid = feeEnabled && Number(item.amount_due || 0) > 0 &&
      Number(item.amount_paid || 0) >= Number(item.amount_due || 0);

      ? '<button type="button" class="ew-btn" data-action="process-applicant" data-id="' + escapeHtml(item.application_id) + '" data-process="confirmDeposit">입금 확인</button>'
      : '') + '<button type="button" class="ew-btn ew-btn-primary" data-action="process-applicant" data-id="' + escapeHtml(item.application_id) + '" data-process="approve">승인</button>';
    modalRoot.innerHTML = '<div class="ew-modal-backdrop" data-action="close-modal"><section class="ew-modal" role="dialog" aria-modal="true" aria-labelledby="ew-modal-title" data-modal-stop>' +
      '<header class="ew-modal-head"><h2 id="ew-modal-title">신청자 상세</h2><button class="ew-modal-close" type="button" data-action="close-modal" aria-label="닫기">×</button></header>' +
      '<div class="ew-modal-body"><dl class="ew-modal-info">' + info('이름', item.name) + info('학번', item.student_id) +
      info('연락처', item.phone) + '</dl><div class="ew-modal-divider"></div>' +
      '<dl class="ew-modal-info">' + info('신청자 구분', statusBadge(item.applicant_type), true) +
      info('참가비 입금 상태', statusBadge(feeEnabled ? (paid ? '입금 완료' : '입금 대기') : '없음'), true) +
      info('입금 증빙', driveFileLinks(item.payment_capture_file_id), true) +
      info('승인 상태', statusBadge(item.approval_status), true) + '</dl></div>' +
      '<footer class="ew-modal-actions ' + (feeEnabled && !paid ? 'ew-two-actions' : '') + '">' + modalActions + '</footer>' +
      '</section></div>';

  function loadAttendance(panel) {
    panel.innerHTML = attendanceToolbar() + '<div id="ew-attendance-table" class="ew-card ew-table-card"></div><div id="ew-dirty-bar"></div>';
    var filter = state.attendanceFilters;
    var keyword = String(filter.keyword || '').toLowerCase();
    var rows = (state.detail.attendanceRows || []).filter(function (row) {
      if (keyword && [row.name, row.student_id, row.phone]
        .join(' ').toLowerCase().indexOf(keyword) < 0) return false;
      var amountDue = Number(row.amount_due || 0);
      var isPaid = amountDue > 0 && Number(row.amount_paid || 0) >= amountDue;
      if (filter.fee_status === 'paid' && !isPaid) return false;
      if (filter.fee_status === 'unpaid' && isPaid) return false;
      if (filter.attendance_status && row.attendance_status !== filter.attendance_status) return false;
      return true;
    });
    renderAttendanceTable(localPaginate(rows, state.attendancePage, 10));
  }

  function attendanceToolbar() {
    var filter = state.attendanceFilters;
    var feeEnabled = eventFeeEnabled(state.detail && state.detail.event || {});
    return '<form id="ew-attendance-search" class="ew-card ew-tab-toolbar"><strong>출석 관리</strong><span class="ew-spacer"></span>' +
      '<input name="keyword" type="search" value="' + escapeHtml(filter.keyword || '') + '" placeholder="이름, 학번, 연락처 검색">' +
      (feeEnabled ? '<select name="fee_status"><option value="">참가비 상태</option><option value="paid" ' + selected(filter.fee_status, 'paid') + '>입금 완료</option><option value="unpaid" ' + selected(filter.fee_status, 'unpaid') + '>미입금</option></select>' : '') +
      '<select name="attendance_status"><option value="">출석 상태</option><option value="출석" ' + selected(filter.attendance_status, '출석') + '>출석</option><option value="미참석" ' + selected(filter.attendance_status, '미참석') + '>미참석</option></select>' +
      '<button class="ew-btn ew-btn-primary ew-btn-small" type="submit">검색</button></form>';
  }

  function selected(current, value) {
    return current === value ? 'selected' : '';
  }

  function localPaginate(items, page, pageSize) {
    var totalCount = items.length;
    var totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
    var safePage = Math.min(Math.max(1, Number(page) || 1), totalPages);
    var offset = (safePage - 1) * pageSize;
    return {
      items: items.slice(offset, offset + pageSize),
      page: safePage,
      pageSize: pageSize,
      totalCount: totalCount,
      totalPages: totalPages
    };
  }

  function renderAttendanceTable(data) {
    var target = document.getElementById('ew-attendance-table');
    if (!target) return;
    var feeEnabled = eventFeeEnabled(state.detail && state.detail.event || {});
    var body = (data.items || []).length ? data.items.map(function (item) {
      var paid = feeEnabled && Number(item.amount_due || 0) > 0 &&
        Number(item.amount_paid || 0) >= Number(item.amount_due || 0);
      var dirty = state.dirtyAttendance[item.application_id];
      var status = dirty ? dirty.attendance_status : item.attendance_status;
      var checked = status === '출석';
      return '<tr class="' + (dirty ? 'selected' : '') + '"><td>□</td><td>' + escapeHtml(item.name) + '</td><td>' + escapeHtml(item.student_id) + '</td><td>' + escapeHtml(item.phone) + '</td>' +
        '<td>' + statusBadge(item.applicant_type) + '</td><td>' + (feeEnabled ? (paid ? 'O' : 'X') : '-') + '</td>' +
        '<td><input type="checkbox" data-role="attendance-toggle" data-id="' + escapeHtml(item.application_id) + '" ' + (checked ? 'checked' : '') + ' aria-label="' + escapeHtml(item.name) + ' 출석"></td>' +
        '<td>' + statusBadge(checked ? '출석' : '미참석') + '</td></tr>';
    }).join('') : '<tr><td colspan="8" class="ew-table-empty">출석 관리 대상이 없습니다.</td></tr>';
    target.innerHTML = '<table class="ew-table"><thead><tr><th>□</th><th>이름</th><th>학번</th><th>연락처</th><th>신청자 구분</th><th>참가비</th><th>출석 상태</th><th>비고</th></tr></thead><tbody>' + body + '</tbody></table>' + paginationHtml(data, 'attendance-page');
    renderDirtyBar();
  }

  function renderDirtyBar() {
    var target = document.getElementById('ew-dirty-bar');
    if (!target) return;
    var count = Object.keys(state.dirtyAttendance).length;
    target.innerHTML = count ? '<div class="ew-dirty-bar"><div class="ew-dirty-message"><strong>ⓘ 변경사항 ' + count + '건이 있습니다.</strong>선택한 출석 상태가 아직 저장되지 않았습니다.</div>' +
      '<button type="button" class="ew-btn ew-btn-small" data-action="cancel-attendance">변경 취소</button><button type="button" class="ew-btn ew-btn-primary ew-btn-small" data-action="apply-attendance">변경사항 적용</button></div>' : '';
  }

  function loadRefunds(panel) {
    panel.innerHTML = '<div class="ew-card ew-tab-toolbar"><strong>환불 대상</strong></div><div id="ew-refund-table" class="ew-card ew-table-card"></div>';
    renderRefundTable(localPaginate(state.detail.refunds || [], state.refundPage, 10));

  function renderRefundTable(data) {
    var target = document.getElementById('ew-refund-table');
    if (!target) return;
    var body = (data.items || []).length ? data.items.map(function (item) {
      return '<tr><td>' + escapeHtml(item.name) + '</td><td>' + escapeHtml(item.student_id) + '</td><td>' + money(item.refund_amount || 0) + '</td><td>' + displayDate(item.refund_date) + '</td><td>' + statusBadge(item.payment_status || (item.refund_date ? '처리 완료' : '처리 대기')) + '</td></tr>';
    }).join('') : '<tr><td colspan="5" class="ew-table-empty">환불 대상 데이터가 없습니다.</td></tr>';
    target.innerHTML = '<table class="ew-table"><thead><tr><th>이름</th><th>학번</th><th>환불 금액</th><th>환불 처리일</th><th>상태</th></tr></thead><tbody>' + body + '</tbody></table>' + paginationHtml(data, 'refund-page');
  }

  content.addEventListener('submit', function (event) {
    event.preventDefault();
    if (event.target.id === 'ew-event-search') {
      state.eventFilters = readForm(event.target);
      state.eventPage = 1;
      loadEventList();
    } else if (event.target.id === 'ew-event-form') {
      var eventForm = event.target;
      var payload = readForm(eventForm);
      var id = eventForm.dataset.id;
      var saveButton = eventForm.querySelector('button[type="submit"]');
      if (saveButton) saveButton.disabled = true;
      api(id ? 'apiV1_updateEvent' : 'apiV1_createEvent', id ? { id: id, payload: payload } : { payload: payload })
        .then(function (saved) {
          showToast('행사 정보가 저장되었습니다.');
          state.detail = null;
          goDetail(saved.event_id, 'basic');
        })
        .catch(handleError)
        .finally(function () {
          if (saveButton && document.contains(saveButton)) saveButton.disabled = false;
        });
    } else if (event.target.id === 'ew-applicant-search') {
      state.applicantFilters = readForm(event.target);
      state.applicantPage = 1;
      loadApplicants(document.getElementById('ew-tab-panel'));
    } else if (event.target.id === 'ew-attendance-search') {
      state.attendanceFilters = readForm(event.target);
      state.attendancePage = 1;
      loadAttendance(document.getElementById('ew-tab-panel'));
    }
  });

  modalRoot.addEventListener('submit', function (event) {
    if (event.target.id !== 'ew-form-sync-form') return;
    event.preventDefault();
    var payload = readForm(event.target);
    var submitButton = event.target.querySelector('button[type="submit"]');
    if (submitButton) submitButton.disabled = true;
    syncFormResponses(payload).finally(function () {
      if (submitButton && document.contains(submitButton)) submitButton.disabled = false;
    });
  });

  document.addEventListener('click', function (event) {
    var button = event.target.closest('[data-action]');
    if (!button || button.disabled) return;
    var action = button.dataset.action;
    if (action === 'go-list') goList();
    else if (action === 'go-create') goEventForm('');
    else if (action === 'reset-event-filters') {
      state.eventFilters = {};
      state.eventPage = 1;
      renderEventListShell();
      loadEventList();
    }
    else if (action === 'go-detail') goDetail(button.dataset.id, 'basic');
    else if (action === 'go-current-detail') goDetail(state.currentEventId, 'basic');
    else if (action === 'edit-event') goEventForm(button.dataset.id);
    else if (action === 'sync-form-responses') startFormSync();
    else if (action === 'form-sync-settings') openFormSyncSettings();
    else if (action === 'event-page') { state.eventPage = Number(button.dataset.page); loadEventList(); }
    else if (action === 'applicant-page') { state.applicantPage = Number(button.dataset.page); loadApplicants(document.getElementById('ew-tab-panel')); }
    else if (action === 'attendance-page') { state.attendancePage = Number(button.dataset.page); loadAttendance(document.getElementById('ew-tab-panel')); }
    else if (action === 'refund-page') { state.refundPage = Number(button.dataset.page); loadRefunds(document.getElementById('ew-tab-panel')); }
    else if (action === 'detail-tab') { state.activeTab = button.dataset.tab; renderActiveTab(); }
    else if (action === 'close-event') closeEvent(button.dataset.id);
    else if (action === 'applicant-detail') openApplicantModal(button.dataset.id);
    else if (action === 'close-modal') closeModal(event);
    else if (action === 'process-applicant') processApplicant(button.dataset.id, button.dataset.process);
    else if (action === 'cancel-attendance') { state.dirtyAttendance = {}; loadAttendance(document.getElementById('ew-tab-panel')); }
    else if (action === 'apply-attendance') applyAttendance();
  });

  content.addEventListener('dblclick', function (event) {
    var row = event.target.closest('[data-role="event-row"]');
    if (!row || event.target.closest('button, a, input, select, textarea')) return;
    goDetail(row.dataset.id, 'basic');
  });

  document.addEventListener('change', function (event) {
    if (event.target.matches('[data-role="participation-fee-enabled"]')) {
      var feeEnabled = event.target.value === 'true';
      document.querySelectorAll('#ew-member-fee, #ew-non-member-fee').forEach(function (input) {
        input.disabled = !feeEnabled;
        if (!feeEnabled) input.value = '';
      });
    } else if (event.target.matches('[data-role="attendance-toggle"]')) {
      state.dirtyAttendance[event.target.dataset.id] = {
        application_id: event.target.dataset.id,
        attendance_status: event.target.checked ? '출석' : '미참석'
      };
      renderDirtyBar();
      event.target.closest('tr').classList.add('selected');
      var badge = event.target.closest('tr').querySelector('td:last-child .ew-status');
      if (badge) {
        badge.textContent = event.target.checked ? '출석' : '미참석';
        badge.className = 'ew-status ' + statusClass(badge.textContent);
      }
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && modalRoot.innerHTML) modalRoot.innerHTML = '';
  });

  function closeEvent(id) {
    if (!window.confirm('이 행사를 종료 상태로 변경하시겠습니까?')) return;
    api('apiV1_closeEvent', { id: id })
      .then(function () { showToast('행사를 종료했습니다.'); loadEventList(); })
      .catch(handleError);
  }

  function closeModal(event) {
    if (event.target.closest('[data-modal-stop]') && !event.target.closest('[data-action="close-modal"]')) return;
    modalRoot.innerHTML = '';
  }

  function processApplicant(id, action) {
    api('apiV1_processApplicant', { id: id, action: action }).then(function (updated) {
      state.detail.applicants = (state.detail.applicants || []).map(function (item) {
        if (String(item.application_id) !== String(id)) return item;
        var merged = {};
        Object.keys(item).forEach(function (key) { merged[key] = item[key]; });
        Object.keys(updated || {}).forEach(function (key) { merged[key] = updated[key]; });
        return merged;
      });
      state.detail.attendanceRows = (state.detail.attendanceRows || []).map(function (item) {
        if (String(item.application_id) !== String(id)) return item;
        var merged = {};
        Object.keys(item).forEach(function (key) { merged[key] = item[key]; });
        Object.keys(updated || {}).forEach(function (key) { merged[key] = updated[key]; });
        return merged;
      });
      refreshDetailSummary();
      showToast(action === 'confirmDeposit' ? '입금을 확인했습니다.' : '신청자를 승인했습니다.');
      modalRoot.innerHTML = '';
      renderDetailShell();
      renderActiveTab();
    }).catch(handleError);
  }

  function applyAttendance() {
    var items = Object.keys(state.dirtyAttendance).map(function (key) { return state.dirtyAttendance[key]; });
    api('apiV1_applyAttendanceChanges', { id: state.currentEventId, payload: { items: items } })
      .then(function (updatedItems) {
        var updatedById = {};
        (updatedItems || []).forEach(function (item) {
          updatedById[String(item.application_id)] = item;
        });
        state.detail.attendanceRows = (state.detail.attendanceRows || []).map(function (item) {
          var updated = updatedById[String(item.application_id)];
          if (!updated) return item;
          var merged = {};
          Object.keys(item).forEach(function (key) { merged[key] = item[key]; });
          Object.keys(updated).forEach(function (key) { merged[key] = updated[key]; });
          return merged;
        });
        state.dirtyAttendance = {};
        refreshDetailSummary();
        showToast('출석 변경사항을 저장했습니다.');
        renderDetailShell();
        renderActiveTab();
      }).catch(handleError);
  }

  goList();
}());
</script>
